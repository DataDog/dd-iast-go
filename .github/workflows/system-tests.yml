name: System Tests

on:
  workflow_call:
    inputs:
      branch_ref:
        description: The dd-iast-go revision to test
        required: true
        type: string
      system_tests_ref:
        description: The system-tests revision to use
        required: false
        default: romain.marcadier/dd-iast-go
        type: string
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      system_tests_ref:
        description: The system-tests ref, tag, or branch to use
        required: true
        default: romain.marcadier/dd-iast-go
        type: string
  schedule:
    - cron: "00 04 * * *"

concurrency:
  group: system-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  warm-repo-cache:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Checkout system-tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: DataDog/system-tests
          # TODO: Switch the fallback to main once the dd-iast-go support lands.
          ref: ${{ inputs.system_tests_ref || 'romain.marcadier/dd-iast-go' }}

      - name: Pin exact system-tests commit
        id: pin
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache system-tests repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git
          key: gitdb-system-tests-${{ steps.pin.outputs.sha }}

  build-weblog-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'DataDog/dd-iast-go'
    runs-on: ubuntu-latest
    needs:
      - warm-repo-cache
    steps:
      - name: Restore system-tests repository cache
        id: restore-repo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git
          key: gitdb-system-tests-${{ needs.warm-repo-cache.outputs.sha }}

      - name: Checkout cached system-tests revision
        if: steps.restore-repo-cache.outcome == 'success' && steps.restore-repo-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          git config safe.directory "$GITHUB_WORKSPACE"
          git checkout -f ${{ needs.warm-repo-cache.outputs.sha }}

      - name: Checkout system-tests on cache miss
        if: steps.restore-repo-cache.outcome == 'failure' || steps.restore-repo-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: DataDog/system-tests
          ref: ${{ needs.warm-repo-cache.outputs.sha }}

      - name: Checkout dd-iast-go
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.branch_ref || github.sha }}
          path: binaries/dd-iast-go

      - name: Pin orchestrion dependency
        shell: bash
        run: |
          version=$(go -C binaries/dd-iast-go list -m -f '{{ .Version }}' -- github.com/DataDog/orchestrion)
          if [[ -z "$version" ]]; then
            echo "Unable to find github.com/DataDog/orchestrion in dd-iast-go/go.mod" >&2
            exit 1
          fi
          printf 'github.com/DataDog/orchestrion@%s\n' "$version" > binaries/orchestrion-load-from-go-get

      - name: Pin dd-trace-go dependency
        shell: bash
        run: |
          version=$(go -C binaries/dd-iast-go list -m -f '{{ .Version }}' -- github.com/DataDog/dd-trace-go/v2)
          if [[ -z "$version" ]]; then
            echo "Unable to find github.com/DataDog/dd-trace-go/v2 in dd-iast-go/go.mod" >&2
            exit 1
          fi
          printf 'github.com/DataDog/dd-trace-go/v2@%s\n' "$version" > binaries/golang-load-from-go-get

      - name: Prepare GitHub token for private modules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf '%s' "$GH_TOKEN" > "$RUNNER_TEMP/github_token.txt"

      - name: Build and save weblog image
        run: |
          ./build.sh golang -i weblog -w net-http-orchestrion \
            --save-to-binaries \
            --github-token-file "$RUNNER_TEMP/github_token.txt"

      - name: Remove GitHub token
        if: always()
        run: rm -f "$RUNNER_TEMP/github_token.txt"

      - name: Upload weblog image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weblog-image-net-http-orchestrion
          path: binaries/golang-net-http-orchestrion-weblog.tar.zst
          retention-days: 1

  system-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'DataDog/dd-iast-go'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - warm-repo-cache
      - build-weblog-image
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - DEFAULT
          - IAST_DEDUPLICATION
    env:
      SYSTEM_TESTS_WEBLOG: net-http-orchestrion
    name: Test (net-http-orchestrion, ${{ matrix.scenario }})
    steps:
      - name: Restore system-tests repository cache
        id: restore-repo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git
          key: gitdb-system-tests-${{ needs.warm-repo-cache.outputs.sha }}

      - name: Checkout cached system-tests revision
        if: steps.restore-repo-cache.outcome == 'success' && steps.restore-repo-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          git config safe.directory "$GITHUB_WORKSPACE"
          git checkout -f ${{ needs.warm-repo-cache.outputs.sha }}

      - name: Checkout system-tests on cache miss
        if: steps.restore-repo-cache.outcome == 'failure' || steps.restore-repo-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: DataDog/system-tests
          ref: ${{ needs.warm-repo-cache.outputs.sha }}

      - name: Checkout dd-iast-go
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.branch_ref || github.sha }}
          path: binaries/dd-iast-go

      - name: Download pre-built weblog image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: weblog-image-net-http-orchestrion
          path: binaries

      - name: Load weblog image
        run: ./build.sh golang -i weblog -w net-http-orchestrion

      - name: Build runner
        uses: ./.github/actions/install_runner

      - name: Run ${{ matrix.scenario }}
        run: ./run.sh ${{ matrix.scenario }}

      - name: Verify IAST tests executed
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          expected = {
              "DEFAULT": {
                  "weak hash": "test_weak_hash.testweakhash.",
                  "weak cipher": "test_weak_cipher.testweakcipher.",
              },
              "IAST_DEDUPLICATION": {
                  "deduplication": "testdeduplication",
              },
          }

          reports = glob.glob("logs*/reportJunit.xml")
          if not reports:
              sys.exit("No logs*/reportJunit.xml report was produced")

          executed = []
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  if case.find("skipped") is not None:
                      continue
                  identity = ".".join(
                      value
                      for value in (case.attrib.get("classname"), case.attrib.get("name"))
                      if value
                  )
                  executed.append(identity.lower())

          missing = [
              label
              for label, marker in expected[os.environ["SCENARIO"]].items()
              if not any(marker in case for case in executed)
          ]
          if missing:
              sys.exit("Expected IAST tests did not execute: " + ", ".join(missing))
          PY

      - name: Upload test results to Test Optimization
        if: always()
        uses: DataDog/system-tests/.github/actions/push_to_test_optim@57bb86608469da66c228814465657c638ff6c7d7

      - name: Compress logs
        if: always()
        shell: bash
        run: |
          if compgen -G "logs*/" > /dev/null; then
            tar -czf artifact.tar.gz logs*/
          else
            echo "No logs*/ found; skipping archive."
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs_net-http-orchestrion_${{ matrix.scenario }}
          path: artifact.tar.gz
          retention-days: 7

  system-tests-done:
    name: System Tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - build-weblog-image
      - system-tests
    steps:
      - name: Success
        if: |
          (needs.build-weblog-image.result == 'success' && needs.system-tests.result == 'success')
          || (github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name != 'DataDog/dd-iast-go'
              && needs.build-weblog-image.result == 'skipped'
              && needs.system-tests.result == 'skipped')
        run: echo "Success!"

      - name: Failure
        if: |
          !((needs.build-weblog-image.result == 'success' && needs.system-tests.result == 'success')
            || (github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name != 'DataDog/dd-iast-go'
                && needs.build-weblog-image.result == 'skipped'
                && needs.system-tests.result == 'skipped'))
        run: echo "Failure!" && exit 1
