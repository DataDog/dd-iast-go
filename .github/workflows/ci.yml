name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-licenses:
    runs-on: ubuntu-latest
    name: Validate LICENSE-3rdparty.csv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate third-party licenses
        id: dd-license-attribution
        uses: DataDog/dd-license-attribution@c2f0821bb962277c085fafe2a1f1be3f14eb10e0 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          override-spec: .ddla-overrides
          go-version: 'stable'
          github-sbom-strategy: false
          npm-strategy: false
          pypi-strategy: false
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: '!cancelled()'
        with:
          name: LICENSE-3rdparty.csv
          path: ${{ steps.dd-license-attribution.outputs.sbom-path }}

  lint:
    runs-on: ubuntu-latest
    name: Linter & Formatting
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: oldstable
      - name: 'Linter: gofmt'
        run: |
          unformatted="$(find . -type f -name '*.go' -exec gofmt -l {} +)"
          if [[ -n "${unformatted}" ]]; then
            printf 'The following files are not formatted:\n%s\n' "${unformatted}"
            exit 1
          fi
      - name: 'Linter: checklocks'
        run: go tool checklocks ./...
      - name: 'Linter: overhead benchmarks vet'
        run: go -C benchmarks/overhead vet ./...

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: oldstable
      - name: Unit Tests
        run: |
          go tool orchestrion go test \
            -shuffle=on \
            -covermode=atomic \
            -coverpkg=./... \
            -coverprofile=coverage-woven.txt \
            ./...
      - name: Runtime hooks system-stack and M state tests
        # The tests pull runtime.systemstack and runtime.acquirem with
        # test-only linknames: they need a build tag and -checklinkname=0.
        # A tag that selects no file gives "[no test files]" and exit 0, so
        # the step requires the pass line of each test. The step uses its own
        # build cache: the coverage run above leaves woven standard library
        # packages compiled against coverage-instrumented dd-iast-go packages
        # in the default cache, and a later woven link fails with a
        # "fingerprint mismatch".
        env:
          GOCACHE: ${{ runner.temp }}/gocache-g0test
        run: |
          go tool orchestrion go test -count=1 -v \
            -tags iast_g0test -ldflags=-checklinkname=0 \
            -run '^(TestSystemStackSkipsHook|TestMStateSkipsHook)$' \
            ./iast/runtime/internal/g0test | tee g0test.log
          grep -q -- '--- PASS: TestSystemStackSkipsHook' g0test.log
          grep -q -- '--- PASS: TestMStateSkipsHook' g0test.log
      - name: Unit Tests (not woven)
        # The code for a runtime without the Orchestrion aspects (for
        # example the "feature off" paths of internal/taint/heapbits) runs
        # only in this build.
        run: |
          go test \
            -shuffle=on \
            -covermode=atomic \
            -coverpkg=./... \
            -coverprofile=coverage-plain.txt \
            ./...
      - name: Merge coverage profiles
        # Same mode and same blocks: add the counts of each block.
        run: |
          awk 'FNR == 1 && NR != 1 { next }
               NR == 1 { print; next }
               { key = $1 " " $2; count[key] += $3 }
               END { for (key in count) print key, count[key] }' \
            coverage-woven.txt coverage-plain.txt > coverage.txt
      - name: Overhead benchmark unit tests
        run: go -C benchmarks/overhead test -shuffle=on ./...
      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile
          path: coverage.txt
          retention-days: 1
          if-no-files-found: ignore

  upload-coverage:
    needs: test
    name: Code Coverage Report
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: code-coverage.datadog.yml
          sparse-checkout-cone-mode: false
      - name: Download coverage artifact
        id: download-coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-profile
      - name: Get Datadog credentials
        id: dd-sts
        if: steps.download-coverage.outcome == 'success'
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2 # v1.0.5
        with:
          policy: dd-iast-go
      - name: Upload coverage to Datadog
        if: >-
          steps.download-coverage.outcome == 'success' &&
          steps.dd-sts.outcome == 'success'
        continue-on-error: true
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77 # v1.0.5
        with:
          api_key: ${{ steps.dd-sts.outputs.api_key }}
          files: coverage.txt
          format: go-coverprofile
          flags: type:unit-tests

  benchmark:
    runs-on: ubuntu-latest
    name: Benchmarks
    timeout-minutes: 20
    env:
      BENCHMARK_OUTPUT_DIR: ${{ github.workspace }}/benchmark-results
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: oldstable
      - name: Prepare artifact directory
        run: mkdir -p "$BENCHMARK_OUTPUT_DIR"
      - name: Run benchmarks
        run: |
          go -C benchmarks/overhead run ./runner \
            -outputdir="$BENCHMARK_OUTPUT_DIR" \
            -count=2 \
            -benchtime=100ms \
            -cpu=1
      - name: Add comparison to job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ -s "$BENCHMARK_OUTPUT_DIR/comparison.txt" ]]; then
            {
              echo '## IAST overhead benchmark comparison'
              echo '```text'
              cat "$BENCHMARK_OUTPUT_DIR/comparison.txt"
              echo '```'
              if [[ -s "$BENCHMARK_OUTPUT_DIR/gate.txt" ]]; then
                echo '## Heap taint bits regression gates (informative on shared runners)'
                echo '```text'
                cat "$BENCHMARK_OUTPUT_DIR/gate.txt"
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overhead-benchmark-results
          path: ${{ env.BENCHMARK_OUTPUT_DIR }}
          retention-days: 7

  heapbits:
    # Woven tests of the allocator-backed taint bits (plan
    # _docs/plans/allocator-taint-bits.md, section 6.3): the runtime aspects
    # use unexported runtime internals, so they run on each supported Go
    # minor version, on amd64 and arm64, and with the build modes that
    # change the runtime or the generated code.
    name: Heap taint bits (${{ matrix.go }}, ${{ matrix.runner }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        # cgo-off-runtimefreegc: the mmap path without cgo, with the
        # immediate reuse of freegc (combinations of modes that change the
        # runtime).
        mode: [default, race, no-optimizations, maymorestack, nogreenteagc, runtimefreegc, cgo-off, cgo-off-runtimefreegc]
        include:
          - go: stable
            runner: macos-latest
            mode: default
          - go: stable
            runner: macos-latest
            mode: race
          - go: stable
            runner: macos-latest
            mode: no-optimizations
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Woven tests
        env:
          MODE: ${{ matrix.mode }}
          # Test the Go version of the cell: no automatic toolchain switch.
          GOTOOLCHAIN: local
        shell: bash
        run: |
          go version
          args=(-shuffle=on -count=1)
          case "$MODE" in
            default) args+=(-ldflags=-checklinkname=1) ;;
            race) args+=(-race) ;;
            no-optimizations) args+=('-gcflags=all=-N -l') ;;
            maymorestack) args+=('-gcflags=all=-d=maymorestack=runtime.mayMoreStackMove') ;;
            nogreenteagc) export GOEXPERIMENT=nogreenteagc ;;
            runtimefreegc) export GOEXPERIMENT=runtimefreegc ;;
            cgo-off) export CGO_ENABLED=0 ;;
            cgo-off-runtimefreegc) export CGO_ENABLED=0 GOEXPERIMENT=runtimefreegc ;;
            *) echo "unknown mode $MODE"; exit 1 ;;
          esac
          go tool orchestrion go test "${args[@]}" ./internal/taint/heapbits/...

  runtime-race:
    # Woven tests of the runtime hooks, of the request owners and of the
    # public taint API with the race detector: these packages run concurrent
    # hooks, owner accesses and callbacks. The -short flag only skips the
    # build tests of iast/runtime (they build the runtime again; the test job
    # runs them).
    name: Runtime hooks race tests (${{ matrix.go }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Woven race tests
        env:
          # Test the Go version of the cell: no automatic toolchain switch.
          GOTOOLCHAIN: local
          # A test that needs the woven runtime fails instead of a skip.
          DD_IAST_REQUIRE_WOVEN: '1'
        run: |
          go version
          go tool orchestrion go test -race -short -shuffle=on -count=1 \
            ./iast/runtime/... \
            ./internal/taint/request \
            ./internal/taint/propbridge \
            ./taint

  propagation:
    # Woven tests of the standard library propagation hooks and of the HTTP
    # source hooks (plan _docs/plans/heapbits-sqli-cmdi.md, sections 6 and
    # 9). The hooks copy the bodies of standard library functions, so they
    # run on each supported Go minor version. The race mode runs their
    # concurrent tests with the race detector; -short only skips the build
    # tests (the default mode runs them).
    name: Propagation hooks (${{ matrix.go }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
        mode: [default, race]
    env:
      # Test the Go version of the cell: no automatic toolchain switch.
      GOTOOLCHAIN: local
      # A test that needs the woven runtime fails instead of a skip.
      DD_IAST_REQUIRE_WOVEN: '1'
      MODE: ${{ matrix.mode }}
      GO_CHANNEL: ${{ matrix.go }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Woven tests
        shell: bash
        run: |
          go version
          args=(-shuffle=on -count=1)
          case "$MODE" in
            default) ;;
            race) args+=(-race -short) ;;
            *) echo "unknown mode $MODE"; exit 1 ;;
          esac
          pkgs=(
            ./iast/propagation/text
            ./iast/propagation/stream
            ./iast/net/http
            ./iast/net/url
          )
          # From Go 1.27, encoding/json uses the v2 implementation by
          # default: the hooks of iast/propagation/jsonv2 apply. The default
          # mode also runs the guard tests of the package (not -short).
          if [[ "$GO_CHANNEL" == stable ]]; then
            pkgs+=(./iast/propagation/jsonv2)
          fi
          go tool orchestrion go test "${args[@]}" "${pkgs[@]}"
      - name: Woven tests (encoding/json v1)
        # From Go 1.27, encoding/json uses the v2 implementation by default,
        # and the hooks apply only to v1 (the v1 tests do not compile). With
        # GOEXPERIMENT=nojsonv2, the v1 tests run. A wrong tag gives no JSON
        # test and exit 0, so the step requires the pass line of a v1 test.
        if: ${{ matrix.go == 'stable' }}
        shell: bash
        env:
          GOEXPERIMENT: nojsonv2
        run: |
          args=(-count=1 -v -run '^TestJSON')
          if [[ "$MODE" == race ]]; then
            args+=(-race -short)
          fi
          go tool orchestrion go test "${args[@]}" ./iast/propagation/stream | tee json-v1.log
          grep -q -- '--- PASS: TestJSONDecoderRefillSlide' json-v1.log

  testapps:
    # Woven tests of the nested test application modules: the sink testapps
    # and the end-to-end scenarios of iast/integration/testapp (plan
    # _docs/plans/heapbits-sqli-cmdi.md, section 9.1 item 1). Each module has
    # its own go.mod, so the root test jobs do not run them. The race mode
    # adds -race -short (-short skips the build tests).
    name: Test apps (${{ matrix.module }}, ${{ matrix.go }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module:
          - iast/database/sql/testapp
          - iast/integration/testapp
          - iast/os/exec/testapp
        go: [oldstable, stable]
        mode: [default, race]
    env:
      GOTOOLCHAIN: local
      DD_IAST_REQUIRE_WOVEN: '1'
      MODE: ${{ matrix.mode }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Vet
        run: go vet ./...
      - name: Woven tests
        shell: bash
        run: |
          go version
          args=(-shuffle=on -count=1)
          case "$MODE" in
            default) ;;
            race) args+=(-race -short) ;;
            *) echo "unknown mode $MODE"; exit 1 ;;
          esac
          go tool orchestrion go test "${args[@]}" ./...
      - name: Sink executable bootstrap test
        # The main package of cmd/bootstrap imports no integration. The woven
        # executable must have the symbols of cmd/bootstrap/symbols.txt.
        # The woven tests above have other build flags, and Orchestrion does
        # not put the build flags in the cache key of its dependency
        # archives, thus this build has its own GOCACHE.
        if: ${{ matrix.mode == 'default' }}
        shell: bash
        run: |
          if [[ ! -s cmd/bootstrap/symbols.txt ]]; then
            echo 'Bootstrap fixture must declare its expected symbols in cmd/bootstrap/symbols.txt'
            exit 1
          fi
          GOCACHE="$RUNNER_TEMP/gocache-bootstrap" \
            go tool orchestrion go build -o "$RUNNER_TEMP/iast-bootstrap" ./cmd/bootstrap
          go tool nm "$RUNNER_TEMP/iast-bootstrap" > "$RUNNER_TEMP/iast-bootstrap.nm"
          while IFS= read -r symbol || [[ -n "$symbol" ]]; do
            if [[ -z "$symbol" ]]; then
              echo 'Bootstrap symbol must not be empty'
              exit 1
            fi
            grep -F -- "$symbol" "$RUNNER_TEMP/iast-bootstrap.nm"
          done < cmd/bootstrap/symbols.txt

  heapbits-feature-off:
    # The woven runtime must compile on every target, with the feature off
    # where it is not supported (plan section 3.5).
    name: Heap taint bits (feature off)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build Orchestrion
        run: go build -o "$RUNNER_TEMP/orchestrion" github.com/DataDog/orchestrion
      - name: Woven cross builds
        shell: bash
        run: |
          for target in linux/386 linux/arm linux/riscv64 linux/ppc64le windows/amd64 js/wasm wasip1/wasm darwin/amd64 freebsd/amd64 plan9/amd64; do
            echo "::group::$target"
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go test -c -o /dev/null -toolexec "$RUNNER_TEMP/orchestrion toolexec" ./internal/taint/heapbits
            echo "::endgroup::"
          done
      - name: js/wasm tests (feature off)
        run: |
          GOOS=js GOARCH=wasm go test -short -count=1 \
            -toolexec "$RUNNER_TEMP/orchestrion toolexec" \
            -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" \
            ./internal/taint/heapbits
      - name: ASan tests (feature off)
        # The default C compiler of the runner (gcc, with libasan).
        run: go tool orchestrion go test -short -count=1 -asan ./internal/taint/heapbits

  heapbits-prerelease:
    # The development version of Go: a failure does not block a merge, but
    # it gives time to fix the aspects before the next Go release. A new
    # minor version also fails TestRuntimeDrift until its golden file exists.
    name: Heap taint bits (Go development version)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install gotip
        run: |
          go install golang.org/dl/gotip@latest
          gotip download
      - name: Drift test (no weaving)
        # Fails for a new minor version until its golden file exists: the
        # early signal to review the runtime code that the aspects use.
        shell: bash
        run: |
          goroot="$(gotip env GOROOT)"
          export PATH="$goroot/bin:$PATH"
          export GOTOOLCHAIN=local
          go version
          go test -count=1 -run TestRuntimeDrift ./internal/taint/heapbits
      - name: Woven tests
        # Orchestrion can fail on a development version of Go (for example
        # a new compiler flag that it does not know yet).
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          goroot="$(gotip env GOROOT)"
          export PATH="$goroot/bin:$PATH"
          export GOTOOLCHAIN=local
          go tool orchestrion go test -shuffle=on -count=1 ./internal/taint/heapbits/...
      - name: Report
        if: ${{ failure() }}
        run: |
          echo "::warning::The heap taint bits fail on the Go development version: check the runtime aspects before the next Go release."
          echo '### Heap taint bits fail on the Go development version' >> "$GITHUB_STEP_SUMMARY"

  green-ci:
    runs-on: ubuntu-latest
    name: Green CI
    needs: [validate-licenses, lint, test, upload-coverage, benchmark, heapbits, runtime-race, propagation, testapps, heapbits-feature-off]
    if: always()
    steps:
      - name: Success
        if: |-
          needs.validate-licenses.result  == 'success'
          && needs.lint.result            == 'success'
          && needs.test.result            == 'success'
          && needs.upload-coverage.result == 'success'
          && needs.benchmark.result       == 'success'
          && needs.heapbits.result        == 'success'
          && needs['runtime-race'].result == 'success'
          && needs.propagation.result     == 'success'
          && needs.testapps.result        == 'success'
          && needs['heapbits-feature-off'].result == 'success'
        run: echo "Success!"
      - name: Failure
        if: |-
          needs.validate-licenses.result  != 'success'
          || needs.lint.result            != 'success'
          || needs.test.result            != 'success'
          || needs.upload-coverage.result != 'success'
          || needs.benchmark.result       != 'success'
          || needs.heapbits.result        != 'success'
          || needs['runtime-race'].result != 'success'
          || needs.propagation.result     != 'success'
          || needs.testapps.result        != 'success'
          || needs['heapbits-feature-off'].result != 'success'
        run: echo "Failure!" && exit 1
