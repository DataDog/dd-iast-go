name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-latest
    name: Discover Go modules
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find Go modules
        id: discover
        run: |
          python3 <<'PY'
          import json
          import os

          modules = []
          for directory, children, files in os.walk("."):
              children[:] = [name for name in children if not name.startswith(".") and name != "vendor"]
              if "go.mod" in files:
                  modules.append(os.path.normpath(directory))
          if not any(os.path.isfile(os.path.join(module, "cmd", "bootstrap", "symbols.txt")) for module in modules):
              raise SystemExit("no executable bootstrap fixtures found")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"modules={json.dumps(sorted(modules))}\n")
          PY

  validate-licenses:
    runs-on: ubuntu-latest
    name: Validate LICENSE-3rdparty.csv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate third-party licenses
        id: dd-license-attribution
        uses: DataDog/dd-license-attribution@1c08c1cf1d1bf4eb3a60073c210280a544cdbee2 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          override-spec: .ddla-overrides
          go-version: 'stable'
          github-sbom-strategy: false
          npm-strategy: false
          pypi-strategy: false
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: '!cancelled()'
        with:
          name: LICENSE-3rdparty.csv
          path: ${{ steps.dd-license-attribution.outputs.sbom-path }}

  lint:
    needs: modules
    runs-on: ubuntu-latest
    name: Linter & Formatting (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: 'Linter: gofmt'
        if: matrix.module == '.'
        run: |
          unformatted="$(find . -type f -name '*.go' -exec gofmt -l {} +)"
          if [[ -n "${unformatted}" ]]; then
            printf 'The following files are not formatted:\n%s\n' "${unformatted}"
            exit 1
          fi
      - name: 'Linter: checklocks'
        if: matrix.module == '.'
        run: go tool checklocks ./...
      - name: 'Linter: go vet'
        run: go vet ./...
      - name: 'Linter: go vet (CI tools)'
        if: matrix.module == '.'
        run: go vet ./.github

  test:
    needs: modules
    runs-on: ubuntu-latest
    name: Unit Tests (${{ matrix.module }}, lane ${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
        # The encoding/json lanes (plan encoding-json-v2, section 7.1):
        # A is the go.mod version (v1 encoding/json), B is Go 1.27 with its
        # default encoding/json (v2), and C is Go 1.27 with the v1
        # encoding/json (GOEXPERIMENT=nojsonv2).
        lane: [A, B, C]
        include:
          - lane: A
            go: go.mod
            goexperiment: ''
          - lane: B
            go: 1.27.x
            goexperiment: ''
          - lane: C
            go: 1.27.x
            goexperiment: nojsonv2
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      MODULE: ${{ matrix.module }}
      LANE: ${{ matrix.lane }}
      # Use the Go version that setup-go installed, not a toolchain download.
      GOTOOLCHAIN: local
      GOEXPERIMENT: ${{ matrix.goexperiment }}
      # Each lane has its own GOCACHE. Orchestrion adds dependency archives
      # that the Go action ID of the dependent package does not include
      # (plan runtime-operator-hooks, step 6), thus two lanes must not share
      # build results. Lanes B and C have the same Go version and the same
      # go.sum. The cache path is a part of the setup-go cache version, thus
      # a different path also gives a different setup-go cache entry.
      GOCACHE: ${{ github.workspace }}/.gocache/lane-${{ matrix.lane }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && format('{0}/go.mod', matrix.module) || '' }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Toolchain
        run: |
          go version
          go env GOEXPERIMENT GOCACHE
      - name: Unit Tests
        shell: bash
        run: |
          test_command=(go test)
          if [[ -f orchestrion.tool.go ]]; then
            test_command=(go tool orchestrion go test)
          fi
          coverage_packages=./...
          if [[ "$MODULE" != '.' ]]; then
            root_packages=$(go -C "$GITHUB_WORKSPACE" list ./...)
            packages=()
            while IFS= read -r package; do
              case "$package" in
                # The pinned injector resolves these imports in a separate
                # build, which cannot share nested-test coverage archives.
                # Both root test runs still cover every bridge package.
                */internal/taint/*bridge) ;;
                *) packages+=("$package") ;;
              esac
            done <<< "$root_packages"
            coverage_packages=$(IFS=,; printf '%s' "${packages[*]}")
          fi
          coverage_flags=(-covermode=atomic "-coverpkg=$coverage_packages")
          # The woven run of the root module also uses the race detector
          # (plan runtime-operator-hooks, section 9.4).
          race_flags=()
          if [[ "$MODULE" == '.' ]]; then
            race_flags=(-race)
          fi
          "${test_command[@]}" "${race_flags[@]}" -shuffle=on "${coverage_flags[@]}" -coverprofile=coverage.txt ./...
          if [[ "$MODULE" == '.' ]]; then
            go test -shuffle=on "${coverage_flags[@]}" -coverprofile=coverage.ordinary.txt ./...
            go test -race -shuffle=on ./.github
            go test -race -count=1 -shuffle=on ./internal/taint/...
          fi
      # The fuzz campaigns do not depend on the encoding/json variant, thus
      # they run on lane A only (plan encoding-json-v2, section 7.1).
      - name: Bounded propagation fuzz campaigns
        if: matrix.module == '.' && matrix.lane == 'A'
        shell: bash
        run: |
          for target in FuzzCanonicalize FuzzSliceAndCopy; do
            go test -run='^$' -fuzz="^${target}$" -fuzztime=10000x \
              -fuzzminimizetime=1000x -parallel=4 -timeout=5m ./internal/taint/ranges
          done
          for target in FuzzEngineSequence FuzzOwnerLifecycle; do
            go test -run='^$' -fuzz="^${target}$" -fuzztime=10000x \
              -fuzzminimizetime=1000x -parallel=4 -timeout=5m ./internal/taint/propagation
          done
          go test -run='^$' -fuzz='^FuzzInteriorIndex$' -fuzztime=10000x \
            -fuzzminimizetime=1000x -parallel=4 -timeout=5m ./internal/taint/store
      - name: Upload failing fuzz inputs
        if: ${{ failure() && matrix.module == '.' && matrix.lane == 'A' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: propagation-fuzz-failures
          path: |
            internal/taint/ranges/testdata/fuzz/**
            internal/taint/propagation/testdata/fuzz/**
            internal/taint/store/testdata/fuzz/**
          if-no-files-found: ignore
      - name: Sink executable bootstrap tests
        shell: bash
        run: |
          if [[ -d cmd/bootstrap ]]; then
            if [[ ! -s cmd/bootstrap/symbols.txt ]]; then
              echo 'Bootstrap fixture must declare its expected symbols in cmd/bootstrap/symbols.txt'
              exit 1
            fi
            # The woven test run above has coverage flags, and this woven
            # build has none. Orchestrion does not put the build flags in
            # the cache key of its dependency archives, thus this build has
            # its own GOCACHE (plan runtime-operator-hooks, step 6).
            GOCACHE="$RUNNER_TEMP/gocache-bootstrap" \
              go tool orchestrion go build -o "$RUNNER_TEMP/iast-bootstrap" ./cmd/bootstrap
            go tool nm "$RUNNER_TEMP/iast-bootstrap" > "$RUNNER_TEMP/iast-bootstrap.nm"
            while IFS= read -r symbol || [[ -n "$symbol" ]]; do
              if [[ -z "$symbol" ]]; then
                echo 'Bootstrap symbol must not be empty'
                exit 1
              fi
              grep -F -- "$symbol" "$RUNNER_TEMP/iast-bootstrap.nm"
            done < cmd/bootstrap/symbols.txt
          fi
      # Go 1.26 and Go 1.27 put different coverage blocks in the same file,
      # and the merge of overlapping blocks gives an incorrect report. Thus
      # only lane A uploads its profiles. Lanes B and C run the same coverage
      # commands, to test the woven coverage build.
      - name: Upload coverage artifact
        if: ${{ !cancelled() && matrix.lane == 'A' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile-${{ strategy.job-index }}
          path: ${{ matrix.module }}/coverage*.txt
          retention-days: 1
          if-no-files-found: error

  woven-runtime:
    # The woven tests of the runtime hooks, for each supported Go version,
    # architecture and build mode (plan runtime-operator-hooks, section 9.4).
    # Root module only.
    runs-on: ${{ matrix.runner }}
    name: Woven runtime (go ${{ matrix.go }}, ${{ matrix.runner }}, ${{ matrix.mode }}, orchestrion ${{ matrix.orchestrion }})
    # 2 x the slowest cell of the first CI run (10m18s, go.mod, amd64,
    # -race), rounded up (plan step 6).
    timeout-minutes: 21
    strategy:
      fail-fast: false
      matrix:
        # go.mod is the version of the go directive of go.mod.
        go: [go.mod, 1.27.x]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        # nol is -gcflags=all=-N -l.
        mode: [default, race, nol]
        orchestrion: [go.mod]
        include:
          # One more cell uses the latest Orchestrion release, so that a
          # release that breaks the aspects is found (plan section 6.3).
          # This entry changes the value of an axis, thus it is a new cell.
          - go: 1.27.x
            runner: ubuntu-latest
            mode: default
            orchestrion: latest
    env:
      DD_IAST_REQUIRE_WOVEN: '1'
      # Use the Go version that setup-go installed, not a toolchain download.
      GOTOOLCHAIN: local
      # The Go 1.27 cells use the default encoding/json of Go 1.27 (v2). The
      # unit-test job also tests the v1 encoding/json of Go 1.27 (lane C,
      # GOEXPERIMENT=nojsonv2). The runtime hooks do not depend on the
      # encoding/json variant (plan encoding-json-v2, step 9).
      MODE: ${{ matrix.mode }}
      WOVEN_OUT: ${{ github.workspace }}/woven-runtime-out
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          # The cell with the latest Orchestrion runs code that is not pinned
          # by go.sum. It does not write the shared cache.
          cache: ${{ matrix.orchestrion != 'latest' }}
          cache-dependency-path: |
            go.sum
            iast/runtime/testapp/go.sum
      - name: Use the latest Orchestrion release
        if: matrix.orchestrion == 'latest'
        shell: bash
        run: |
          # Orchestrion refuses to run when its version is not the version
          # of go.mod. Thus change go.mod as a customer does, then run that
          # version with go run.
          version=$(go list -m -f '{{ .Version }}' github.com/DataDog/orchestrion@latest)
          echo "Orchestrion ${version}"
          for module in . iast/runtime/testapp; do
            go -C "$module" get "github.com/DataDog/orchestrion@${version}"
            go -C "$module" mod tidy
          done
          echo "ORCHESTRION=go run github.com/DataDog/orchestrion@${version}" >> "$GITHUB_ENV"
      - name: Toolchain
        id: toolchain
        run: |
          go version
          go env GOEXPERIMENT
      # Each check below runs also when an earlier check failed, so that
      # the cell reports all the failures.
      - name: blockedLinknames check
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: .github/woven-runtime.sh "$MODE" linknames
      - name: Woven tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: .github/woven-runtime.sh "$MODE" test
      - name: System-stack test
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: .github/woven-runtime.sh "$MODE" g0
      - name: Link check
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: .github/woven-runtime.sh "$MODE" link "$WOVEN_OUT"
      - name: Escape comparison
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: .github/woven-runtime.sh "$MODE" escape "$WOVEN_OUT"
      - name: Gate-off benchmark (not a gate)
        if: >-
          ${{ !cancelled() && steps.toolchain.outcome == 'success'
          && matrix.go == 'go.mod' && matrix.runner == 'ubuntu-latest'
          && matrix.mode == 'default' && matrix.orchestrion == 'go.mod' }}
        continue-on-error: true
        run: .github/woven-runtime.sh "$MODE" bench "$WOVEN_OUT" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload check output
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: woven-runtime-${{ strategy.job-index }}
          path: ${{ env.WOVEN_OUT }}/escape
          retention-days: 7
          if-no-files-found: ignore

  upload-coverage:
    needs: test
    name: Code Coverage Report
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-profile-*
          path: coverage-profiles
      # Sum identical blocks across all runs before Datadog evaluates lines.
      - name: Merge coverage profiles
        run: |
          python3 .github/merge-coverage.py coverage-profiles/*/*.txt
          go tool cover -func=coverage.merged.txt
      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-merged
          path: coverage.merged.txt
          retention-days: 1
          if-no-files-found: error
      - name: Get Datadog credentials
        id: dd-sts
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2 # v1.0.5
        with:
          policy: dd-iast-go
      - name: Upload coverage to Datadog
        if: steps.dd-sts.outcome == 'success'
        continue-on-error: true
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77 # v1.0.5
        with:
          api_key: ${{ steps.dd-sts.outputs.api_key }}
          files: coverage.merged.txt
          format: go-coverprofile
          flags: type:unit-tests

  benchmark:
    runs-on: ubuntu-latest
    name: Benchmarks
    timeout-minutes: 20
    env:
      BENCHMARK_OUTPUT_DIR: ${{ github.workspace }}/benchmark-results
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prepare artifact directory
        run: mkdir -p "$BENCHMARK_OUTPUT_DIR"
      - name: Run benchmarks
        run: |
          go -C benchmarks/overhead run ./runner \
            -outputdir="$BENCHMARK_OUTPUT_DIR" \
            -count=2 \
            -benchtime=100ms \
            -cpu=1
      - name: Add comparison to job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ -s "$BENCHMARK_OUTPUT_DIR/comparison.txt" ]]; then
            {
              echo '## IAST overhead benchmark comparison'
              echo '```text'
              cat "$BENCHMARK_OUTPUT_DIR/comparison.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overhead-benchmark-results
          path: ${{ env.BENCHMARK_OUTPUT_DIR }}
          retention-days: 7

  green-ci:
    runs-on: ubuntu-latest
    name: Green CI
    needs: [modules, validate-licenses, lint, test, woven-runtime, upload-coverage, benchmark]
    if: always()
    steps:
      - name: Success
        if: |-
          needs.modules.result            == 'success'
          && needs.validate-licenses.result == 'success'
          && needs.lint.result            == 'success'
          && needs.test.result            == 'success'
          && needs.woven-runtime.result   == 'success'
          && needs.upload-coverage.result == 'success'
          && needs.benchmark.result       == 'success'
        run: echo "Success!"
      - name: Failure
        if: |-
          needs.modules.result            != 'success'
          || needs.validate-licenses.result != 'success'
          || needs.lint.result            != 'success'
          || needs.test.result            != 'success'
          || needs.woven-runtime.result   != 'success'
          || needs.upload-coverage.result != 'success'
          || needs.benchmark.result       != 'success'
        run: echo "Failure!" && exit 1
