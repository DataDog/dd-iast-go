name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate third-party licenses
        id: dd-license-attribution
        uses: DataDog/dd-license-attribution@9173cdf40c468af6ddc37b8f6da563d59e4065ad # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          go-version: 'stable'
          github-sbom-strategy: false
          npm-strategy: false
          pypi-strategy: false
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: '!cancelled()'
        with:
          name: LICENSE-3rdparty.csv
          path: ${{ steps.dd-license-attribution.outputs.sbom-path }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: oldstable
      - name: 'Linter: gofmt'
        run: |
          unformatted="$(find . -type f -name '*.go' -exec gofmt -l {} +)"
          if [[ -n "${unformatted}" ]]; then
            printf 'The following files are not formatted:\n%s\n' "${unformatted}"
            exit 1
          fi
      - name: 'Linter: checklocks'
        run: go tool checklocks ./...
      - name: 'Linter: overhead benchmarks vet'
        run: go -C benchmarks/overhead vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: oldstable
      - name: Unit Tests
        run: go tool orchestrion go test -shuffle=on ./...
      - name: Overhead benchmark unit tests
        run: go -C benchmarks/overhead test -shuffle=on ./...

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCHMARK_OUTPUT_DIR: ${{ github.workspace }}/benchmark-results
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: oldstable
      - name: Prepare artifact directory
        run: mkdir -p "$BENCHMARK_OUTPUT_DIR"
      - name: Run benchmarks
        run: |
          go -C benchmarks/overhead run ./runner \
            -outputdir="$BENCHMARK_OUTPUT_DIR" \
            -count=2 \
            -benchtime=100ms \
            -cpu=1
      - name: Add comparison to job summary
        if: always()
        shell: bash
        run: |
          if [[ -s "$BENCHMARK_OUTPUT_DIR/comparison.txt" ]]; then
            {
              echo '## IAST overhead benchmark comparison'
              echo '```text'
              cat "$BENCHMARK_OUTPUT_DIR/comparison.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overhead-benchmark-results
          path: ${{ env.BENCHMARK_OUTPUT_DIR }}
          retention-days: 7
