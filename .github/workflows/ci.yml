name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-licenses:
    runs-on: ubuntu-latest
    name: Validate LICENSE-3rdparty.csv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate third-party licenses
        id: dd-license-attribution
        uses: DataDog/dd-license-attribution@b6152ca0093f3026b550ac264844956efc878075 # v0.8.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The v0.8.0 action still defaults to package 0.7.2, which lacks the
          # pluggy<1.7 pin. Remove this when the action default is 0.8.0+.
          package-version: '0.8.0'
          override-spec: .ddla-overrides
          go-version: 'stable'
          github-sbom-strategy: false
          npm-strategy: false
          pypi-strategy: false
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: '!cancelled()'
        with:
          name: LICENSE-3rdparty.csv
          path: ${{ steps.dd-license-attribution.outputs.sbom-path }}

  lint:
    runs-on: ubuntu-latest
    name: Linter & Formatting
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: oldstable
      - name: 'Linter: gofmt'
        run: |
          unformatted="$(find . -type f -name '*.go' -exec gofmt -l {} +)"
          if [[ -n "${unformatted}" ]]; then
            printf 'The following files are not formatted:\n%s\n' "${unformatted}"
            exit 1
          fi
      - name: 'Linter: checklocks'
        run: go tool checklocks ./...
      - name: 'Linter: overhead benchmarks vet'
        run: go -C benchmarks/overhead vet ./...

  test:
    runs-on: ubuntu-latest
    name: Unit Tests (${{ matrix.tool }})
    strategy:
      fail-fast: false
      matrix:
        tool: [orchestrion, otelc]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: oldstable
      - name: Unit Tests (orchestrion)
        if: matrix.tool == 'orchestrion'
        env:
          # The tests of internal/build fail if the build tool is not this one.
          DD_IAST_EXPECTED_BUILD_TOOL: orchestrion
        run: |
          go tool orchestrion go test \
            -shuffle=on \
            -covermode=atomic \
            -coverpkg=./... \
            -coverprofile=coverage.txt \
            ./...
      # otelc cannot build all the packages of this module in one "go test"
      # command. The script runs the tests that need instrumentation, one
      # package at a time. See scripts/otelc-test.sh.
      - name: Unit Tests (otelc)
        if: matrix.tool == 'otelc'
        run: scripts/otelc-test.sh -shuffle=on
      - name: Overhead benchmark unit tests
        if: matrix.tool == 'orchestrion'
        run: go -C benchmarks/overhead test -shuffle=on ./...
      # Only the Orchestrion run makes a coverage profile: it builds all the
      # packages of the module in one command.
      - name: Upload coverage artifact
        if: ${{ !cancelled() && matrix.tool == 'orchestrion' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile
          path: coverage.txt
          retention-days: 1
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    name: Integration Tests (${{ matrix.module }}, ${{ matrix.tool }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The main module of the end-to-end tests runs with both tools, so
          # that the two tools are compared on the same code.
          - module: _integration/otelc
            tool: orchestrion
            packages: . ./internal/...
          - module: _integration/otelc
            tool: otelc
            packages: . ./internal/...
          # The setups import only a part of dd-iast-go. Only otelc supports
          # this (see _integration/otelc/doc.go).
          - module: _integration/otelc/setups/hashonly
            tool: otelc
            packages: ./...
          - module: _integration/otelc/setups/rootandhash
            tool: otelc
            packages: ./...
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: oldstable
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Integration Tests
        working-directory: ${{ matrix.module }}
        env:
          TOOL: ${{ matrix.tool }}
          PACKAGES: ${{ matrix.packages }}
        # PACKAGES can contain more than one package pattern, separated by spaces.
        run: |
          read -r -a packages <<< "${PACKAGES}"
          go tool "${TOOL}" go test -shuffle=on "${packages[@]}"

  upload-coverage:
    needs: test
    name: Code Coverage Report
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: code-coverage.datadog.yml
          sparse-checkout-cone-mode: false
      - name: Download coverage artifact
        id: download-coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-profile
      - name: Get Datadog credentials
        id: dd-sts
        if: steps.download-coverage.outcome == 'success'
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2 # v1.0.5
        with:
          policy: dd-iast-go
      - name: Upload coverage to Datadog
        if: >-
          steps.download-coverage.outcome == 'success' &&
          steps.dd-sts.outcome == 'success'
        continue-on-error: true
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77 # v1.0.5
        with:
          api_key: ${{ steps.dd-sts.outputs.api_key }}
          files: coverage.txt
          format: go-coverprofile
          flags: type:unit-tests

  benchmark:
    runs-on: ubuntu-latest
    name: Benchmarks
    timeout-minutes: 20
    env:
      BENCHMARK_OUTPUT_DIR: ${{ github.workspace }}/benchmark-results
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: oldstable
      - name: Prepare artifact directory
        run: mkdir -p "$BENCHMARK_OUTPUT_DIR"
      - name: Run benchmarks
        run: |
          go -C benchmarks/overhead run ./runner \
            -outputdir="$BENCHMARK_OUTPUT_DIR" \
            -count=2 \
            -benchtime=100ms \
            -cpu=1
      - name: Add comparison to job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ -s "$BENCHMARK_OUTPUT_DIR/comparison.txt" ]]; then
            {
              echo '## IAST overhead benchmark comparison'
              echo '```text'
              cat "$BENCHMARK_OUTPUT_DIR/comparison.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overhead-benchmark-results
          path: ${{ env.BENCHMARK_OUTPUT_DIR }}
          retention-days: 7

  green-ci:
    runs-on: ubuntu-latest
    name: Green CI
    needs: [validate-licenses, lint, test, integration, upload-coverage, benchmark]
    if: always()
    steps:
      - name: Success
        if: |-
          needs.validate-licenses.result  == 'success'
          && needs.lint.result            == 'success'
          && needs.test.result            == 'success'
          && needs.integration.result     == 'success'
          && needs.upload-coverage.result == 'success'
          && needs.benchmark.result       == 'success'
        run: echo "Success!"
      - name: Failure
        if: |-
          needs.validate-licenses.result  != 'success'
          || needs.lint.result            != 'success'
          || needs.test.result            != 'success'
          || needs.integration.result     != 'success'
          || needs.upload-coverage.result != 'success'
          || needs.benchmark.result       != 'success'
        run: echo "Failure!" && exit 1
