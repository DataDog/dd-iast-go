name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-latest
    name: Discover Go modules
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find Go modules
        id: discover
        run: |
          python3 <<'PY'
          import json
          import os

          modules = []
          for directory, children, files in os.walk("."):
              children[:] = [name for name in children if not name.startswith(".") and name != "vendor"]
              if "go.mod" in files:
                  modules.append(os.path.normpath(directory))
          if not any(os.path.isfile(os.path.join(module, "cmd", "bootstrap", "symbols.txt")) for module in modules):
              raise SystemExit("no executable bootstrap fixtures found")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"modules={json.dumps(sorted(modules))}\n")
          PY

  validate-licenses:
    runs-on: ubuntu-latest
    name: Validate LICENSE-3rdparty.csv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate third-party licenses
        id: dd-license-attribution
        uses: DataDog/dd-license-attribution@c2f0821bb962277c085fafe2a1f1be3f14eb10e0 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          override-spec: .ddla-overrides
          go-version: 'stable'
          github-sbom-strategy: false
          npm-strategy: false
          pypi-strategy: false
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: '!cancelled()'
        with:
          name: LICENSE-3rdparty.csv
          path: ${{ steps.dd-license-attribution.outputs.sbom-path }}

  lint:
    needs: modules
    runs-on: ubuntu-latest
    name: Linter & Formatting (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: 'Linter: gofmt'
        if: matrix.module == '.'
        run: |
          unformatted="$(find . -type f -name '*.go' -exec gofmt -l {} +)"
          if [[ -n "${unformatted}" ]]; then
            printf 'The following files are not formatted:\n%s\n' "${unformatted}"
            exit 1
          fi
      - name: 'Linter: checklocks'
        if: matrix.module == '.'
        run: go tool checklocks ./...
      - name: 'Linter: go vet'
        run: go vet ./...

  test:
    needs: modules
    runs-on: ubuntu-latest
    name: Unit Tests (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Unit Tests
        shell: bash
        run: |
          test_command=(go test)
          if [[ -f orchestrion.tool.go ]]; then
            test_command=(go tool orchestrion go test)
          fi
          coverage_flags=()
          if [[ "$MODULE" == '.' ]]; then
            coverage_flags=(-covermode=atomic -coverpkg=./... -coverprofile=coverage.txt)
          fi
          "${test_command[@]}" -shuffle=on "${coverage_flags[@]}" ./...
      # The Datadog uploader does not merge duplicate blocks emitted by
      # `go test -coverpkg=./...`; normalize them before upload.
      - name: Normalize coverage profile
        if: matrix.module == '.'
        run: |
          python3 <<'PY'
          from collections import defaultdict
          from pathlib import Path

          source = Path("coverage.txt")
          destination = Path("coverage.merged.txt")
          lines = source.read_text().splitlines()
          if not lines or lines[0] != "mode: atomic":
              raise SystemExit("expected an atomic Go coverage profile")

          counts = defaultdict(int)
          for line in lines[1:]:
              location, statements, count = line.split()
              counts[(location, int(statements))] += int(count)

          def position(item):
              (location, statements), _ = item
              path, span = location.rsplit(":", 1)
              start, end = span.split(",")
              start_line, start_column = map(int, start.split("."))
              end_line, end_column = map(int, end.split("."))
              return path, start_line, start_column, end_line, end_column, statements

          with destination.open("w") as output:
              output.write("mode: atomic\n")
              for (location, statements), count in sorted(counts.items(), key=position):
                  output.write(f"{location} {statements} {count}\n")
          PY
          go tool cover -func=coverage.merged.txt >/dev/null
          mv coverage.merged.txt coverage.txt
      - name: Sink executable bootstrap tests
        shell: bash
        run: |
          if [[ -d cmd/bootstrap ]]; then
            if [[ ! -s cmd/bootstrap/symbols.txt ]]; then
              echo 'Bootstrap fixture must declare its expected symbols in cmd/bootstrap/symbols.txt'
              exit 1
            fi
            go tool orchestrion go build -o "$RUNNER_TEMP/iast-bootstrap" ./cmd/bootstrap
            go tool nm "$RUNNER_TEMP/iast-bootstrap" > "$RUNNER_TEMP/iast-bootstrap.nm"
            while IFS= read -r symbol || [[ -n "$symbol" ]]; do
              if [[ -z "$symbol" ]]; then
                echo 'Bootstrap symbol must not be empty'
                exit 1
              fi
              grep -F -- "$symbol" "$RUNNER_TEMP/iast-bootstrap.nm"
            done < cmd/bootstrap/symbols.txt
          fi
      - name: Upload coverage artifact
        if: ${{ !cancelled() && matrix.module == '.' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile
          path: coverage.txt
          retention-days: 1
          if-no-files-found: ignore

  upload-coverage:
    needs: test
    name: Code Coverage Report
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: code-coverage.datadog.yml
          sparse-checkout-cone-mode: false
      - name: Download coverage artifact
        id: download-coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-profile
      - name: Get Datadog credentials
        id: dd-sts
        if: steps.download-coverage.outcome == 'success'
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2 # v1.0.5
        with:
          policy: dd-iast-go
      - name: Upload coverage to Datadog
        if: >-
          steps.download-coverage.outcome == 'success' &&
          steps.dd-sts.outcome == 'success'
        continue-on-error: true
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77 # v1.0.5
        with:
          api_key: ${{ steps.dd-sts.outputs.api_key }}
          files: coverage.txt
          format: go-coverprofile
          flags: type:unit-tests

  benchmark:
    runs-on: ubuntu-latest
    name: Benchmarks
    timeout-minutes: 20
    env:
      BENCHMARK_OUTPUT_DIR: ${{ github.workspace }}/benchmark-results
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prepare artifact directory
        run: mkdir -p "$BENCHMARK_OUTPUT_DIR"
      - name: Run benchmarks
        run: |
          go -C benchmarks/overhead run ./runner \
            -outputdir="$BENCHMARK_OUTPUT_DIR" \
            -count=2 \
            -benchtime=100ms \
            -cpu=1
      - name: Add comparison to job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ -s "$BENCHMARK_OUTPUT_DIR/comparison.txt" ]]; then
            {
              echo '## IAST overhead benchmark comparison'
              echo '```text'
              cat "$BENCHMARK_OUTPUT_DIR/comparison.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overhead-benchmark-results
          path: ${{ env.BENCHMARK_OUTPUT_DIR }}
          retention-days: 7

  green-ci:
    runs-on: ubuntu-latest
    name: Green CI
    needs: [modules, validate-licenses, lint, test, upload-coverage, benchmark]
    if: always()
    steps:
      - name: Success
        if: |-
          needs.modules.result            == 'success'
          && needs.validate-licenses.result == 'success'
          && needs.lint.result            == 'success'
          && needs.test.result            == 'success'
          && needs.upload-coverage.result == 'success'
          && needs.benchmark.result       == 'success'
        run: echo "Success!"
      - name: Failure
        if: |-
          needs.modules.result            != 'success'
          || needs.validate-licenses.result != 'success'
          || needs.lint.result            != 'success'
          || needs.test.result            != 'success'
          || needs.upload-coverage.result != 'success'
          || needs.benchmark.result       != 'success'
        run: echo "Failure!" && exit 1
