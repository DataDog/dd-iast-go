---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/crypto/hash
  description: Weak hash detection

aspects:
  - id: golang.org/x/crypto/md4
    join-point:
      all-of:
        - import-path: golang.org/x/crypto/md4
        - function-body:
            function:
              - name: Sum
    advice:
      - prepend-statements:
          imports:
            crypto: crypto
            iast: github.com/DataDog/dd-iast-go/crypto/hash
          template: iast.ReportWeakHash(nil, crypto.MD4)

  - id: crypto/md5
    join-point:
      all-of:
        - import-path: crypto/md5
        - function-body:
            function:
              - name: Sum
    advice:
      - prepend-statements:
          imports:
            crypto: crypto
            iast: github.com/DataDog/dd-iast-go/crypto/hash
          template: iast.ReportWeakHash(nil, crypto.MD5)

  - id: crypto/sha1
    join-point:
      all-of:
        - import-path: crypto/sha1
        - function-body:
            function:
              - name: Sum
    advice:
      - prepend-statements:
          imports:
            crypto: crypto
            iast: github.com/DataDog/dd-iast-go/crypto/hash
          template: iast.ReportWeakHash(nil, crypto.SHA1)
