# otelc (go.opentelemetry.io/otelc) rule that marks the build as instrumented.
# The Orchestrion counterpart is the //orchestrion:enabled directive in
# build.go.
#
# This is a "core" rule: the tool file otel.instrumentation.go at the root of
# the module imports this package, so the rule loads when an application
# imports any package of this module.
#
# The minimum version is the first one that loads a rule file only one time
# (otelc #1483). Without it, a rule file that two imports reach (for example the
# root package and a sub-package) loads twice and the build fails. A version
# of otelc that is built from the main branch always passes this check.
version: v1.2.1-0

build_flag_otelc:
  target: github.com/DataDog/dd-iast-go/internal/build
  where:
    kind: var
    identifier: otelcEnabled
  do:
    - assign_value:
        replace: "true"
