---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/internal/taint/heapbits
  description: |-
    Allocator-backed taint bits: one bit for each heap byte, stored next to the
    Go allocator metadata. See _docs/plans/allocator-taint-bits.md.

aspects:
  # 1. One lazily allocated bitmap for each heap arena (1 bit for each byte).
  #    Same model as runtime.checkmarksMap (heapArena.checkmarks).
  - id: heapArena taint bitmap
    join-point:
      struct-definition: runtime.heapArena
    advice:
      - add-struct-field:
          name: __dd_taint
          type: "*__dd_taintBitmap"
      - inject-declarations:
          imports:
            atomic: internal/runtime/atomic
            sys: internal/runtime/sys
            unsafe: unsafe
          template: |-
            // __dd_taintBitmap has one bit for each byte of one heap arena.
            // Bit k%64 of word k/64 is the bit of byte k of the arena.
            // It is off-heap memory from sysAlloc. It is never freed.
            type __dd_taintBitmap struct {
              _ sys.NotInHeap
              b [heapArenaBytes / 64]uint64
            }

            // Compile-time checks: a change of these runtime internals in a
            // new Go release makes the woven runtime fail to compile (loud).
            var _ func(uintptr) *heapArena = heapArenaOf
            var _ func(uintptr) *mspan = spanOfHeap
            var _ func(uintptr) arenaIdx = arenaIndex
            var _ func(arenaIdx) uintptr = arenaBase
            var _ func(*byte, uintptr) *byte = addb
            var _ func(uintptr, *sysMemStat, string) unsafe.Pointer = sysAlloc
            var _ func(unsafe.Pointer, uintptr, *sysMemStat) = sysFree
            var _ func(*sweepLocked, bool) bool = (*sweepLocked).sweep
            var _ func(unsafe.Pointer, uintptr, bool) bool = freegc
            var _ = func(s *mspan) (uint16, uintptr, *special, bool, uintptr) {
              return s.nelems, s.elemsize, s.specials, s.isUserArenaChunk, s.limit
            }
            var _ = func(s *mspan, i uintptr) *uint8 { return s.markBitsForIndex(i).bytep }
            var _ = func(sp *special) (uintptr, byte, *special) { return sp.offset, sp.kind, sp.next }
            var _ byte = _KindSpecialFinalizer
            var _ bool = runtimeFreegcEnabled
            var _ bool = sizeSpecializedMallocEnabled
            var _ func(uintptr) bool = reusableSize
            var _ = func(s *mspan, p uintptr) uintptr { return s.objIndex(p) + s.startAddr }
            var _ = func(gp *g) (bool, uintptr, uintptr, *m) { return gp.preempt, gp.stack.lo, gp.stack.hi, gp.m }
            var _ = func(mp *m) (*g, int32, int32, string) { return mp.curg, mp.locks, mp.mallocing, mp.preemptoff }
            var _ func() = Gosched

            // __dd_taint_osalloc is set by an init function that is injected
            // next to the OS-specific mmap. It never exits the process.
            var __dd_taint_osalloc func(n uintptr) unsafe.Pointer

            // Counters for tests.
            var __dd_taint_bitmaps uint64
            var __dd_taint_sweeps uint64

            // Test knob: 1 disables the sweep hook (negative control only).
            var __dd_taint_nosweep uint32

            // __dd_taint_testing is true only when the program links package
            // heapbits/heapbitstest, which defines the symbol with the value
            // true. Production programs do not link it, so the test knobs
            // below do nothing there.
            //
            //go:linkname __dd_taint_testing __dd_iast_heapbits_testing.enabled
            var __dd_taint_testing bool

            // __dd_taint_bitmap returns the bitmap of the arena of p, or nil.
            // With alloc true, it allocates a missing bitmap.
            func __dd_taint_bitmap(p uintptr, alloc bool) *__dd_taintBitmap {
              ha := heapArenaOf(p)
              if ha == nil {
                return nil
              }
              slot := (*unsafe.Pointer)(unsafe.Pointer(&ha.__dd_taint))
              bm := (*__dd_taintBitmap)(atomic.Loadp(unsafe.Pointer(slot)))
              if bm != nil || !alloc {
                return bm
              }
              if __dd_taint_osalloc == nil {
                return nil // platform not supported
              }
              nbm := (*__dd_taintBitmap)(__dd_taint_osalloc(unsafe.Sizeof(__dd_taintBitmap{})))
              if nbm == nil {
                return nil
              }
              if atomic.Casp1(slot, nil, unsafe.Pointer(nbm)) {
                atomic.Xadd64(&__dd_taint_bitmaps, 1)
                return nbm
              }
              // A lost race leaks the candidate. The claim protocol of the plan
              // (section 5.4) removes this leak.
              return (*__dd_taintBitmap)(atomic.Loadp(unsafe.Pointer(slot)))
            }

            // Entry points and workers
            //
            // The Go wrappers pass uintptr values (so that the values do not
            // escape). A uintptr is not updated when the stack moves. Thus
            // every entry point is nosplit up to the "is this heap memory?"
            // decision (the classifier): a stack address is refused before
            // the stack can move. After the decision, the range is heap
            // memory, which never moves, and the Go wrapper keeps it live; the
            // entry point then calls a normal function (the worker).
            //
            // A long loop in package runtime is not an async safe point. The
            // workers count work units and call __dd_taint_checkpoint every
            // 512 units, so that a long operation cannot delay a
            // stop-the-world. The sweep hook never yields.

            // __dd_taint_checkpoint yields the processor when the scheduler
            // asked for it and when the context permits it.
            func __dd_taint_checkpoint() {
              gp := getg()
              if !gp.preempt && !(__dd_taint_testing && atomic.Load(&__dd_taint_forceyield) != 0) {
                return
              }
              mp := gp.m
              if gp != mp.curg || mp.locks != 0 || mp.mallocing != 0 || mp.preemptoff != "" {
                return
              }
              // The same conditions as canPreemptM, and a running goroutine.
              if mp.p == 0 || mp.p.ptr().status != _Prunning || readgstatus(gp)&^_Gscan != _Grunning {
                return
              }
              if __dd_taint_testing {
                atomic.Xadd64(&__dd_taint_yields, 1)
              }
              Gosched()
            }

            // __dd_taint_apply sets (set=true) or clears the bits of [p, p+n).
            // Word k of a bitmap holds the bits of heap bytes [64k, 64k+64)
            // of the arena; all accesses use 64-bit words, so the byte order
            // does not matter. Partial words use atomic Or64/And64 because a
            // neighbour object can share the word. Full words belong to the
            // range only, so a plain store is enough. With yield true (worker
            // use only), it calls __dd_taint_checkpoint every 512 units.
            func __dd_taint_apply(p, n uintptr, set, yield bool) {
              end := p + n
              units := 0
              for p < end {
                // Each arena is one work unit (also without a bitmap).
                if yield {
                  if units++; units >= 512 {
                    units = 0
                    __dd_taint_checkpoint()
                  }
                }
                base := arenaBase(arenaIndex(p))
                aend := base + heapArenaBytes
                if aend > end || aend == 0 {
                  aend = end
                }
                if bm := __dd_taint_bitmap(p, false); bm != nil {
                  b0, b1 := p-base, aend-base
                  w0, w1 := b0/64, (b1-1)/64
                  for w := w0; w <= w1; w++ {
                    if yield {
                      if units++; units >= 512 {
                        units = 0
                        __dd_taint_checkpoint()
                      }
                    }
                    mask := ^uint64(0)
                    if w == w0 {
                      mask &= ^uint64(0) << (b0 % 64)
                    }
                    if w == w1 {
                      mask &= ^uint64(0) >> (63 - (b1-1)%64)
                    }
                    switch {
                    case mask == ^uint64(0) && set:
                      bm.b[w] = ^uint64(0)
                    case mask == ^uint64(0):
                      bm.b[w] = 0
                    case set:
                      atomic.Or64(&bm.b[w], mask)
                    default:
                      atomic.And64(&bm.b[w], ^mask)
                    }
                  }
                }
                p = aend
              }
            }

            // __dd_taint_probe is the stack probe (tests only): 1 when the
            // last classified address was in the stack of the current
            // goroutine, 2 when it was not.
            var __dd_taint_probe uint32

            // Test knobs: __dd_taint_movestack makes the entry points call a
            // function with a stack check before the classifier (negative
            // control of the stack probe); __dd_taint_forceyield makes every
            // checkpoint yield; __dd_taint_yields counts the yields.
            var __dd_taint_movestack uint32

            // __dd_taint_slowpath (test knob) makes __dd_taint_any use its
            // slow path when the arena has no bitmap.
            var __dd_taint_slowpath uint32

            // __dd_taint_slowcount counts the calls of __dd_taint_any that
            // reached the classification of the slow path (tests only).
            var __dd_taint_slowcount uint64

            // __dd_taint_workerprobe is like __dd_taint_probe, at the start of
            // each worker (tests only). A worker must never run for a stack
            // address: for a stack address, the value must stay 0.
            var __dd_taint_workerprobe uint32
            var __dd_taint_forceyield uint32
            var __dd_taint_yields uint64

            // __dd_taint_classifyprobe runs at the start of each entry point,
            // only when the program links heapbitstest.
            //
            //go:nosplit
            func __dd_taint_classifyprobe(p uintptr) {
              if atomic.Load(&__dd_taint_movestack) != 0 {
                // Exactly one stack check: with mayMoreStackMove, one move.
                // (Two moves can give back the first stack: the stack cache
                // reuses the last freed stack.)
                __dd_taint_growstack(0)
              }
              gp := getg()
              if p >= gp.stack.lo && p < gp.stack.hi {
                atomic.Store(&__dd_taint_probe, 1)
              } else {
                atomic.Store(&__dd_taint_probe, 2)
              }
            }

            // __dd_taint_probeworker runs at the start of each worker, only
            // when the program links heapbitstest.
            //
            //go:nosplit
            func __dd_taint_probeworker(p uintptr) {
              gp := getg()
              if p >= gp.stack.lo && p < gp.stack.hi {
                atomic.Store(&__dd_taint_workerprobe, 1)
              } else {
                atomic.Store(&__dd_taint_workerprobe, 2)
              }
            }

            // __dd_taint_growstack has a stack check (it is not a leaf), so
            // that -d=maymorestack=runtime.mayMoreStackMove moves the stack
            // when it is called.
            //
            //go:noinline
            func __dd_taint_growstack(n int) int {
              if n <= 0 {
                return 0
              }
              return __dd_taint_growstack(n-1) + 1
            }

            // __dd_taint_classify returns the span of [p, p+n) when the range
            // is inside one allocation slot of an in-use heap span, else nil.
            // The check makes sure that a range cannot change the bits of a
            // neighbour slot in the same span. Several tiny allocations can
            // share one 16-byte slot: inside it, the caller must give a
            // correct range.
            //
            //go:nosplit
            func __dd_taint_classify(p, n uintptr) *mspan {
              s := spanOfHeap(p)
              if s == nil {
                return nil
              }
              obj := s.startAddr + s.objIndex(p)*s.elemsize
              if p+n > obj+s.elemsize || p+n > s.limit {
                return nil
              }
              return s
            }

            // __dd_taint_prepare makes sure that all arenas of [p, p+n) have a
            // bitmap. It returns false if one bitmap cannot be allocated.
            func __dd_taint_prepare(p, n uintptr) bool {
              end := p + n
              units := 0
              for p < end {
                if units++; units >= 512 {
                  units = 0
                  __dd_taint_checkpoint()
                }
                if __dd_taint_bitmap(p, true) == nil {
                  return false
                }
                aend := arenaBase(arenaIndex(p)) + heapArenaBytes
                if aend > end || aend == 0 {
                  aend = end
                }
                p = aend
              }
              return true
            }

            // __dd_taint_set taints [p, p+n). It returns false (and changes no
            // bit) when the feature is off, when the range is not inside one
            // allocation slot of an in-use heap span (thus stack memory,
            // globals and off-heap memory are refused), or when a bitmap
            // cannot be allocated. Inside a tiny slot, the caller must give
            // the range of one value (see __dd_taint_classify).
            //
            //go:nosplit
            func __dd_taint_set(p, n uintptr) bool {
              if __dd_taint_testing {
                __dd_taint_classifyprobe(p)
              }
              if __dd_taint_osalloc == nil || n == 0 || p+n < p {
                return false
              }
              s := __dd_taint_classify(p, n)
              // User arena chunks (GOEXPERIMENT=arenas) are freed without a
              // sweep of their objects: refuse them.
              if s == nil || s.isUserArenaChunk {
                return false
              }
              return __dd_taint_setworker(s, p, n)
            }

            // __dd_taint_setworker is the worker of __dd_taint_set.
            //
            //go:noinline
            func __dd_taint_setworker(s *mspan, p, n uintptr) bool {
              if __dd_taint_testing {
                __dd_taint_probeworker(p)
              }
              if !__dd_taint_prepare(p, n) {
                return false
              }
              __dd_taint_apply(p, n, true, true)
              atomic.Store8(&s.__dd_taint, 1)
              return true
            }

            // __dd_taint_clear removes the taint of [p, p+n). It ignores a
            // range that is not inside one allocation slot of an in-use heap
            // span. The caller rule for tiny slots also applies.
            //
            //go:nosplit
            func __dd_taint_clear(p, n uintptr) {
              if __dd_taint_testing {
                __dd_taint_classifyprobe(p)
              }
              if n == 0 || p+n < p {
                return
              }
              if __dd_taint_classify(p, n) == nil {
                return
              }
              __dd_taint_clearworker(p, n)
            }

            // __dd_taint_clearworker is the worker of __dd_taint_clear.
            //
            //go:noinline
            func __dd_taint_clearworker(p, n uintptr) {
              if __dd_taint_testing {
                __dd_taint_probeworker(p)
              }
              __dd_taint_apply(p, n, false, true)
            }

            // __dd_taint_clearslot clears the bits of the whole allocation
            // slot of the heap object at p (freegc hook; it does not yield).
            func __dd_taint_clearslot(p uintptr) {
              s := spanOfHeap(p)
              if s == nil || atomic.Load8(&s.__dd_taint) == 0 {
                return
              }
              obj := s.startAddr + s.objIndex(p)*s.elemsize
              __dd_taint_apply(obj, s.elemsize, false, false)
            }

            // __dd_taint_fastwords is the largest number of bitmap words that
            // the nosplit fast path of __dd_taint_any reads (w0 to w1, with
            // w1-w0 < __dd_taint_fastwords).
            const __dd_taint_fastwords = 16

            // __dd_taint_arena is heapArenaOf with the nosplit directive (for
            // the entry points).
            //
            //go:nosplit
            func __dd_taint_arena(p uintptr) *heapArena {
              ri := arenaIndex(p)
              i1, i2 := ri.l1(), ri.l2()
              if i1 >= uint(len(mheap_.arenas)) {
                return nil
              }
              l2 := mheap_.arenas[i1]
              if l2 == nil || i2 >= uint(len(l2)) {
                return nil
              }
              return l2[i2]
            }

            // __dd_taint_any tells if one byte of [p, p+n) is tainted. It is
            // safe for all addresses: memory that is not in an in-use heap
            // span is never tainted.
            //
            // Fast path (nosplit, bounded): a range in one arena that covers
            // at most __dd_taint_fastwords bitmap words (about 1 KiB) is
            // checked here. The bits of stack memory are always 0, so this is
            // correct also for a stack address. Longer ranges are classified
            // (a stack address is refused before the worker can move the
            // stack), then checked by the worker.
            //
            //go:nosplit
            func __dd_taint_any(p, n uintptr) bool {
              if __dd_taint_testing {
                __dd_taint_classifyprobe(p)
              }
              if n == 0 || p+n < p {
                return false
              }
              base := uintptr(arenaIndex(p))*heapArenaBytes + arenaBaseOffset
              if end := p + n; end-base <= heapArenaBytes {
                ha := __dd_taint_arena(p)
                if ha == nil {
                  if !__dd_taint_testing || atomic.Load(&__dd_taint_slowpath) == 0 {
                    return false
                  }
                  goto slow
                }
                bm := (*__dd_taintBitmap)(atomic.Loadp(unsafe.Pointer(&ha.__dd_taint)))
                if bm == nil {
                  // No bitmap: no taint. The test knob sends the call to the
                  // slow path (also above, without arena metadata), so that
                  // tests can check the classification of any address.
                  if !__dd_taint_testing || atomic.Load(&__dd_taint_slowpath) == 0 {
                    return false
                  }
                  goto slow
                }
                b0, b1 := p-base, end-base
                w0, w1 := b0/64, (b1-1)/64
                // Always true (b1 <= heapArenaBytes): the guard makes a bug
                // a missed taint, not an index panic.
                if w0 > w1 || w1 >= uintptr(len(bm.b)) {
                  return false
                }
                first := ^uint64(0) << (b0 % 64)
                last := ^uint64(0) >> (63 - (b1-1)%64)
                if w0 == w1 {
                  return bm.b[w0]&first&last != 0
                }
                if bm.b[w0]&first != 0 || bm.b[w1]&last != 0 {
                  return true
                }
                if w1-w0 < __dd_taint_fastwords {
                  for w := w0 + 1; w < w1; w++ {
                    if bm.b[w] != 0 {
                      return true
                    }
                  }
                  return false
                }
              }
            slow:
              if __dd_taint_testing {
                atomic.Xadd64(&__dd_taint_slowcount, 1)
              }
              s := spanOfHeap(p)
              if s == nil {
                return false
              }
              // A Go value never extends after the end of its span: do not
              // walk memory after it (this bounds the work of the worker).
              if p+n > s.limit {
                n = s.limit - p
              }
              return __dd_taint_anyworker(p, n)
            }

            // __dd_taint_anyworker is the worker of __dd_taint_any. Plain
            // loads: a race with a writer gives the old or the new value of
            // the word.
            //
            //go:noinline
            func __dd_taint_anyworker(p, n uintptr) bool {
              if __dd_taint_testing {
                __dd_taint_probeworker(p)
              }
              end := p + n
              units := 0
              for p < end {
                // Each arena is one work unit (also without a bitmap).
                if units++; units >= 512 {
                  units = 0
                  __dd_taint_checkpoint()
                }
                base := arenaBase(arenaIndex(p))
                aend := base + heapArenaBytes
                if aend > end || aend == 0 {
                  aend = end
                }
                if bm := __dd_taint_bitmap(p, false); bm != nil {
                  b0, b1 := p-base, aend-base
                  w0, w1 := b0/64, (b1-1)/64
                  first := ^uint64(0) << (b0 % 64)
                  last := ^uint64(0) >> (63 - (b1-1)%64)
                  if w0 == w1 {
                    if bm.b[w0]&first&last != 0 {
                      return true
                    }
                  } else {
                    if bm.b[w0]&first != 0 || bm.b[w1]&last != 0 {
                      return true
                    }
                    // Batches of at most 512 words, a checkpoint between them.
                    for w := w0 + 1; w < w1; {
                      stop := w + uintptr(512-units)
                      if stop > w1 {
                        stop = w1
                      }
                      units += int(stop - w)
                      for ; w < stop; w++ {
                        if bm.b[w] != 0 {
                          return true
                        }
                      }
                      if units >= 512 {
                        units = 0
                        __dd_taint_checkpoint()
                      }
                    }
                  }
                }
                p = aend
              }
              return false
            }

            // __dd_taint_sweep clears the bits of all objects of s that are
            // not marked. The sweeper calls it before it frees them. Thus a
            // new object never gets the taint of an old object at the same
            // address. Runs of dead objects are cleared with one call.
            //
            // Flag protocol (with __dd_taint_set: bits, then flag=1): store
            // flag=0 first, clear, then check the remaining bits with atomic
            // loads; if one is set, store flag=1 again. A concurrent set on a
            // live object is never lost: its flag store is after our store,
            // or its bits are visible to our check.
            //
            //go:nowritebarrierrec
            func __dd_taint_sweep(s *mspan) {
              if atomic.Load(&__dd_taint_nosweep) != 0 {
                return
              }
              atomic.Xadd64(&__dd_taint_sweeps, 1)
              atomic.Store8(&s.__dd_taint, 0)
              size := s.elemsize
              base := s.base()
              n := uintptr(s.nelems)
              marks := s.markBitsForIndex(0).bytep
              // A dead object with a finalizer becomes live again (the
              // sweeper marks it); it must keep its taint.
              hasFin := false
              for sp := s.specials; sp != nil; sp = sp.next {
                if sp.kind == _KindSpecialFinalizer {
                  hasFin = true
                  break
                }
              }
              run := uintptr(0) // start of the current dead run
              dead := false
              for i := uintptr(0); i < n; {
                mb := *addb(marks, i/8)
                if !hasFin && i%8 == 0 && n-i >= 8 && (mb == 0xff || mb == 0) {
                  // 8 objects with the same state.
                  if mb == 0xff && dead {
                    __dd_taint_apply(base+run*size, (i-run)*size, false, false)
                    dead = false
                  } else if mb == 0 && !dead {
                    run, dead = i, true
                  }
                  i += 8
                  continue
                }
                if mb&(1<<(i%8)) != 0 || (hasFin && __dd_taint_hasfin(s, i*size, size)) {
                  if dead {
                    __dd_taint_apply(base+run*size, (i-run)*size, false, false)
                    dead = false
                  }
                } else if !dead {
                  run, dead = i, true
                }
                i++
              }
              if dead {
                __dd_taint_apply(base+run*size, (n-run)*size, false, false)
              }
              // Only live objects can still have taint: check them until one
              // has taint.
              for i := uintptr(0); i < n; {
                mb := *addb(marks, i/8)
                if !hasFin && i%8 == 0 && mb == 0 {
                  i += 8
                  continue
                }
                if mb&(1<<(i%8)) != 0 || (hasFin && __dd_taint_hasfin(s, i*size, size)) {
                  if __dd_taint_anyatomic(base+i*size, size) {
                    atomic.Store8(&s.__dd_taint, 1)
                    break
                  }
                }
                i++
              }
            }

            // __dd_taint_hasfin tells if the object at span offset off has a
            // finalizer special.
            //
            //go:nowritebarrierrec
            func __dd_taint_hasfin(s *mspan, off, size uintptr) bool {
              for sp := s.specials; sp != nil && sp.offset < off+size; sp = sp.next {
                if sp.offset >= off && sp.kind == _KindSpecialFinalizer {
                  return true
                }
              }
              return false
            }

            // __dd_taint_anyatomic is __dd_taint_any with atomic loads, for the
            // flag protocol of __dd_taint_sweep. [p, p+n) is in one span.
            //
            //go:nowritebarrierrec
            func __dd_taint_anyatomic(p, n uintptr) bool {
              end := p + n
              for p < end {
                base := arenaBase(arenaIndex(p))
                aend := base + heapArenaBytes
                if aend > end || aend == 0 {
                  aend = end
                }
                if bm := __dd_taint_bitmap(p, false); bm != nil {
                  b0, b1 := p-base, aend-base
                  w0, w1 := b0/64, (b1-1)/64
                  for w := w0; w <= w1; w++ {
                    mask := ^uint64(0)
                    if w == w0 {
                      mask &= ^uint64(0) << (b0 % 64)
                    }
                    if w == w1 {
                      mask &= ^uint64(0) >> (63 - (b1-1)%64)
                    }
                    if atomic.Load64(&bm.b[w])&mask != 0 {
                      return true
                    }
                  }
                }
                p = aend
              }
              return false
            }

            // __dd_taint_enabled tells if the platform has a taint allocator.
            func __dd_taint_enabled() bool {
              return __dd_taint_osalloc != nil
            }

            func __dd_taint_stats() (bitmaps, sweeps uint64) {
              return atomic.Load64(&__dd_taint_bitmaps), atomic.Load64(&__dd_taint_sweeps)
            }

            func __dd_taint_setnosweep(v bool) {
              if !__dd_taint_testing {
                return
              }
              if v {
                atomic.Store(&__dd_taint_nosweep, 1)
              } else {
                atomic.Store(&__dd_taint_nosweep, 0)
              }
            }

            // Exported to github.com/DataDog/dd-iast-go/internal/taint/heapbits (push linkname).
            //go:linkname __dd_taint_api_set __dd_iast_heapbits.set
            var __dd_taint_api_set = __dd_taint_set
            //go:linkname __dd_taint_api_clear __dd_iast_heapbits.clear
            var __dd_taint_api_clear = __dd_taint_clear
            //go:linkname __dd_taint_api_any __dd_iast_heapbits.any
            var __dd_taint_api_any = __dd_taint_any
            //go:linkname __dd_taint_api_enabled __dd_iast_heapbits.enabled
            var __dd_taint_api_enabled = __dd_taint_enabled
            //go:linkname __dd_taint_api_stats __dd_iast_heapbits.stats
            var __dd_taint_api_stats = __dd_taint_stats
            // Test knobs of the stack probe and of the checkpoints.
            func __dd_taint_testknobs(movestack, forceyield bool) (probe, workerprobe uint32, yields uint64) {
              if !__dd_taint_testing {
                return 0, 0, 0
              }
              v := uint32(0)
              if movestack {
                v = 1
              }
              atomic.Store(&__dd_taint_movestack, v)
              v = 0
              if forceyield {
                v = 1
              }
              atomic.Store(&__dd_taint_forceyield, v)
              return atomic.Xchg(&__dd_taint_probe, 0), atomic.Xchg(&__dd_taint_workerprobe, 0), atomic.Load64(&__dd_taint_yields)
            }
            func __dd_taint_setslowpath(v bool) uint64 {
              if !__dd_taint_testing {
                return 0
              }
              if v {
                atomic.Store(&__dd_taint_slowpath, 1)
              } else {
                atomic.Store(&__dd_taint_slowpath, 0)
              }
              return atomic.Load64(&__dd_taint_slowcount)
            }
            //go:linkname __dd_taint_api_slowpath __dd_iast_heapbits.slowpath
            var __dd_taint_api_slowpath = __dd_taint_setslowpath

            //go:linkname __dd_taint_api_testknobs __dd_iast_heapbits.testknobs
            var __dd_taint_api_testknobs = __dd_taint_testknobs

            // Test knob: runtime.freegc of a noscan object.
            func __dd_taint_freegc(p unsafe.Pointer, size uintptr) bool {
              if !__dd_taint_testing {
                return false
              }
              return freegc(p, size, true)
            }
            //go:linkname __dd_taint_api_freegc __dd_iast_heapbits.freegc
            var __dd_taint_api_freegc = __dd_taint_freegc
            //go:linkname __dd_taint_api_nosweep __dd_iast_heapbits.nosweep
            var __dd_taint_api_nosweep = __dd_taint_setnosweep

  # 2. One flag for each span: "one bit was set in this span".
  - id: mspan taint flag
    join-point:
      struct-definition: runtime.mspan
    advice:
      - add-struct-field:
          name: __dd_taint
          type: uint8

  # 3. Clear the bits of dead objects when the span is swept.
  - id: sweep clears taint
    join-point:
      all-of:
        - import-path: runtime
        - function-body:
            function:
              - receiver: "*runtime.sweepLocked"
              - name: sweep
    advice:
      - prepend-statements:
          template: |-
            if __dd_s := sl.mspan; __dd_s.__dd_taint != 0 {
              __dd_taint_sweep(__dd_s)
            }

  # 4. GOEXPERIMENT=runtimefreegc: freegc gives an object back at once (no
  #    sweep). Clear the bits of its whole slot first (the size argument can be
  #    smaller than the slot). The caller promises that it is dead. Only when
  #    freegc can free the object (the same checks as freegc), so that no work
  #    is added when it returns at once.
  - id: freegc clears taint
    join-point:
      all-of:
        - import-path: runtime
        - function-body:
            function:
              - name: freegc
    advice:
      - prepend-statements:
          template: |-
            {{- $ptr := .Function.Argument 0 -}}
            {{- $size := .Function.Argument 1 -}}
            {{- $noscan := .Function.Argument 2 -}}
            if runtimeFreegcEnabled && {{ $ptr }} != nil && reusableSize({{ $size }}) && !(sizeSpecializedMallocEnabled && !{{ $noscan }}) {
              __dd_taint_clearslot(uintptr({{ $ptr }}))
            }

  # 5. Non-fatal OS allocation: only where runtime.mmap has a Go body, and only
  #    on the supported platforms (linux and darwin on amd64 and arm64, no
  #    sanitizers). Elsewhere the feature is off.
  - id: taint os alloc
    join-point:
      all-of:
        - import-path: runtime
        - function-body:
            function:
              - name: mmap
    advice:
      - inject-declarations:
          template: |-
            func __dd_taint_mmapalloc(n uintptr) unsafe.Pointer {
              p, err := mmap(nil, n, _PROT_READ|_PROT_WRITE, _MAP_ANON|_MAP_PRIVATE, -1, 0)
              if err != 0 {
                return nil
              }
              return p
            }

            func init() {
              if asanenabled || msanenabled {
                return
              }
              if (GOOS == "linux" || GOOS == "darwin") && (GOARCH == "amd64" || GOARCH == "arm64") {
                __dd_taint_osalloc = __dd_taint_mmapalloc
              }
            }
