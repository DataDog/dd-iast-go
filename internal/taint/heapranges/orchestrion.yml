meta:
  name: github.com/DataDog/dd-iast-go/internal/taint/heapranges
  description: Heap taint tracking
aspects:
  - id: heap.span
    tracer-internal: true
    join-point:
      struct-definition: runtime.mspan
    advice:
      - add-struct-field:
          name: ddiastTaint
          type: internal/runtime/atomic.Uint64
      - add-blank-import: unsafe
      - inject-declarations:
          links:
            - github.com/DataDog/dd-iast-go/internal/taint/heapranges
          imports:
            ddheapatomic: internal/runtime/atomic
          template: |-
            var (
            	ddiastHeapGate ddheapatomic.Uint32
            	_              *sysMemStat                              = &memstats.other_sys
            	_              *ddheapatomic.Uint64                     = &gcController.mappedReady
            	_              func(*sysMemStat, int64)                 = (*sysMemStat).add
            	_              func(*ddheapatomic.Uint64, int64) uint64 = (*ddheapatomic.Uint64).Add
            )
            
            //go:linkname ddiastHeapRangesNeedRuntime runtime.ddiastHeapRangesNeedTheWovenRuntime
            func ddiastHeapRangesNeedRuntime() {}
            
            //go:linkname ddiastHeapRangesGate github.com/DataDog/dd-iast-go/internal/taint/heapranges.runtimeGate
            func ddiastHeapRangesGate() uint32 {
            	return ddiastHeapGate.Load()
            }
            
            //go:linkname ddiastHeapRangesAccountSlab github.com/DataDog/dd-iast-go/internal/taint/heapranges.accountSlab
            //go:nosplit
            func ddiastHeapRangesAccountSlab() {
            	memstats.other_sys.add(1 << 20)
            	gcController.mappedReady.Add(1 << 20)
            }
  - id: heap.package
    tracer-internal: true
    join-point:
      all-of:
        - import-path: github.com/DataDog/dd-iast-go/internal/taint/heapranges
        - function-body:
            function:
              - name: Enabled
    advice:
      - add-blank-import: unsafe
      - inject-declarations:
          imports:
            ddheapknobs: github.com/DataDog/dd-iast-go/internal/taint/heapranges/internal/knobs
          template: |-
            //go:linkname runtimeGate
            func runtimeGate() uint32
            
            //go:linkname needWovenRuntime runtime.ddiastHeapRangesNeedTheWovenRuntime
            func needWovenRuntime()
            
            //go:linkname accountSlab
            func accountSlab()
            
            var _ = func() bool {
            	needWovenRuntime()
            	ddheapknobs.Gate = runtimeGate
            	ddheapknobs.OffReason = func() string { return offReason }
            	ddheapknobs.MapSlab = func() (bool, uint64) {
            		allocator := newSlabAllocator(slabSize)
            		_, ok := allocator.allocate()
            		return ok, allocator.mapped.Load()
            	}
            	runtimeAccountSlab = accountSlab
            	runtimeEnabled = func() bool { return runtimeGate() == 1 }
            	return true
            }()
