            			if conflict {
            				ddiastPoisonAndRetire(span, index, processor)
            			}
            			break
            		}
            		if uint32(attempt) >= ddiastSetFailures.Load() && ddiastPublishEntry(span, index, old, next, processor) {
            			result = ctx.complete
            			break
            		}
            		if ddiastRecordEntry(next) {
            			ddiastRetire(processor, next, ddiastRetireRecord)
            		}
            		if attempt == 3 && conflict {
            			ddiastPoisonAndRetire(span, index, processor)
            		}
            	}
            	ddiastLeave(mp, processor)
            	KeepAlive(p)
            	return result
            }
            
            const ddiastSensitive = uint64(1 << 54)
            
            type ddiastCopyWork struct {
            	destination [65]ddiastRange
            	source      [65]ddiastRange
            	input       [65]ddiastRange
            	output      [65]ddiastRange
            }
            
            //go:nosplit
            func ddiastCopyUnknown(item ddiastRange) ddiastRange {
            	item.origin &= ddiastSensitive
            	item.marks = 0
            	item.flags &= ddiastFlagExposedPath
            	item.snapshot = ^uint32(0)
            	return item
            }
            
            //go:nosplit
            func ddiastCopyAppend(work *[64]ddiastRange, count uint32, item ddiastRange, kind uint8, extent uint32) (uint32, bool) {
            	count, ok := ddiastAppendWriteRange(work, count, item, kind, extent)
            	if !ok && count == 64 {
            		last := &work[63]
            		last.origin = ddiastSensitive
            		last.flags = ddiastFlagExposedPath
            	}
            	return count, ok
            }
            
            //go:nosplit
            func ddiastCopyLoad(entry, extent uint32, work *[64]ddiastRange) (uint32, uint8, bool) {
            	var count uint32
            	var lastEnd uint64
            	var kind uint8
            	for records := 0; records < 16 && entry != 0; records++ {
            		if !ddiastRecordEntry(entry) || (entry-1)&(ddiastSlabUnits-1) > ddiastSlabUnits-2 {
            			return 0, 0, false
            		}
            		address := ddiastSlabAddress(entry)
            		if address == 0 {
            			return 0, 0, false
            		}
            		record := (*ddiastRecord)(ddheapunsafe.Pointer(address))
            		if record.count == 0 || record.count > 4 || record.kind > 2 || (records != 0 && record.kind != kind) {
            			return 0, 0, false
            		}
            		kind = record.kind
            		for i := uint8(0); i < record.count; i++ {
            			item := record.ranges[i]
            			end := uint64(item.offset) + uint64(item.length)
            			if item.length == 0 || uint64(item.offset) < lastEnd || end > uint64(extent) || count >= 64 {
            				return 0, 0, false
            			}
            			lastEnd = end
            			work[count] = item
            			count++
            		}
            		entry = record.next
            	}
            	return count, kind, entry == 0
            }
            
            //go:nosplit
            func ddiastCopySource(input *[64]ddiastRange, inputs uint32, kind uint8, offset, length uint32, dst ddheapunsafe.Pointer, work *[64]ddiastRange, budget *uint64) uint32 {
            	var count uint32
            	for i := uint32(0); i < inputs; i++ {
            		item := input[i]
            		end := uint64(item.offset) + uint64(item.length)
            		if end <= uint64(offset) || uint64(item.offset) >= uint64(offset)+uint64(length) {
            			continue
            		}
            		lo := item.offset
            		if lo < offset {
            			lo = offset
            		}
            		hi := uint32(end)
            		if uint64(hi) > uint64(offset)+uint64(length) {
            			hi = offset + length
            		}
            		item = ddiastSetPiece(item, lo, hi)
            		item.offset = lo - offset
            		if kind == 2 {
            			item.flags |= ddiastFlagExposedPath
            		}
            		if item.origin&ddiastOriginGenerationMask == 0 || item.flags&ddiastFlagConflict != 0 {
            			item = ddiastCopyUnknown(item)
            		} else if kind == 2 && ddiastSnapshotsOff.Load() == 0 {
            			checked := uint64(item.length)
            			if checked > *budget {
            				checked = *budget
            			}
            			*budget -= checked
            			snapshot := ddiastSnapshotAddress(&item, 0, checked)
            			if checked == 0 || snapshot == 0 || !ddiastSnapshotEqual(uintptr(dst)+uintptr(item.offset), snapshot, checked) {
            				item = ddiastCopyUnknown(item)
            			}
            			if checked != 0 && checked < uint64(item.length) {
            				tail := ddiastCopyUnknown(item)
            				tail.offset += uint32(checked)
            				tail.length -= uint32(checked)
            				item.length = uint32(checked)
            				var ok bool
            				count, ok = ddiastCopyAppend(work, count, item, 2, length)
            				if !ok {
            					return count
            				}
            				count, ok = ddiastCopyAppend(work, count, tail, 2, length)
            				if !ok {
            					return count
            				}
            				continue
            			}
            		} else if kind == 2 || (ddiastSnapshotsOff.Load() != 0 && item.flags&ddiastFlagExposedPath != 0) {
            			item = ddiastCopyUnknown(item)
            		} else {
            			item.snapshot = ^uint32(0)
            		}
            		var ok bool
            		count, ok = ddiastCopyAppend(work, count, item, 2, length)
            		if !ok {
            			return count
            		}
            	}
            	return count
            }
            
            //go:nosplit
            func ddiastCopyUsable(self uint64) bool {
            	generation := self & ddiastOriginGenerationMask
            	slot := uint32(self >> ddiastOriginSlotShift & 63)
            	if self == 0 || self>>46 != 0 || !ddiastOwnerLive(slot, generation) {
            		return false
            	}
            	descriptor := ddiastSnapshotAreas[slot].Load()
            	return descriptor != ddiastSnapshotBusy && descriptor>>24 == generation && uint32(descriptor&ddiastSnapshotEntryMask) != 0
            }
            
            //go:nosplit
            func ddiastCopyExpose(item ddiastRange, address uintptr, self uint64, usable bool, budget *uint64) (ddiastRange, ddiastRange) {
            	if item.origin&ddiastOriginGenerationMask == 0 || item.flags&ddiastFlagConflict != 0 {
            		return ddiastCopyUnknown(item), ddiastRange{}
            	}
            	if ddiastSnapshotsOff.Load() != 0 {
            		item.snapshot = ^uint32(0)
            		return item, ddiastRange{}
            	}
            	if !usable || item.origin&(1<<46-1) != self {
            		return ddiastCopyUnknown(item), ddiastRange{}
            	}
            	if item.snapshot != ^uint32(0) {
            		return item, ddiastRange{}
            	}
            	known := uint64(item.length)
            	if known > *budget {
            		known = *budget
            	}
            	*budget -= known
            	if known == 0 {
            		return ddiastCopyUnknown(item), ddiastRange{}
            	}
            	slot := uint32(self >> ddiastOriginSlotShift & 63)
            	generation := self & ddiastOriginGenerationMask
            	snapshot, ok := ddiastStoreSnapshot(slot, generation, ddheapunsafe.Pointer(address), uintptr(known))
            	if !ok {
            		return ddiastCopyUnknown(item), ddiastRange{}
            	}
            	item.snapshot = snapshot
            	if known == uint64(item.length) {
            		return item, ddiastRange{}
            	}
            	tail := ddiastCopyUnknown(item)
            	tail.offset += uint32(known)
            	tail.length -= uint32(known)
            	item.length = uint32(known)
            	return item, tail
            }
            
            type ddiastCopyContext struct {
            	out       *[64]ddiastRange
            	source    *[64]ddiastRange
            	count     uint32
            	sources   uint32
            	start     uint32
            	end       uint32
            	extent    uint32
            	kind      uint8
            	wasKind   uint8
            	base      uintptr
            	self      uint64
            	budget    *uint64
            	usable    bool
            	collapsed bool
            }
            
            //go:nosplit
            func ddiastCopyPut(ctx *ddiastCopyContext, item ddiastRange, expose bool) {
            	if ctx.collapsed || item.length == 0 {
            		return
            	}
            	var tail ddiastRange
            	if expose {
            		if ctx.wasKind == 1 && ctx.kind == 2 && (item.offset < ctx.start || item.offset >= ctx.end) {
            			item.flags |= ddiastFlagExposedPath
            			item.snapshot = ^uint32(0)
            			if item.flags&ddiastFlagConflict == 0 {
            				item, tail = ddiastCopyExpose(item, ctx.base+uintptr(item.offset), ctx.self, ctx.usable, ctx.budget)
            			}
            		} else {
            			item, tail = ddiastCopyExpose(item, ctx.base+uintptr(item.offset), ctx.self, ctx.usable, ctx.budget)
            		}
            	}
            	var ok bool
            	ctx.count, ok = ddiastCopyAppend(ctx.out, ctx.count, item, ctx.kind, ctx.extent)
            	if ok && tail.length != 0 {
            		ctx.count, ok = ddiastCopyAppend(ctx.out, ctx.count, tail, ctx.kind, ctx.extent)
            	}
            	if !ok {
            		ctx.collapsed = true
            	}
            }
            
            //go:nosplit
            func ddiastCopyInsert(ctx *ddiastCopyContext) {
            	for i := uint32(0); i < ctx.sources && !ctx.collapsed; i++ {
            		item := ctx.source[i]
            		item.offset += ctx.start
            		ddiastCopyPut(ctx, item, ctx.kind == 2)
            	}
            }
            
            func ddiastCopyPrepare(input *[64]ddiastRange, inputs uint32, ctx *ddiastCopyContext) {
            	inserted := false
            	for i := uint32(0); i < inputs; i++ {
            		item := input[i]
            		end := uint64(item.offset) + uint64(item.length)
            		expose := ctx.wasKind == 1 && ctx.kind == 2
            		if end <= uint64(ctx.start) {
            			ddiastCopyPut(ctx, item, expose)
            			continue
            		}
            		if item.offset < ctx.start {
            			ddiastCopyPut(ctx, ddiastSetPiece(item, item.offset, ctx.start), expose)
            		}
            		if !inserted {
            			ddiastCopyInsert(ctx)
            			inserted = true
            		}
            		if item.offset >= ctx.end {
            			ddiastCopyPut(ctx, item, expose)
            		} else if end > uint64(ctx.end) {
            			ddiastCopyPut(ctx, ddiastSetPiece(item, ctx.end, uint32(end)), expose)
            		}
            	}
            	if !inserted {
            		ddiastCopyInsert(ctx)
            	}
            }
            
            //go:nosplit
            func ddiastCopySame(old uint32, oldKind, kind uint8, input *[64]ddiastRange, inputs uint32, output *[64]ddiastRange, outputs uint32) bool {
            	if old == 0 {
            		return outputs == 0
            	}
            	if old == ddiastEntryPrivate {
            		return kind == 1 && outputs == 0
            	}
            	if oldKind != kind || inputs != outputs {
            		return false
            	}
            	for i := uint32(0); i < inputs; i++ {
            		if input[i] != output[i] {
            			return false
            		}
            	}
            	return true
            }
            
            //go:linkname ddiastCopy github.com/DataDog/dd-iast-go/internal/taint/heapranges.wovenCopy
            //go:nosplit
            func ddiastCopy(dst, src ddheapunsafe.Pointer, n uintptr, requestedKind uint8, self uint64, scratch ddheapunsafe.Pointer) bool {
            	if ddiastHeapGate.Load() != 1 || requestedKind > 2 {
            		return false
            	}
            	span, offset, index := ddiastClassify(dst, n)
            	if span == nil {
            		return false
            	}
            	sourceSpan, sourceOffset, sourceIndex := ddiastClassify(src, n)
            	if sourceSpan == nil && src != nil && spanOfHeap(uintptr(src)) != nil {
            		return false
            	}
            	mp, processor := ddiastEnter()
            	if mp == nil {
            		ddiastPoisonAndRetire(span, index, ddiastSlabCount)
            		KeepAlive(dst)
            		KeepAlive(src)
            		return false
            	}
            	work := (*ddiastCopyWork)(scratch)
            	destination := (*[64]ddiastRange)(ddheapunsafe.Pointer(&work.destination[0]))
            	source := (*[64]ddiastRange)(ddheapunsafe.Pointer(&work.source[0]))
            	input := (*[64]ddiastRange)(ddheapunsafe.Pointer(&work.input[0]))
            	output := (*[64]ddiastRange)(ddheapunsafe.Pointer(&work.output[0]))
            	budget := ddiastSnapshotSize
            	usable := ddiastCopyUsable(self)
            	var result bool
            	for attempt := 0; attempt < 4; attempt++ {
            		old := ddiastReadEntry(span, index)
            		if old == ddiastEntryPoison {
            			break
            		}
            		kind, oldKind := requestedKind, requestedKind
            		var oldCount uint32
            		if old == 0 {
            			if kind == 1 {
            				kind = 2
            			}
            			oldKind = kind
            		} else if old == ddiastEntryPrivate {
            			oldKind = 1
            			if kind != 2 {
            				kind = 1
            			}
            		} else {
            			var ok bool
            			oldCount, oldKind, ok = ddiastCopyLoad(old, uint32(span.elemsize), destination)
            			if !ok {
            				ddiastPoisonAndRetire(span, index, processor)
            				break
            			}
            			kind = oldKind
            			if oldKind == 1 && requestedKind == 2 {
            				kind = 2
            			}
            		}
            		var sources uint32
            		if sourceSpan != nil {
            			var sourceEntry, inputCount uint32
            			var inputKind uint8
            			sourceInput := input
            			ok := true
            			if sourceSpan == span && sourceIndex == index {
            				sourceEntry, inputCount, inputKind, sourceInput = old, oldCount, oldKind, destination
            			} else {
            				sourceEntry = ddiastReadEntry(sourceSpan, sourceIndex)
            				if ddiastRecordEntry(sourceEntry) {
            					inputCount, inputKind, ok = ddiastCopyLoad(sourceEntry, uint32(sourceSpan.elemsize), input)
            				}
            			}
            			if sourceEntry == ddiastEntryPoison || !ok {
            				source[0] = ddiastRange{length: uint32(n), origin: ddiastSensitive, flags: ddiastFlagExposedPath, snapshot: ^uint32(0)}
            				sources = 1
            			} else if inputCount != 0 {
            				sources = ddiastCopySource(sourceInput, inputCount, inputKind, uint32(sourceOffset), uint32(n), dst, source, &budget)
            			}
            		}
            		ctx := ddiastCopyContext{out: output, source: source, sources: sources, start: uint32(offset), end: uint32(offset + n),
            			extent: uint32(span.elemsize), kind: kind, wasKind: oldKind, base: uintptr(dst) - offset, self: self, budget: &budget, usable: usable}
            		ddiastCopyPrepare(destination, oldCount, &ctx)
            		if ddiastCopySame(old, oldKind, kind, destination, oldCount, output, ctx.count) {
            			if uint32(attempt) >= ddiastCopyFailures.Load() && ddiastCompareEntry(span, index, old, old) {
            				result = true
            				break
            			}
            			if attempt == 3 {
            				ddiastPoisonAndRetire(span, index, processor)
            			}
            			continue
            		}
            		next, ok := ddiastBuildWriteChain(output, ctx.count, kind, processor)
            		if !ok {
            			ddiastPoisonAndRetire(span, index, processor)
            			break
            		}
            		if ctx.count == 0 && kind == 1 {
            			next = ddiastEntryPrivate
            		}
            		if uint32(attempt) >= ddiastCopyFailures.Load() && ddiastPublishEntry(span, index, old, next, processor) {
            			result = true
            			break
            		}
            		if ddiastRecordEntry(next) {
            			ddiastRetire(processor, next, ddiastRetireRecord)
            		}
            		if attempt == 3 {
            			ddiastPoisonAndRetire(span, index, processor)
            		}
            	}
            	ddiastLeave(mp, processor)
            	KeepAlive(dst)
            	KeepAlive(src)
            	return result
            }
            
            //go:linkname ddiastStartOwner github.com/DataDog/dd-iast-go/internal/taint/heapranges.wovenStartOwner
            func ddiastStartOwner(slot uint32, generation uint64) bool {
            	if ddiastHeapGate.Load() != 1 || slot >= uint32(len(ddiastOwners)) || generation == 0 || generation > ddiastOriginGenerationMask {
            		return false
            	}
            	owner := &ddiastOwners[slot]
            	old := owner.Load()
            	return old&1 == 0 && old>>1 < generation && owner.CompareAndSwap(old, generation<<1|1)
            }
            
            //go:linkname ddiastEndOwner github.com/DataDog/dd-iast-go/internal/taint/heapranges.wovenEndOwner
            func ddiastEndOwner(slot uint32, generation uint64) bool {
            	if slot >= uint32(len(ddiastOwners)) || generation == 0 || generation > ddiastOriginGenerationMask ||
            		!ddiastOwners[slot].CompareAndSwap(generation<<1|1, generation<<1) {
            		return false
            	}
            	ddiastRetireSnapshot(slot, generation)
            	return true
            }
            
            //go:linkname ddiastOwnerLive github.com/DataDog/dd-iast-go/internal/taint/heapranges.wovenOwnerLive
            //go:nosplit
            func ddiastOwnerLive(slot uint32, generation uint64) bool {
            	return slot < uint32(len(ddiastOwners)) && generation != 0 && generation <= ddiastOriginGenerationMask &&
            		ddiastOwners[slot].Load() == generation<<1|1
            }
            
            //go:linkname ddiastAttachSnapshot github.com/DataDog/dd-iast-go/internal/taint/heapranges.wovenAttachSnapshot
            func ddiastAttachSnapshot(slot uint32, generation uint64) bool {
            	if ddiastHeapGate.Load() != 1 || !ddiastOwnerLive(slot, generation) {
            		return false
            	}
            	area := &ddiastSnapshotAreas[slot]
            	if !area.CompareAndSwap(0, ddiastSnapshotBusy) {
            		return false
            	}
            	entry := ddiastAllocateUnits(1024)
            	if entry == 0 || uint64(entry) > ddiastSnapshotEntryMask {
            		if entry != 0 {
            			ddiastSnapshotLost.Add(1024)
            		}
            		area.Store(0)
            		return false
            	}
            	ddiastSnapshotCursor[slot].Store(generation << 24)
            	area.Store(generation<<24 | uint64(entry))
            	// EndOwner can see the busy marker before the area is published.
            	if !ddiastOwnerLive(slot, generation) {
            		ddiastRetireSnapshot(slot, generation)
            		return false
            	}
            	return true
            }
            
            //go:nosplit
            func ddiastStoreSnapshot(slot uint32, generation uint64, data ddheapunsafe.Pointer, length uintptr) (uint32, bool) {
            	if slot >= uint32(len(ddiastSnapshotAreas)) || generation == 0 || generation > ddiastOriginGenerationMask ||
            		length == 0 || uint64(length) > ddiastSnapshotSize {
            		return 0, false
            	}
            	descriptor := ddiastSnapshotAreas[slot].Load()
            	if descriptor == ddiastSnapshotBusy || descriptor>>24 != generation {
            		return 0, false
            	}
            	entry := uint32(descriptor & ddiastSnapshotEntryMask)
            	if entry == 0 || (entry-1)&(ddiastSlabUnits-1) > ddiastSlabUnits-1024 {
            		return 0, false
            	}
            	address := ddiastSlabAddress(entry)
            	if address == 0 {
            		return 0, false
            	}
            	cursor := &ddiastSnapshotCursor[slot]
            	for attempt := 0; attempt < 4; attempt++ {
            		current := cursor.Load()
            		if current>>24 != generation {
            			return 0, false
            		}
            		used := current & ddiastSnapshotEntryMask
            		if used > ddiastSnapshotSize || uint64(length) > ddiastSnapshotSize-used {
            			return 0, false
            		}
            		if cursor.CompareAndSwap(current, current+uint64(length)) {
            			for i := uintptr(0); i < length; i++ {
            				*(*byte)(ddheapunsafe.Pointer(address + uintptr(used) + i)) = *(*byte)(ddheapunsafe.Pointer(uintptr(data) + i))
            			}
            			return uint32(used), true
            		}
            	}
            	return 0, false
            }
            
            //go:linkname ddiastTestStoreSnapshot github.com/DataDog/dd-iast-go/internal/taint/heapranges.testStoreSnapshot
            func ddiastTestStoreSnapshot(slot uint32, generation uint64, data ddheapunsafe.Pointer, length uintptr) (uint32, bool) {
            	mp, processor := ddiastEnter()
            	if mp == nil {
            		return 0, false
            	}
            	offset, ok := ddiastStoreSnapshot(slot, generation, data, length)
            	ddiastLeave(mp, processor)
            	KeepAlive(data)
            	return offset, ok
            }
            
            //go:linkname ddiastRetireSnapshot github.com/DataDog/dd-iast-go/internal/taint/heapranges.wovenRetireSnapshot
            func ddiastRetireSnapshot(slot uint32, generation uint64) bool {
            	if slot >= uint32(len(ddiastSnapshotAreas)) || generation == 0 || generation > ddiastOriginGenerationMask {
            		return false
            	}
            	mp, processor := ddiastEnter()
            	area := &ddiastSnapshotAreas[slot]
            	descriptor := area.Load()
            	ok := descriptor != ddiastSnapshotBusy && descriptor>>24 == generation && area.CompareAndSwap(descriptor, 0)
            	if ok {
            		entry := uint32(descriptor & ddiastSnapshotEntryMask)
            		if mp == nil {
            			ddiastRetire(ddiastSlabCount, entry, ddiastRetirementSnapshot)
            		} else {
            			ddiastRetire(processor, entry, ddiastRetirementSnapshot)
            		}
            	}
            	if mp != nil {
            		ddiastLeave(mp, processor)
            	}
            	return ok
            }
            
            //go:linkname ddiastTestRecord github.com/DataDog/dd-iast-go/internal/taint/heapranges.testRecord
            func ddiastTestRecord(offset, length, next uint32) uint32 {
            	entry := ddiastAllocateUnits(2)
            	if entry == 0 {
            		return 0
            	}
            	address := ddiastSlabAddress(entry)
            	if address == 0 {
            		return 0
            	}
            	record := (*ddiastRecord)(ddheapunsafe.Pointer(address))
            	record.next = next
            	record.count = 1
            	record.ranges[0].offset = offset
            	record.ranges[0].length = length
            	return entry
            }
            
            //go:linkname ddiastTestRecordDetails github.com/DataDog/dd-iast-go/internal/taint/heapranges.testRecordDetails
            func ddiastTestRecordDetails(entry uint32, origin uint64, marks, flags, kind uint8, snapshot uint32) bool {
            	address := ddiastSlabAddress(entry)
            	if address == 0 {
            		return false
            	}
            	record := (*ddiastRecord)(ddheapunsafe.Pointer(address))
            	record.kind = kind
            	record.ranges[0].origin = origin
            	record.ranges[0].marks = marks
            	record.ranges[0].flags = flags
            	record.ranges[0].snapshot = snapshot
            	return true
            }
            
            //go:linkname ddiastTestSpanPoison github.com/DataDog/dd-iast-go/internal/taint/heapranges.testSpanPoison
            func ddiastTestSpanPoison(p ddheapunsafe.Pointer, set bool) bool {
            	span, _, _ := ddiastClassify(p, 1)
            	if span == nil {
            		return false
            	}
            	if set {
            		return span.ddiastTaint.CompareAndSwap(0, ddiastSpanPoison)
            	}
            	return span.ddiastTaint.CompareAndSwap(ddiastSpanPoison, 0)
            }
            
            //go:linkname ddiastTestRecordRange github.com/DataDog/dd-iast-go/internal/taint/heapranges.testRecordRange
            func ddiastTestRecordRange(entry, index, offset, length uint32, origin uint64, marks, flags uint8, snapshot uint32) bool {
            	address := ddiastSlabAddress(entry)
            	if address == 0 || index >= 4 {
            		return false
            	}
            	record := (*ddiastRecord)(ddheapunsafe.Pointer(address))
            	record.ranges[index] = ddiastRange{offset: offset, length: length, origin: origin, marks: marks, flags: flags, snapshot: snapshot}
            	if record.count <= uint8(index) {
            		record.count = uint8(index) + 1
            	}
            	return true
            }
            
            //go:linkname ddiastTestRangeLimit github.com/DataDog/dd-iast-go/internal/taint/heapranges.testRangeLimit
            func ddiastTestRangeLimit(limit uint32) { ddiastRangeLimit.Store(limit) }
            
            //go:linkname ddiastTestRangeCollapses github.com/DataDog/dd-iast-go/internal/taint/heapranges.testRangeCollapses
            func ddiastTestRangeCollapses() uint64 { return ddiastRangesCollapsed.Load() }
            
            //go:linkname ddiastTestSnapshot github.com/DataDog/dd-iast-go/internal/taint/heapranges.testSnapshot
            func ddiastTestSnapshot(slot uint32, generation uint64, data ddheapunsafe.Pointer, length uintptr) bool {
            	if slot >= uint32(len(ddiastSnapshotAreas)) || generation == 0 || generation > ddiastOriginGenerationMask || uint64(length) > ddiastSnapshotSize {
            		return false
            	}
            	entry := ddiastAllocateUnits(1024)
            	address := ddiastSlabAddress(entry)
            	if entry == 0 || address == 0 {
            		return false
            	}
            	for i := uintptr(0); i < length; i++ {
            		*(*byte)(ddheapunsafe.Pointer(address + i)) = *(*byte)(ddheapunsafe.Pointer(uintptr(data) + i))
            	}
            	KeepAlive(data)
            	return ddiastSnapshotAreas[slot].CompareAndSwap(0, generation<<24|uint64(entry))
            }
            
            //go:linkname ddiastTestSetGate github.com/DataDog/dd-iast-go/internal/taint/heapranges.testSetGate
            func ddiastTestSetGate(value uint32) { ddiastHeapGate.Store(value) }
            
            //go:linkname ddiastTestSetProbe github.com/DataDog/dd-iast-go/internal/taint/heapranges.testSetProbe
            func ddiastTestSetProbe(p ddheapunsafe.Pointer, n uintptr) {
            	start := uintptr(p)
            	if start == 0 || n == 0 || n > ^uintptr(0)-start {
            		ddiastProbeStart.Store(0)
            		ddiastProbeEnd.Store(0)
            		return
            	}
            	ddiastProbeEnd.Store(start + n)
            	ddiastProbeStart.Store(start)
            }
            
            //go:linkname ddiastInspectClassify github.com/DataDog/dd-iast-go/internal/taint/heapranges.inspectClassify
            func ddiastInspectClassify(p ddheapunsafe.Pointer, n uintptr) (uintptr, uintptr, uint32, bool) {
            	span, offset, index := ddiastClassify(p, n)
            	if span == nil {
            		return 0, 0, 0, false
            	}
            	return offset, span.elemsize, index, true
            }
            
            //go:linkname ddiastStackClassify github.com/DataDog/dd-iast-go/internal/taint/heapranges.stackClassify
            func ddiastStackClassify() bool {
            	var value [64]byte
            	address := uintptr(ddheapunsafe.Pointer(&value[0]))
            	g := getg()
            	span, _, _ := ddiastClassify(ddheapunsafe.Pointer(&value[0]), 1)
            	return address >= g.stack.lo && address < g.stack.hi && span == nil
            }
            
            const (
            	ddiastSlabCount = 1024
            	ddiastSlabUnits = 1 << 14
            	ddiastSlabBusy  = ^uint32(0)
            )
            
            type ddiastSlab struct {
            	base uintptr
            	bump ddheapatomic.Uint32
            	next uint32
            }
            
            var (
            	ddiastSlabs        [ddiastSlabCount]ddiastSlab
            	ddiastSlabsUsed    ddheapatomic.Uint32
            	ddiastReadyHead    ddheapatomic.Uint32
            	ddiastReadyCount   ddheapatomic.Uint32
            	ddiastCurrentSlab  ddheapatomic.Uint32
            	ddiastSlabTailLost ddheapatomic.Uint64
            	ddiastRefill       ddheapatomic.Uint32
            	ddiastQueues       [ddiastSlabCount]ddheapatomic.Uint32
            	ddiastRetireState  [ddiastSlabCount]ddiastRetirementState
            	ddiastNoPLost      ddheapatomic.Uint64
            )
            
            type ddiastRetirementState struct {
            	producer ddheapatomic.Uint32
            	consumer ddheapatomic.Uint32
            	lost     ddheapatomic.Uint64
            	_        [48]byte
            }
            
            type ddiastRetirement struct {
            	entry uint32
            	kind  uint32
            	epoch uint64
            }
            
            var (
            	_ [16 - ddheapunsafe.Sizeof(ddiastRetirement{})]byte
            	_ [ddheapunsafe.Sizeof(ddiastRetirement{}) - 16]byte
            	_ [64 - ddheapunsafe.Sizeof(ddiastRetirementState{})]byte
            	_ [ddheapunsafe.Sizeof(ddiastRetirementState{}) - 64]byte
            )
            
            const (
            	ddiastRetirementCapacity = 1024
            	ddiastRetireRecord       = 1
            	ddiastRetirementSnapshot = 2
            )
            
            //go:nosplit
            func ddiastRecordEntry(entry uint32) bool {
            	return entry != 0 && entry != ddiastEntryPoison && entry != ddiastEntryPrivate
            }
            
            //go:nosplit
            func ddiastRetire(index, entry, kind uint32) bool {
            	if !ddiastRecordEntry(entry) {
            		return false
            	}
            	if index >= uint32(len(ddiastRetireState)) {
            		ddiastNoPLost.Store(ddiastNoPLost.Load() + 1)
            		return false
            	}
            	state := &ddiastRetireState[index]
            	queue := ddiastQueues[index].Load()
            	if queue == 0 || (queue-1)&(ddiastSlabUnits-1) > ddiastSlabUnits-256 {
            		state.lost.Store(state.lost.Load() + 1)
            		return false
            	}
            	address := ddiastSlabAddress(queue)
            	producer, consumer := state.producer.Load(), state.consumer.Load()
            	if address == 0 || producer-consumer >= ddiastRetirementCapacity {
            		state.lost.Store(state.lost.Load() + 1)
            		return false
            	}
            	slot := (*ddiastRetirement)(ddheapunsafe.Pointer(address + uintptr(producer%ddiastRetirementCapacity)*16))
            	slot.entry = entry
            	slot.kind = kind
            	slot.epoch = ddiastEpoch.Load()
            	state.producer.Store(producer + 1)
            	return true
            }
            
            //go:linkname ddiastTestRetire github.com/DataDog/dd-iast-go/internal/taint/heapranges.testRetire
            func ddiastTestRetire(index, entry, kind uint32) bool {
            	mp := acquirem()
            	ok := ddiastRetire(index, entry, kind)
            	releasem(mp)
            	return ok
            }
            
            //go:linkname ddiastTestRetirement github.com/DataDog/dd-iast-go/internal/taint/heapranges.testRetirement
            func ddiastTestRetirement(index, position uint32) (uint32, uint32, uint64, uint32, uint64) {
            	if index >= uint32(len(ddiastRetireState)) {
            		return 0, 0, 0, 0, ddiastNoPLost.Load()
            	}
            	state := &ddiastRetireState[index]
            	producer := state.producer.Load()
            	queue := ddiastQueues[index].Load()
            	address := ddiastSlabAddress(queue)
            	if address == 0 || position >= producer || producer-position > ddiastRetirementCapacity {
            		return 0, 0, 0, producer, state.lost.Load()
            	}
            	slot := (*ddiastRetirement)(ddheapunsafe.Pointer(address + uintptr(position%ddiastRetirementCapacity)*16))
            	return slot.entry, slot.kind, slot.epoch, producer, state.lost.Load()
            }
            
            //go:linkname ddiastPublishSlab github.com/DataDog/dd-iast-go/internal/taint/heapranges.publishSlab
            func ddiastPublishSlab(base uintptr) bool {
            	if base == 0 || base&63 != 0 {
            		return false
            	}
            	for {
            		count := ddiastReadyCount.Load()
            		if count >= 2 {
            			return false
            		}
            		if ddiastReadyCount.CompareAndSwap(count, count+1) {
            			break
            		}
            	}
            	var index uint32
            	for {
            		index = ddiastSlabsUsed.Load()
            		if index >= ddiastSlabCount {
            			ddiastReadyCount.Add(-1)
            			return false
            		}
            		if ddiastSlabsUsed.CompareAndSwap(index, index+1) {
            			break
            		}
            	}
            	slab := &ddiastSlabs[index]
            	slab.base = base
            	for {
            		head := ddiastReadyHead.Load()
            		slab.next = head
            		if ddiastReadyHead.CompareAndSwap(head, index+1) {
            			return true
            		}
            	}
            }
            
            //go:linkname ddiastReadySlabs github.com/DataDog/dd-iast-go/internal/taint/heapranges.readySlabs
            func ddiastReadySlabs() uint32 { return ddiastReadyCount.Load() }
            
            //go:linkname ddiastTakeRefill github.com/DataDog/dd-iast-go/internal/taint/heapranges.takeRefill
            func ddiastTakeRefill() bool { return ddiastRefill.Swap(0) != 0 }
            
            //go:linkname ddiastTailUnits github.com/DataDog/dd-iast-go/internal/taint/heapranges.tailUnits
            func ddiastTailUnits() uint64 { return ddiastSlabTailLost.Load() }
            
            //go:linkname ddiastAllocateUnits github.com/DataDog/dd-iast-go/internal/taint/heapranges.allocateUnits
            //go:nosplit
            func ddiastAllocateUnits(units uint32) uint32 {
            	if units == 0 || units > ddiastSlabUnits {
            		return 0
            	}
            	current := ddiastCurrentSlab.Load()
            	if current == ddiastSlabBusy || current > ddiastSlabCount {
            		return 0
            	}
            	if current != 0 {
            		slab := &ddiastSlabs[current-1]
            		if slab.bump.Load() <= ddiastSlabUnits-units {
            			start := slab.bump.Add(int32(units)) - units
            			if start <= ddiastSlabUnits-units {
            				return ((current-1)<<14 | start) + 1
            			}
            		}
            	}
            	if !ddiastCurrentSlab.CompareAndSwap(current, ddiastSlabBusy) {
            		return 0
            	}
            	head := ddiastReadyHead.Load()
            	if head == 0 || head > ddiastSlabCount || !ddiastReadyHead.CompareAndSwap(head, ddiastSlabs[head-1].next) {
            		ddiastCurrentSlab.Store(current)
            		ddiastRefill.Store(1)
            		return 0
            	}
            	ddiastReadyCount.Add(-1)
            	if current != 0 {
            		// A late writer must not use a tail that is counted as lost.
            		used := ddiastSlabs[current-1].bump.Swap(ddiastSlabUnits)
            		if used < ddiastSlabUnits {
            			ddiastSlabTailLost.Add(int64(ddiastSlabUnits - used))
            		}
            	}
            	ddiastCurrentSlab.Store(head)
            	ddiastRefill.Store(1)
            	start := ddiastSlabs[head-1].bump.Add(int32(units)) - units
            	if start > ddiastSlabUnits-units {
            		return 0
            	}
            	return ((head-1)<<14 | start) + 1
            }
            
            //go:linkname ddiastSlabAddress github.com/DataDog/dd-iast-go/internal/taint/heapranges.slabAddress
            //go:nosplit
            func ddiastSlabAddress(entry uint32) uintptr {
            	if entry == 0 {
            		return 0
            	}
            	index := entry - 1
            	slab := index >> 14
            	if slab >= ddiastSlabCount || slab >= ddiastSlabsUsed.Load() {
            		return 0
            	}
            	return ddiastSlabs[slab].base + uintptr(index&(ddiastSlabUnits-1))*64
            }
            
            //go:linkname ddiastSetQueue github.com/DataDog/dd-iast-go/internal/taint/heapranges.setQueue
            func ddiastSetQueue(index, entry uint32) bool {
            	if index >= ddiastSlabCount || entry == 0 {
            		return false
            	}
            	return ddiastQueues[index].CompareAndSwap(0, entry)
            }
            
            //go:linkname ddiastQueue github.com/DataDog/dd-iast-go/internal/taint/heapranges.queueEntry
            func ddiastQueue(index uint32) uint32 {
            	if index >= ddiastSlabCount {
            		return 0
            	}
            	return ddiastQueues[index].Load()
            }
