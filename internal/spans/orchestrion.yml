---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/internal/spans
  description: Span additions

aspects:
  - id: Span.Finish
    tracer-internal: true
    join-point:
      function-body:
        function:
          - receiver: '*github.com/DataDog/dd-trace-go/v2/ddtrace/tracer.Span'
          - name: Finish
    advice:
      - inject-declarations:
          links:
            - github.com/DataDog/dd-iast-go/internal/spans
          template: |-
            //go:linkname __dd__iast_spans_Finished github.com/DataDog/dd-iast-go/internal/spans.Finished
            func __dd__iast_spans_Finished(span *Span)
      - prepend-statements:
          template: |-
            if {{ .Function.Receiver }} != nil {
              defer __dd__iast_spans_Finished({{ .Function.Receiver }})
            }
