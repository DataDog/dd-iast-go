---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/iast/encoding/json
  description: Request-scoped encoding/json propagation

# Each aspect id starts with a variant tag (plan encoding-json-v2, section
# 6.4). The tag tells the variants of encoding/json where the join point of the
# aspect can match: [v1] for the v1 files (!goexperiment.jsonv2), [v2] for the
# v2 files (goexperiment.jsonv2), and [shared] for all variants.
# TestInstrumentedPropagationTelemetry uses the tags to count the propagation
# points of each variant (instrumentedPropagationPoints).
aspects:
  - id: "[shared] application JSON propagation bootstrap"
    join-point:
      all-of:
        - package-filter: {root: true, pattern: "**"}
        - test-main: false
        - function-body:
            function:
              - receiver: false
              - name: main
    advice:
      - prepend-statements:
          imports:
            iastjson: github.com/DataDog/dd-iast-go/iast/encoding/json
          template: |-
            _ = iastjson.Activate

  # The Decoder type has different fields in the v1 and in the v2 variant of
  # encoding/json (plan encoding-json-v2, section 4). This aspect matches on
  # all variants, thus it uses only the symbols that it declares itself and
  # the __dd_iast_binding field (all variants have it). A variant-specific
  # aspect sets the two variables in an init function. If no aspect sets them,
  # Decode does not propagate. The inlined Exclusive check comes before the
  # indirect call: a decoder that cannot propagate (for example a decoder made
  # with no active request) makes no call.
  - id: "[shared] encoding/json Decoder reader binding"
    join-point:
      all-of:
        - import-path: encoding/json
        - function-body:
            function:
              - receiver: "*encoding/json.Decoder"
              - name: Decode
    advice:
      - inject-declarations:
          template: |-
            // __dd_iast_decodeBind binds the decode state of a Decoder to the
            // reader owner that NewDecoder captured. It is nil when no
            // variant-specific aspect sets it.
            var __dd_iast_decodeBind func(*Decoder) bool

            // __dd_iast_decodeUnbind releases the binding of
            // __dd_iast_decodeBind.
            var __dd_iast_decodeUnbind func(*Decoder)
      - prepend-statements:
          template: |-
            if __dd_iast_bind := __dd_iast_decodeBind; __dd_iast_bind != nil && {{ .Function.Receiver }}.__dd_iast_binding.Exclusive() && __dd_iast_bind({{ .Function.Receiver }}) {
              if __dd_iast_unbind := __dd_iast_decodeUnbind; __dd_iast_unbind != nil {
                defer __dd_iast_unbind({{ .Function.Receiver }})
              }
            }

  # The reader owner of a Decoder (plan encoding-json-v2, sections 6.3 and
  # 6.7). NewDecoder exists on all variants. It captures the owner token of
  # its reader BEFORE the first byte of the reader flows. Each Decode then
  # revalidates this token before it attributes the bytes of a value. The
  # field is added on all variants, thus the advice uses only the field and
  # its methods. Capture does no lookup until a variant-specific aspect
  # installs a consumer of the token (jsonbridge.EnableV1, EnableV2).
  - id: "[shared] encoding/json Decoder reader binding field"
    join-point:
      struct-definition: encoding/json.Decoder
    advice:
      - add-struct-field:
          name: __dd_iast_binding
          type: github.com/DataDog/dd-iast-go/internal/taint/jsonbridge.ReaderBinding

  - id: "[shared] encoding/json NewDecoder reader owner capture"
    join-point:
      all-of:
        - import-path: encoding/json
        - function-body:
            function:
              - receiver: false
              - name: NewDecoder
    advice:
      - prepend-statements:
          template: |-
            __dd_iast_reader := {{ .Function.Argument 0 }}
            defer func() {
              if {{ .Function.Result 0 }} != nil {
                {{ .Function.Result 0 }}.__dd_iast_binding.Capture(__dd_iast_reader)
              }
            }()

  # The anchor type decodeState exists only in the v1 files of encoding/json.
  # This join point has no import-path clause, thus the telemetry test does not
  # count it as a propagation point. The v1 Document callback uses the reader
  # owner that NewDecoder captured, not the reader at Decode time (plan
  # encoding-json-v2, section 6.7).
  - id: "[v1] encoding/json Decoder reader binding dispatch"
    join-point:
      struct-definition: encoding/json.decodeState
    advice:
      - inject-declarations:
          imports:
            iastjsonbridge: github.com/DataDog/dd-iast-go/internal/taint/jsonbridge
          template: |-
            func init() {
              // The v1 Document path uses the owner token of NewDecoder.
              iastjsonbridge.EnableV1()
              __dd_iast_decodeBind = func(dec *Decoder) bool {
                return iastjsonbridge.BindDecoder(&dec.__dd_iast_binding, &dec.d)
              }
              __dd_iast_decodeUnbind = func(dec *Decoder) {
                iastjsonbridge.Unbind(&dec.d)
              }
            }

  # The default string arshaler of encoding/json/v2 (plan encoding-json-v2,
  # section 6.2). makeStringArshaler exists in the v2 package of Go 1.26 and
  # of Go 1.27. This aspect uses only the symbols that it declares itself and
  # the arshaler fields that the v2 shape test (plan step 6) pins. It wraps the
  # unmarshal function of the result once for each string type, before
  # makeMethodArshaler reads it. Thus a custom method replaces the wrapper,
  # and a method fallback calls the wrapped default. The wrapper is nil, and
  # nothing changes, until the Go 1.27 aspect below sets it.
  - id: "[v2] encoding/json/v2 string arshaler wrap"
    join-point:
      all-of:
        - import-path: encoding/json/v2
        - function-body:
            function:
              - receiver: false
              - name: makeStringArshaler
    advice:
      - inject-declarations:
          template: |-
            // __dd_iast_stringWrap wraps the default string unmarshaler. It is
            // nil when no variant-specific aspect sets it.
            var __dd_iast_stringWrap func(unmarshaler) unmarshaler
      - prepend-statements:
          template: |-
            defer func() {
              if __dd_iast_wrap := __dd_iast_stringWrap; __dd_iast_wrap != nil {
                if __dd_iast_result := {{ .Function.Result 0 }}; __dd_iast_result != nil && __dd_iast_result.unmarshal != nil {
                  __dd_iast_result.unmarshal = __dd_iast_wrap(__dd_iast_result.unmarshal)
                }
              }
            }()

  # The string cache guard of encoding/json/v2 (plan encoding-json-v2, section
  # 6.2, "String cache"). makeString is the only function that reads or
  # changes the string cache of a decoder. All its callers use it: the default
  # string arshaler and the any fast path (unmarshalValueAny). When b can have
  # taint, the runtime hooks can taint string(b). The cache of a pooled
  # decoder keeps a string for later decodes, in this request and in other
  # requests. Thus a string of bytes that can have taint does not go into the
  # cache, and does not come from it. makeString has the same signature in the
  # v2 package of Go 1.26 and of Go 1.27, and this aspect uses only its
  # arguments, thus it applies to each toolchain that has encoding/json/v2.
  # The gate-off cost is two loads and no call (jsonbridge.HasIndexedRoots).
  - id: "[v2] encoding/json/v2 string cache guard"
    join-point:
      all-of:
        - import-path: encoding/json/v2
        - function-body:
            function:
              - receiver: false
              - name: makeString
    advice:
      - prepend-statements:
          imports:
            iastjsonbridge: github.com/DataDog/dd-iast-go/internal/taint/jsonbridge
          template: |-
            {{- $b := .Function.Argument 1 -}}
            if iastjsonbridge.HasIndexedRoots() && iastjsonbridge.SkipCache({{ $b }}) {
              // The same result as makeString with no cache.
              return string({{ $b }})
            }

  # The anchor errInvalidStringTag exists only in the v2 package of Go 1.27
  # (plan encoding-json-v2, section 4). The ,string rule of the wrapper is the
  # rule of Go 1.27.1, thus Go 1.26 with GOEXPERIMENT=jsonv2 gets no wrapper.
  # The join point has no import-path clause, thus the telemetry test does not
  # count it as a propagation point. The init function runs before any
  # arshaler is made: no package-level initializer of encoding/json/v2 calls
  # lookupArshaler.
  - id: "[v2] encoding/json/v2 string unmarshal source"
    join-point:
      declaration-of: encoding/json/v2.errInvalidStringTag
    advice:
      - inject-declarations:
          imports:
            iastjsonbridge: github.com/DataDog/dd-iast-go/internal/taint/jsonbridge
            jsonflags: encoding/json/internal/jsonflags
            jsonopts: encoding/json/internal/jsonopts
            jsontext: encoding/json/jsontext
          template: |-
            func init() {
              __dd_iast_stringWrap = __dd_iast_wrapStringUnmarshal
              // The v2 Decode path ("[v2] encoding/json Decoder.Decode value
              // document") uses the owner token of NewDecoder. Before this
              // call, NewDecoder does no lookup on this variant.
              iastjsonbridge.EnableV2()
            }

            // __dd_iast_wrapStringUnmarshal returns an unmarshaler that calls
            // next, and then publishes the raw token of the decoded string to
            // the JSON bridge. The bridge sets a tainted clone of the string,
            // never the string of next: that string can come from the string
            // cache of the decoder, which other decodes share. (The string
            // cache guard keeps a string of bytes that can have taint out of
            // that cache.)
            func __dd_iast_wrapStringUnmarshal(next unmarshaler) unmarshaler {
              return func(dec *jsontext.Decoder, va addressableValue, uo *jsonopts.Struct) error {
                if !iastjsonbridge.Active() {
                  return next(dec, va, uo)
                }
                if err := next(dec, va, uo); err != nil {
                  // A failed conversion does not propagate.
                  return err
                }
                // next read exactly one value and no other token, thus this
                // is the raw token of the string, with its quotes.
                raw := export.Decoder(dec).PreviousTokenOrValue()
                if uo.Flags.Has(jsonflags.TagFlags) && uo.Flags.Get(jsonflags.StringTag) && uo.Flags.Get(jsonflags.StringifyWithLegacySemantics) && __dd_iast_innerNull(raw) {
                  // The same test as the stringify test of next. A ,string
                  // value with an inner null keeps or clears the
                  // destination. It gets no string of this token.
                  return nil
                }
                iastjsonbridge.String(raw, va.Value)
                return nil
              }
            }

            // __dd_iast_innerNull reports whether the raw token raw unquotes to
            // null. This is the test of the ,string option of the default
            // string unmarshaler, after its first unquote. It uses only the
            // raw token, never the destination.
            func __dd_iast_innerNull(raw []byte) bool {
              // The longest form of null is "\u006e\u0075\u006c\u006c" (26
              // bytes). A longer token cannot unquote to null.
              if len(raw) < 6 || len(raw) > 26 || raw[0] != '"' {
                return false
              }
              var buffer [32]byte
              inner, err := jsontext.AppendUnquote(buffer[:0], raw)
              return err == nil && string(inner) == "null"
            }

  # The value document of the v2 Decode (plan encoding-json-v2, section 6.3).
  # In the v2 files of encoding/json, (*Decoder).Decode reads one value with
  # dec.dec.ReadValue(). The value is an alias of the stream buffer of the
  # decoder. The wrapper replaces it with an immutable clone that the
  # exclusive owner of the reader adopted (jsonbridge.ReaderDocument). Then
  # jsonv2.Unmarshal decodes the clone, and the raw token of each string
  # aliases tainted memory. ReaderDocument revalidates, at each Decode, the
  # owner token that NewDecoder captured (section 6.5, rule (f)).
  #
  # The join point also matches the two other ReadValue calls of the package,
  # in checkValid and in (*Number).UnmarshalJSONFrom. No join point can limit a
  # call to its enclosing function, thus the template does it: only a call in
  # a function with the name Decode changes. The other calls stay as they are.
  # The template engine does not evaluate the branch that it does not take,
  # thus .Function.Receiver is never used in checkValid (not a method) or in
  # UnmarshalJSONFrom (*Number has no __dd_iast_binding field).
  # TestV2ReadValueHookScope checks the woven result. The v1 files do not
  # import jsontext, thus the join point does not match on v1. On Go 1.26 with
  # GOEXPERIMENT=jsonv2, no init calls EnableV2, and ReaderDocument returns
  # the original value.
  - id: "[v2] encoding/json Decoder.Decode value document"
    join-point:
      all-of:
        - import-path: encoding/json
        - method-call:
            receiver: encoding/json/jsontext.Decoder
            name: ReadValue
            match: pointer-only
    advice:
      - wrap-expression:
          imports:
            iastjsonbridge: github.com/DataDog/dd-iast-go/internal/taint/jsonbridge
            jsontext: encoding/json/jsontext
          template: |-
            {{- if eq .Function.Name "Decode" -}}
            func() (jsontext.Value, error) {
              __dd_iast_value, __dd_iast_err := {{ . }}
              if __dd_iast_err == nil {
                __dd_iast_value = iastjsonbridge.ReaderDocument(&{{ .Function.Receiver }}.__dd_iast_binding, __dd_iast_value)
              }
              return __dd_iast_value, __dd_iast_err
            }()
            {{- else -}}
            {{ . }}
            {{- end -}}

  # The v1 aspects below call the bridge only after an inlined gate (two loads
  # at most, no call). When IAST is inactive, the v1 decode path makes no call
  # to the bridge (plan encoding-json-v2, step 8 appendix, Table 6):
  # - Bind and Document do nothing when no request is active (RequestActive).
  # - Quoted does nothing when no decoder slot is in use (HasDecoderStates).
  # - Literal does nothing when no decoder slot is in use and Active is
  #   false. Bind takes the slot in unmarshal, before the defer of
  #   literalStore, thus the gate sees the slot of this decode.
  - id: "[v1] encoding/json decode state lifetime"
    join-point:
      all-of:
        - import-path: encoding/json
        - function-body:
            function:
              - receiver: "*encoding/json.decodeState"
              - name: unmarshal
    advice:
      - prepend-statements:
          imports:
            iastjsonbridge: github.com/DataDog/dd-iast-go/internal/taint/jsonbridge
          template: |-
            if iastjsonbridge.RequestActive() && iastjsonbridge.Bind({{ .Function.Receiver }}) {
              defer iastjsonbridge.Unbind({{ .Function.Receiver }})
            }

  - id: "[v1] encoding/json quoted string source"
    join-point:
      all-of:
        - import-path: encoding/json
        - function-body:
            function:
              - receiver: "*encoding/json.decodeState"
              - name: valueQuoted
    advice:
      - prepend-statements:
          imports:
            iastjsonbridge: github.com/DataDog/dd-iast-go/internal/taint/jsonbridge
          template: |-
            if iastjsonbridge.HasDecoderStates() {
              __dd_iast_quoted_start := {{ .Function.Receiver }}.readIndex()
              defer func() {
                iastjsonbridge.Quoted(
                  {{ .Function.Receiver }},
                  {{ .Function.Receiver }}.data,
                  __dd_iast_quoted_start,
                  {{ .Function.Receiver }}.readIndex(),
                  {{ .Function.Result 0 }},
                )
              }()
            }

  - id: "[v1] encoding/json document publication"
    join-point:
      all-of:
        - import-path: encoding/json
        - function-body:
            function:
              - receiver: "*encoding/json.decodeState"
              - name: init
    advice:
      - prepend-statements:
          imports:
            iastjsonbridge: github.com/DataDog/dd-iast-go/internal/taint/jsonbridge
          template: |-
            if iastjsonbridge.RequestActive() {
              iastjsonbridge.Document({{ .Function.Receiver }}, {{ .Function.Argument 0 }})
            }

  - id: "[v1] encoding/json typed string materialization"
    join-point:
      all-of:
        - import-path: encoding/json
        - function-body:
            function:
              - receiver: "*encoding/json.decodeState"
              - name: literalStore
    advice:
      - prepend-statements:
          imports:
            iastjsonbridge: github.com/DataDog/dd-iast-go/internal/taint/jsonbridge
          template: |-
            if iastjsonbridge.HasDecoderStates() || iastjsonbridge.Active() {
              defer func() {
                iastjsonbridge.Literal(
                  {{ .Function.Receiver }},
                  {{ .Function.Receiver }}.data,
                  {{ .Function.Argument 0 }},
                  {{ .Function.Argument 1 }},
                  {{ .Function.Result 0 }},
                  {{ .Function.Argument 2 }},
                )
              }()
            }
