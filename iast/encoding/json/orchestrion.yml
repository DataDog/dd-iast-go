---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/iast/encoding/json
  description: Request-scoped encoding/json propagation

aspects:
  - id: application JSON propagation bootstrap
    join-point:
      all-of:
        - package-filter: {root: true, pattern: "**"}
        - not: {package-filter: {root: true, pattern: "**.test"}}
        - function-body:
            function:
              - receiver: false
              - name: main
    advice:
      - prepend-statements:
          imports:
            iastjson: github.com/DataDog/dd-iast-go/iast/encoding/json
          template: |-
            _ = iastjson.Activate

  - id: encoding/json Decoder reader binding
    join-point:
      all-of:
        - import-path: encoding/json
        - function-body:
            function:
              - receiver: "*encoding/json.Decoder"
              - name: Decode
    advice:
      - prepend-statements:
          imports:
            iastjsonbridge: github.com/DataDog/dd-iast-go/internal/taint/jsonbridge
          template: |-
            if iastjsonbridge.Bind({{ .Function.Receiver }}.r, &{{ .Function.Receiver }}.d) {
              defer iastjsonbridge.Unbind(&{{ .Function.Receiver }}.d)
            }

  - id: encoding/json document publication
    join-point:
      all-of:
        - import-path: encoding/json
        - function-body:
            function:
              - receiver: "*encoding/json.decodeState"
              - name: init
    advice:
      - prepend-statements:
          imports:
            iastjsonbridge: github.com/DataDog/dd-iast-go/internal/taint/jsonbridge
          template: |-
            iastjsonbridge.Document({{ .Function.Receiver }}, {{ .Function.Argument 0 }})

  - id: encoding/json typed string materialization
    join-point:
      all-of:
        - import-path: encoding/json
        - function-body:
            function:
              - receiver: "*encoding/json.decodeState"
              - name: literalStore
    advice:
      - prepend-statements:
          imports:
            iastjsonbridge: github.com/DataDog/dd-iast-go/internal/taint/jsonbridge
          template: |-
            defer func() {
              iastjsonbridge.Literal(
                {{ .Function.Receiver }},
                {{ .Function.Receiver }}.data,
                {{ .Function.Argument 0 }},
                {{ .Function.Argument 1 }},
                {{ .Function.Result 0 }},
              )
            }()
