---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/iast/os/exec
  description: Request-scoped command injection sink

aspects:
  - id: os/exec IAST bridge declaration
    join-point:
      all-of:
        - import-path: os/exec
        - function-body:
            function:
              - name: Start
    advice:
      - inject-declarations:
          links:
            - github.com/DataDog/dd-iast-go/iast/os/exec
            - github.com/DataDog/dd-iast-go/internal/taint/commandbridge
          imports:
            context: context
            os: os
          template: |-
            //go:linkname __dd__iast_StartProcess__ github.com/DataDog/dd-iast-go/internal/taint/commandbridge.StartProcess
            func __dd__iast_StartProcess__(context.Context, string, []string, *os.ProcAttr) (*os.Process, error)

  # Cmd.Start performs validation and setup before this sole process attempt.
  # The replacement helper evaluates every original argument once, invokes
  # os.StartProcess once, reports only after it returns, and preserves results.
  - id: os/exec.Cmd.Start process attempt
    join-point:
      all-of:
        - import-path: os/exec
        - function-call: os.StartProcess
    advice:
      - wrap-expression:
          template: |-
            __dd__iast_StartProcess__(
              {{ .Function.Receiver }}.ctx,
              {{ index .AST.Args 0 }},
              {{ index .AST.Args 1 }},
              {{ index .AST.Args 2 }},
            )
