---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/iast/os/exec
  description: Request-scoped command injection sink

aspects:
  # Link callback registration from the application executable, not from the
  # standard-library archive, to avoid synthetic test-variant dependency cycles.
  # Generated .test mains are excluded for the same reason.
  - id: application command sink bootstrap
    join-point:
      all-of:
        - package-filter: {root: true, pattern: "**"}
        - not: {package-filter: {root: true, pattern: "**.test"}}
        - function-body:
            function:
              - receiver: false
              - name: main
    advice:
      - prepend-statements:
          imports:
            iastexec: github.com/DataDog/dd-iast-go/iast/os/exec
          template: |-
            _ = iastexec.Report

  - id: os/exec IAST bridge declaration
    join-point:
      all-of:
        - import-path: os/exec
        - function-body:
            function:
              - name: Start
    advice:
      - inject-declarations:
          links:
            - github.com/DataDog/dd-iast-go/internal/taint/commandbridge
          imports:
            context: context
          template: |-
            //go:linkname __dd__iast_ReportCommand__ github.com/DataDog/dd-iast-go/internal/taint/commandbridge.Report
            func __dd__iast_ReportCommand__(context.Context, []string)

  # Cmd.Start performs validation and setup before this sole process attempt.
  # The source IIFE evaluates every original argument once, invokes the host
  # os.StartProcess directly, reports only after it returns, and preserves results.
  - id: os/exec.Cmd.Start process attempt
    join-point:
      all-of:
        - import-path: os/exec
        - function-call: os.StartProcess
    advice:
      - wrap-expression:
          imports:
            context: context
            os: os
          template: |-
            func(
              __dd_iast_ctx context.Context,
              __dd_iast_path string,
              __dd_iast_argv []string,
              __dd_iast_attr *os.ProcAttr,
            ) (*os.Process, error) {
              __dd_iast_process, __dd_iast_err := os.StartProcess(
                __dd_iast_path, __dd_iast_argv, __dd_iast_attr,
              )
              __dd__iast_ReportCommand__(__dd_iast_ctx, __dd_iast_argv)
              return __dd_iast_process, __dd_iast_err
            }(
              {{ .Function.Receiver }}.ctx,
              {{ index .AST.Args 0 }},
              {{ index .AST.Args 1 }},
              {{ index .AST.Args 2 }},
            )
