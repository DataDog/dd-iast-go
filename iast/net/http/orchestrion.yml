            runtime: runtime
            unsafe: unsafe
          template: |-
            {{- $body := .Function.Receiver -}}
            {{- $p := .Function.Argument 0 -}}
            {{- $n := .Function.Result 0 -}}
            if iastheapbits.Live() {
              defer func() {
                if {{ $n }} > 0 && {{ $n }} <= len({{ $p }}) {
