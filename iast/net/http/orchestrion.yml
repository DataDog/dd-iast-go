            iastpropbridge: github.com/DataDog/dd-iast-go/internal/taint/propbridge
            runtime: runtime
            unsafe: unsafe
          template: |-
            {{- $body := .Function.Receiver -}}
            {{- $p := .Function.Argument 0 -}}
            {{- $n := .Function.Result 0 -}}
            if iastheapbits.Live() {
              defer func() {
                if {{ $n }} > 0 && {{ $n }} <= len({{ $p }}) {
                  iastpropbridge.BodyRead(
                    uintptr(unsafe.Pointer({{ $body }})),
                    uintptr(unsafe.Pointer(unsafe.SliceData({{ $p }}))),
