              - name: Read
    advice:
      # Only the objects of a registered body type are registered as the
      # body of a request (httpbridge.BodyObject). The server allocates them
      # on the heap, so they are safe for weak.Make.
      - inject-declarations:
          imports:
            iasthttpbridge: github.com/DataDog/dd-iast-go/internal/taint/httpbridge
          template: |-
            var _ = iasthttpbridge.RegisterBodyType((*http2requestBody)(nil))
      # After the read, taint the bytes that the read wrote when the receiver
      # is the registered body of a request (plan section 4.4). The deferred
      # call runs only when taint can be live (heapbits.Live), and it does
      # not change the results.
      - prepend-statements:
          imports:
            iastheapbits: github.com/DataDog/dd-iast-go/internal/taint/heapbits
            iastpropbridge: github.com/DataDog/dd-iast-go/internal/taint/propbridge
            runtime: runtime
            unsafe: unsafe
          template: |-
            {{- $body := .Function.Receiver -}}
            {{- $p := .Function.Argument 0 -}}
            {{- $n := .Function.Result 0 -}}
            if iastheapbits.Live() {
              defer func() {
                if {{ $n }} > 0 && {{ $n }} <= len({{ $p }}) {
                  iastpropbridge.BodyRead(
                    uintptr(unsafe.Pointer({{ $body }})),
                    uintptr(unsafe.Pointer(unsafe.SliceData({{ $p }}))),
                    uintptr({{ $n }}),
                  )
                  runtime.KeepAlive({{ $body }})
                  runtime.KeepAlive({{ $p }})
                }
              }()
            }

  # Go 1.27 moved the HTTP/2 server of net/http to net/http/internal/http2:
  # (*requestBody).Read there is the HTTP/2 server body (TLS HTTP/2). This
  # aspect does not match with Go 1.26.
  - id: net/http/internal/http2.requestBody.Read
    join-point:
      all-of:
        - import-path: net/http/internal/http2
        - function-body:
            function:
              - receiver: "*net/http/internal/http2.requestBody"
              - name: Read
    advice:
      # Only the objects of a registered body type are registered as the
      # body of a request (httpbridge.BodyObject). The server allocates them
      # on the heap, so they are safe for weak.Make.
      - inject-declarations:
          imports:
            iasthttpbridge: github.com/DataDog/dd-iast-go/internal/taint/httpbridge
          template: |-
            var _ = iasthttpbridge.RegisterBodyType((*requestBody)(nil))
      # After the read, taint the bytes that the read wrote when the receiver
      # is the registered body of a request (plan section 4.4). The deferred
      # call runs only when taint can be live (heapbits.Live), and it does
