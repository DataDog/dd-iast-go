---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/iast/net/http
  description: Request-scoped IAST ownership and span binding

aspects:
  # Go 1.26.6 routes HTTP/1, TLS HTTP/2, and h2c through this value-receiver
  # method once per request. The request bridge has no net/http dependency, so
  # importing it into net/http does not create a package cycle.
  - id: net/http.serverHandler.ServeHTTP
    join-point:
      all-of:
        - import-path: net/http
        - function-body:
            function:
              - receiver: net/http.serverHandler
              - name: ServeHTTP
    advice:
      - prepend-statements:
          imports:
            iasthttpbridge: github.com/DataDog/dd-iast-go/internal/taint/httpbridge
          template: |-
            {{- $req := .Function.Argument 1 -}}
            __dd_iast_ctx, __dd_iast_created := iasthttpbridge.Begin(
              {{ $req }}.Context(), {{ $req }}.Method, {{ $req }}.RequestURI,
              map[string][]string({{ $req }}.Header),
            )
            defer iasthttpbridge.Finish(__dd_iast_ctx, __dd_iast_created)
            if __dd_iast_created {
              {{ $req }} = {{ $req }}.WithContext(__dd_iast_ctx)
              var __dd_iast_path, __dd_iast_raw_query *string
              if {{ $req }}.URL != nil {
                __dd_iast_path = &{{ $req }}.URL.Path
                __dd_iast_raw_query = &{{ $req }}.URL.RawQuery
              }
              {{ $req }}.Header = iasthttpbridge.Eager(
                __dd_iast_ctx, &{{ $req }}.RequestURI, __dd_iast_path, __dd_iast_raw_query,
                map[string][]string({{ $req }}.Header), {{ $req }}.URL, {{ $req }}.Body,
              )
            }

  # Bind as soon as tracing creates a span from a request context. Wrapping the
  # complete multi-result expression preserves every argument, including a
  # variadic option slice, and evaluates the original call exactly once.
  - id: tracer.StartSpanFromContext
    tracer-internal: true
    join-point:
      all-of:
        - function-call: github.com/DataDog/dd-trace-go/v2/ddtrace/tracer.StartSpanFromContext
        - not:
            package-filter:
              root: false
              pattern: "github.com/DataDog/dd-iast-go/internal/**"
        - not:
            one-of:
              - import-path: github.com/DataDog/dd-iast-go/iast/net/http
              - import-path: github.com/DataDog/dd-trace-go/v2/ddtrace/tracer
    advice:
      - wrap-expression:
          imports:
            iasthttp: github.com/DataDog/dd-iast-go/iast/net/http
          template: iasthttp.BindStartSpan({{ . }})

  # Direct/custom dispatch can bypass serverHandler. Restrict fallback matching
  # to the exact http.HandlerFunc shape to avoid treating unrelated helpers as
  # request boundaries. The first handler creates the scope; nested handlers
  # reuse it.
  - id: application.http.Handler
    join-point:
      all-of:
        - package-filter:
            root: true
            pattern: "**"
        - not:
            package-filter:
              root: false
              pattern: "github.com/DataDog/dd-iast-go/internal/**"
        - function-body:
            function:
              - signature:
                  args:
                    - net/http.ResponseWriter
                    - "*net/http.Request"
                  returns: []
    advice:
      - prepend-statements:
          imports:
            iastrequest: github.com/DataDog/dd-iast-go/internal/taint/request
            iastspans: github.com/DataDog/dd-iast-go/internal/spans
          template: |-
            {{- $req := .Function.ArgumentOfType "*net/http.Request" -}}
            if {{ $req }} != nil {
              __dd_iast_ctx, __dd_iast_created := iastrequest.BeginContext({{ $req }}.Context())
              defer iastrequest.FinishContext(__dd_iast_ctx, __dd_iast_created)
              if __dd_iast_created {
                {{ $req }} = {{ $req }}.WithContext(__dd_iast_ctx)
                var __dd_iast_path, __dd_iast_raw_query *string
                if {{ $req }}.URL != nil {
                  __dd_iast_path = &{{ $req }}.URL.Path
                  __dd_iast_raw_query = &{{ $req }}.URL.RawQuery
                }
                {{ $req }}.Header = iastrequest.EagerHTTP(
                  __dd_iast_ctx, &{{ $req }}.RequestURI, __dd_iast_path, __dd_iast_raw_query,
                  map[string][]string({{ $req }}.Header), {{ $req }}.URL, {{ $req }}.Body,
                )
              }
              iastspans.BindScopeContext(__dd_iast_ctx)
            }

  - id: net/http.MaxBytesReader
    join-point:
      all-of:
        - import-path: net/http
        - function-body:
            function:
              - receiver: false
              - name: MaxBytesReader
    advice:
      - prepend-statements:
          imports:
            iastiobridge: github.com/DataDog/dd-iast-go/internal/taint/iobridge
          template: |-
            {{- $input := .Function.Argument 1 -}}
            {{- $result := .Function.Result 0 -}}
            defer func() { iastiobridge.Propagate({{ $input }}, {{ $result }}) }()

  - id: net/http.Request.ParseForm
    join-point:
      all-of:
        - import-path: net/http
        - function-body:
            function:
              - receiver: "*net/http.Request"
              - name: ParseForm
    advice:
      - prepend-statements:
          imports:
            iasthttpbridge: github.com/DataDog/dd-iast-go/internal/taint/httpbridge
          template: |-
            {{- $req := .Function.Receiver -}}
            defer func() {
              if {{ $req }} != nil {
                {{ $req }}.Form, {{ $req }}.PostForm = iasthttpbridge.Form(
                  {{ $req }}.Context(),
                  map[string][]string({{ $req }}.Form),
                  map[string][]string({{ $req }}.PostForm),
                )
              }
            }()

  - id: net/http.Request.ParseMultipartForm
    join-point:
      all-of:
        - import-path: net/http
        - function-body:
            function:
              - receiver: "*net/http.Request"
              - name: ParseMultipartForm
    advice:
      - prepend-statements:
          imports:
            iasthttpbridge: github.com/DataDog/dd-iast-go/internal/taint/httpbridge
          template: |-
            {{- $req := .Function.Receiver -}}
            defer func() {
              if {{ $req }} != nil && {{ $req }}.MultipartForm != nil {
                {{ $req }}.MultipartForm.Value = iasthttpbridge.Multipart(
                  {{ $req }}.Context(),
                  map[string][]string({{ $req }}.MultipartForm.Value),
                  map[string][]string({{ $req }}.Form),
                  map[string][]string({{ $req }}.PostForm),
                )
              }
            }()

  - id: net/http.Request.FormValue
    join-point:
      all-of:
        - import-path: net/http
        - function-body:
            function:
              - receiver: "*net/http.Request"
              - name: FormValue
    advice:
      - prepend-statements:
          imports:
            iasthttpbridge: github.com/DataDog/dd-iast-go/internal/taint/httpbridge
          template: |-
            {{- $req := .Function.Receiver -}}
            {{- $name := .Function.Argument 0 -}}
            {{- $result := .Function.Result 0 -}}
            defer func() {
              if {{ $req }} != nil {
                if {{ $req }}.MultipartForm != nil {
                  if _, __dd_iast_multipart := {{ $req }}.MultipartForm.Value[{{ $name }}]; __dd_iast_multipart {
                    {{ $result }} = iasthttpbridge.MultipartParameter(
                      {{ $req }}.Context(), {{ $name }}, {{ $result }},
                    )
                    return
                  }
                }
                {{ $result }} = iasthttpbridge.Parameter(
                  {{ $req }}.Context(), {{ $name }}, {{ $result }},
                )
              }
            }()

  - id: net/http.Request.PostFormValue
    join-point:
      all-of:
        - import-path: net/http
        - function-body:
            function:
              - receiver: "*net/http.Request"
              - name: PostFormValue
    advice:
      - prepend-statements:
          imports:
            iasthttpbridge: github.com/DataDog/dd-iast-go/internal/taint/httpbridge
          template: |-
            {{- $req := .Function.Receiver -}}
            {{- $name := .Function.Argument 0 -}}
            {{- $result := .Function.Result 0 -}}
            defer func() {
              if {{ $req }} != nil {
                if {{ $req }}.MultipartForm != nil {
                  if _, __dd_iast_multipart := {{ $req }}.MultipartForm.Value[{{ $name }}]; __dd_iast_multipart {
                    {{ $result }} = iasthttpbridge.MultipartParameter(
                      {{ $req }}.Context(), {{ $name }}, {{ $result }},
                    )
                    return
                  }
                }
                {{ $result }} = iasthttpbridge.Parameter(
                  {{ $req }}.Context(), {{ $name }}, {{ $result }},
                )
              }
            }()

  - id: net/http.Request.PathValue
    join-point:
      all-of:
        - import-path: net/http
        - function-body:
            function:
              - receiver: "*net/http.Request"
              - name: PathValue
    advice:
      - prepend-statements:
          imports:
            iasthttpbridge: github.com/DataDog/dd-iast-go/internal/taint/httpbridge
          template: |-
            {{- $req := .Function.Receiver -}}
            {{- $name := .Function.Argument 0 -}}
            {{- $result := .Function.Result 0 -}}
            defer func() {
              if {{ $req }} != nil {
                {{ $result }} = iasthttpbridge.PathParameter(
                  {{ $req }}.Context(), {{ $name }}, {{ $result }},
                )
              }
            }()

  - id: net/http.Request.Cookie
    join-point:
      all-of:
        - import-path: net/http
        - function-body:
            function:
              - receiver: "*net/http.Request"
              - name: Cookie
    advice:
      - prepend-statements:
          imports:
            iasthttpbridge: github.com/DataDog/dd-iast-go/internal/taint/httpbridge
          template: |-
            {{- $req := .Function.Receiver -}}
            {{- $result := .Function.Result 0 -}}
            defer func() {
              if {{ $req }} != nil && {{ $result }} != nil {
                iasthttpbridge.Cookie(
                  {{ $req }}.Context(), &{{ $result }}.Name, &{{ $result }}.Value,
                )
              }
            }()

  - id: net/http.Request.Cookies
    join-point:
      all-of:
        - import-path: net/http
        - function-body:
            function:
              - receiver: "*net/http.Request"
              - name: Cookies
    advice:
      - prepend-statements:
          imports:
            iasthttpbridge: github.com/DataDog/dd-iast-go/internal/taint/httpbridge
          template: |-
            {{- $req := .Function.Receiver -}}
            {{- $result := .Function.Result 0 -}}
            defer func() {
              if {{ $req }} != nil {
                for _, __dd_iast_cookie := range {{ $result }} {
                  if __dd_iast_cookie != nil {
                    iasthttpbridge.Cookie(
                      {{ $req }}.Context(), &__dd_iast_cookie.Name, &__dd_iast_cookie.Value,
                    )
                  }
                }
              }
            }()

  - id: net/http.Request.CookiesNamed
    join-point:
      all-of:
        - import-path: net/http
        - function-body:
            function:
              - receiver: "*net/http.Request"
              - name: CookiesNamed
    advice:
      - prepend-statements:
          imports:
            iasthttpbridge: github.com/DataDog/dd-iast-go/internal/taint/httpbridge
          template: |-
            {{- $req := .Function.Receiver -}}
            {{- $result := .Function.Result 0 -}}
            defer func() {
              if {{ $req }} != nil {
                for _, __dd_iast_cookie := range {{ $result }} {
                  if __dd_iast_cookie != nil {
                    iasthttpbridge.Cookie(
                      {{ $req }}.Context(), &__dd_iast_cookie.Name, &__dd_iast_cookie.Value,
                    )
                  }
                }
              }
            }()
