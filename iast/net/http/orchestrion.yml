  # (*requestBody).Read of golang.org/x/net/http2 is the server body of the
  # h2c handler (golang.org/x/net/http2/h2c).
  - id: golang.org/x/net/http2.requestBody.Read
    join-point:
      all-of:
        - import-path: golang.org/x/net/http2
        - function-body:
