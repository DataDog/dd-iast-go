---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/iast/net/url
  description: Lazy net/url request sources

aspects:
  - id: net/url.URL.Query
    join-point:
      all-of:
        - import-path: net/url
        - function-body:
            function:
              - receiver: "*net/url.URL"
              - name: Query
    advice:
      - prepend-statements:
          imports:
            iasturlbridge: github.com/DataDog/dd-iast-go/internal/taint/urlbridge
          template: |-
            {{- $result := .Function.Result 0 -}}
            defer func() {
              {{ $result }} = iasturlbridge.Query(
                {{ .Function.Receiver }}, map[string][]string({{ $result }}),
              )
            }()
