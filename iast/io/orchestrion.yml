---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/iast/io
  description: Reader provenance and owned body results

aspects:
  # User code can change the field R of the result. Thus the binding of the
  # result is exclusive only with a Read guard (see the internal/taint/store
  # package doc). The guard is the io.LimitedReader.Read aspect below.
  - id: io.LimitReader
    join-point:
      all-of:
        - import-path: io
        - function-body:
            function:
              - receiver: false
              - name: LimitReader
    advice:
      - prepend-statements:
          imports:
            iastiobridge: github.com/DataDog/dd-iast-go/internal/taint/iobridge
          template: |-
            {{- $input := .Function.Argument 0 -}}
            {{- $result := .Function.Result 0 -}}
            defer func() { iastiobridge.PropagateGuarded({{ $input }}, {{ $result }}) }()

  # The Read guard of io.LimitReader results. It checks the field R before a
  # byte flows. When no guard exists, the cost is one atomic load.
  - id: io.LimitedReader.Read guard
    join-point:
      all-of:
        - import-path: io
        - function-body:
            function:
              - receiver: "*io.LimitedReader"
              - name: Read
    advice:
      - prepend-statements:
          imports:
            iastiobridge: github.com/DataDog/dd-iast-go/internal/taint/iobridge
          template: |-
            iastiobridge.CheckRead({{ .Function.Receiver }}, {{ .Function.Receiver }}.R)

  - id: io.TeeReader
    join-point:
      all-of:
        - import-path: io
        - function-body:
            function:
              - receiver: false
              - name: TeeReader
    advice:
      - prepend-statements:
          imports:
            iastiobridge: github.com/DataDog/dd-iast-go/internal/taint/iobridge
          template: |-
            {{- $input := .Function.Argument 0 -}}
            {{- $result := .Function.Result 0 -}}
            defer func() { iastiobridge.Propagate({{ $input }}, {{ $result }}) }()

  - id: io.MultiReader
    join-point:
      all-of:
        - import-path: io
        - function-body:
            function:
              - receiver: false
              - name: MultiReader
    advice:
      - prepend-statements:
          imports:
            iastiobridge: github.com/DataDog/dd-iast-go/internal/taint/iobridge
          # One call checks all the inputs and makes the binding (reader
          # binding rule (e) in the internal/taint/store package doc). The
          # binding is exclusive only when there are at most 8 inputs and all
          # of them have the same effectively exclusive owner. With more than 8
          # inputs, the result gets a binding that is not exclusive to the
          # owners of the first 8.
          template: |-
            {{- $inputs := .Function.Argument 0 -}}
            {{- $result := .Function.Result 0 -}}
            defer func() {
              var __dd_iast_inputs [iastiobridge.MaxJoinInputs]any
              for __dd_iast_index, __dd_iast_reader := range {{ $inputs }} {
                if __dd_iast_index >= len(__dd_iast_inputs) {
                  break
                }
                __dd_iast_inputs[__dd_iast_index] = __dd_iast_reader
              }
              iastiobridge.PropagateJoin(__dd_iast_inputs, len({{ $inputs }}), {{ $result }})
            }()

  # The owner token is taken BEFORE the first read and checked again AFTER the
  # reads (reader binding rule (f) in the internal/taint/store package doc).
  # Thus a binding made during the reads, or a bind of another owner that
  # started and ended during the reads, gives a miss.
  - id: io.ReadAll
    join-point:
      all-of:
        - import-path: io
        - function-body:
            function:
              - receiver: false
              - name: ReadAll
    advice:
      - prepend-statements:
          imports:
            iastiobridge: github.com/DataDog/dd-iast-go/internal/taint/iobridge
          template: |-
            {{- $input := .Function.Argument 0 -}}
            {{- $result := .Function.Result 0 -}}
            __dd_iast_token := iastiobridge.ReadAllBegin({{ $input }})
            defer func() { iastiobridge.ReadAllEnd(__dd_iast_token, {{ $input }}, {{ $result }}) }()
