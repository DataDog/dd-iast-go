---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/iast/crypto/hash
  description: Weak hash detection

aspects:
  - id: golang.org/x/crypto/md4.New
    join-point:
      all-of:
        - import-path: golang.org/x/crypto/md4
        - function-body:
            function:
              - name: New
    advice:
      - inject-declarations:
          links:
            - github.com/DataDog/dd-iast-go/iast/crypto/hash
          imports:
            context: context
            crypto: crypto
            telemetry: github.com/DataDog/dd-iast-go/internal/instrumentation/telemetry
            model: github.com/DataDog/dd-iast-go/internal/model/constants
          template: |-
            //go:linkname __dd__iast_ReportWeakHash__ github.com/DataDog/dd-iast-go/iast/crypto/hash.ReportWeakHash
            func __dd__iast_ReportWeakHash__(context.Context, crypto.Hash)

            func init() {
              telemetry.InstrumentedSink[model.VulnerabilityTypeWeakHash].Add(1)
            }
      - prepend-statements:
          imports:
            crypto: crypto
            iast: github.com/DataDog/dd-iast-go/iast/crypto/hash
          template: __dd__iast_ReportWeakHash__(nil, crypto.MD4)

  # crypto/md5 has two sinks: New and the free-standing Sum function. The
  # (*digest).Sum method is not a sink. `inject-declarations` appends its
  # declarations one time per matched node, so the go:linkname alias and the
  # sink count are injected from the crypto/md5.New aspect only (New occurs
  # one time). The crypto/md5.Sum aspect only prepends the report call, and
  # uses `receiver: false` so that it does not match the method. The
  # declarations are package-scoped, so Sum can use them.
  - id: crypto/md5.New
    join-point:
      all-of:
        - import-path: crypto/md5
        - function-body:
            function:
              - name: New
    advice:
      - inject-declarations:
          links:
            - github.com/DataDog/dd-iast-go/iast/crypto/hash
          imports:
            context: context
            crypto: crypto
            telemetry: github.com/DataDog/dd-iast-go/internal/instrumentation/telemetry
            model: github.com/DataDog/dd-iast-go/internal/model/constants
          template: |-
            //go:linkname __dd__iast_ReportWeakHash__ github.com/DataDog/dd-iast-go/iast/crypto/hash.ReportWeakHash
            func __dd__iast_ReportWeakHash__(context.Context, crypto.Hash)

            func init() {
              telemetry.InstrumentedSink[model.VulnerabilityTypeWeakHash].Add(2) // New + free-standing Sum
            }
      - prepend-statements:
          imports:
            crypto: crypto
            iast: github.com/DataDog/dd-iast-go/iast/crypto/hash
          template: __dd__iast_ReportWeakHash__(nil, crypto.MD5)
  - id: crypto/md5.Sum
    join-point:
      all-of:
        - import-path: crypto/md5
        - function-body:
            function:
              - name: Sum
              - receiver: false
    advice:
      - prepend-statements:
          imports:
            crypto: crypto
            iast: github.com/DataDog/dd-iast-go/iast/crypto/hash
          template: __dd__iast_ReportWeakHash__(nil, crypto.MD5)

  # See the crypto/md5 aspects above for why the declaration and report advice
  # are split into two join-points.
  - id: crypto/sha1.New
    join-point:
      all-of:
        - import-path: crypto/sha1
        - function-body:
            function:
              - name: New
    advice:
      - inject-declarations:
          links:
            - github.com/DataDog/dd-iast-go/iast/crypto/hash
          imports:
            context: context
            crypto: crypto
            telemetry: github.com/DataDog/dd-iast-go/internal/instrumentation/telemetry
            model: github.com/DataDog/dd-iast-go/internal/model/constants
          template: |-
            //go:linkname __dd__iast_ReportWeakHash__ github.com/DataDog/dd-iast-go/iast/crypto/hash.ReportWeakHash
            func __dd__iast_ReportWeakHash__(context.Context, crypto.Hash)

            func init() {
              telemetry.InstrumentedSink[model.VulnerabilityTypeWeakHash].Add(2) // New + free-standing Sum
            }
      - prepend-statements:
          imports:
            crypto: crypto
            iast: github.com/DataDog/dd-iast-go/iast/crypto/hash
          template: __dd__iast_ReportWeakHash__(nil, crypto.SHA1)
  - id: crypto/sha1.Sum
    join-point:
      all-of:
        - import-path: crypto/sha1
        - function-body:
            function:
              - name: Sum
              - receiver: false
    advice:
      - prepend-statements:
          imports:
            crypto: crypto
            iast: github.com/DataDog/dd-iast-go/iast/crypto/hash
          template: __dd__iast_ReportWeakHash__(nil, crypto.SHA1)
