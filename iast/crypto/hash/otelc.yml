# otelc (go.opentelemetry.io/otelc) rules for weak hash detection. This is the
# counterpart of orchestrion.yml in the same directory.
#
# Phase 1 prototype: only crypto/md5 is ported.
version: v1.2.0

# Declares the go:linkname functions in crypto/md5 and registers the sink count.
# This rule ignores "where" and always applies when crypto/md5 is built.
md5_declarations:
  target: crypto/md5
  do:
    - add_file:
        file: otelc_decl_md5.go
        path: github.com/DataDog/dd-iast-go/iast/crypto/hash

# md5.New. A rule without "recv" matches free-standing functions only.
md5_new:
  target: crypto/md5
  where:
    func: New
  do:
    - inject_code:
        raw: __dd__iast_ReportWeakHash__(nil, crypto.MD5)
  imports:
    crypto: crypto

# md5.Sum (not the (*digest).Sum method).
md5_sum:
  target: crypto/md5
  where:
    func: Sum
  do:
    - inject_code:
        raw: __dd__iast_ReportWeakHash__(nil, crypto.MD5)
  imports:
    crypto: crypto
