              }
            }

            // __dd_iast_bufio_Read is the twin of (*Reader).Read (body copy):
            // the delegated reads use the read rule, and the copy to p keeps
            // the bits.
            func __dd_iast_bufio_Read(b *Reader, p []byte) (n int, err error) {
              n = len(p)
              if n == 0 {
                if b.Buffered() > 0 {
                  return 0, nil
