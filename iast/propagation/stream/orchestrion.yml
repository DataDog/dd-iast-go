                }
                b.r = 0
                b.w = 0
                n, b.err = __dd_iast_bufio_read(b.rd, b.buf)
                if n < 0 {
                  panic(errNegativeRead)
                }
                if n == 0 {
                  return 0, b.readErr()
                }
                b.w += n
              }
              n = copy(p, b.buf[b.r:b.w])
              __dd_iast_bufio_copy(p, b.buf[b.r:], n)
