    join-point:
      all-of:
        - import-path: encoding/json
        - function-body:
            function:
              - receiver: "*encoding/json.decodeState"
              - name: literalStore
    advice:
      - prepend-statements:
          template: |-
            {{- $d := .Function.Receiver -}}
            if {{ $d }}.__dd_iast_quoted != "" {
              __dd_iast_json_quotedItem({{ $d }}, {{ .Function.Argument 0 }}, {{ .Function.Argument 2 }})
            }

