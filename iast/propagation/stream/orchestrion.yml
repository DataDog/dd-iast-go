            // __dd_iast_bufio_read is the read rule of plan section 6.2: a
            // delegated Read into reused memory dst. When dst has bits (and is
            // 64 KiB or less), these steps run, with no allocation:
            //   1. Save at most 16 tainted runs of dst (offset and end) in a
            //      fixed array on the stack. limit is the start of the 17th
            //      run, or len(dst) when dst has 16 runs or less.
            //   2. Clear dst[:limit] only.
            //   3. Call Read, which returns n.
            //   4. Set again the bits of the saved runs in dst[n:limit]. If n
            //      is more than limit, clear dst[limit:n].
            //
            // Thus a byte that Read writes never keeps its old bits (no stale
            // taint): a written byte before limit is cleared before Read, and a
            // written byte from limit is cleared after Read (it also loses its
            // new bits: taint loss only). The tail that Read did not write (all
            // bytes from max(n, limit), and the saved runs in dst[n:limit])
            // keeps its bits, and the values that alias it keep them too.
            //
            // The CPU cost of each read is O(limit/64 + n/64) words of bits for
            // the scan, the clear and the set (at most 1,024 words for each
            // step with 64 KiB), with no allocation. A negative Read result n,
            // or an n that is more than len(dst), counts as a write of all of
            // dst. When the bits cannot be set again (no storage), the tail
            // loses them (taint loss only). When Read panics, the panic goes
            // on, and the saved bits in dst[:limit] are lost (taint loss only).
            func __dd_iast_bufio_read(rd io.Reader, dst []byte) (int, error) {
              l := len(dst)
              p := unsafe.Pointer(unsafe.SliceData(dst))
              if l == 0 || l > 64<<10 || !__dd_iast_any(p, uintptr(l)) {
                return rd.Read(dst)
              }
              // The snapshot: at most 16 tainted runs [start, end), on the
              // stack. limit is the start of the first run that is not in the
              // snapshot, or l.
              var starts, ends [16]int
              k, limit := 0, l
              for off := __dd_iast_bufio_find(p, l, 0, true); off < l; {
                end := __dd_iast_bufio_find(p, l, off, false)
                if k == len(starts) || end <= off {
                  // Too many runs, or a concurrent change of the bits: the bits
                  // from off are not in the snapshot, and they are not cleared
                  // before Read.
                  limit = off
