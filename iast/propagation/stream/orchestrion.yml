  # ---------------------------------------------------------------------------
  # telemetry
  # ---------------------------------------------------------------------------

  # Not hooks (two "-decls" aspects). The application does not link this
  # package (orchestrion.tool.go imports it only with the "tools" build tag),
  # thus its init function cannot give the number of hooks to telemetry.
  # Package fmt pushes the number of the hooks that are not in encoding/json;
  # package encoding/json pushes the number of its hooks. Package
  # internal/taint/request pulls them in its init function (0 without
  # weaving).
  - id: fmt-telemetry-decls
    join-point:
      struct-definition: fmt.pp
    advice:
      - inject-declarations:
          imports:
            unsafe: unsafe
          template: |-
            // __dd_iast_stream_points is instrumentedPropagationPoints of
            // iast/propagation/stream: the hooks that are not in
            // encoding/json (TestAspectCount checks the value). Exported to
            // package internal/taint/request (push linkname).
            //
            //go:linkname __dd_iast_stream_points __dd_iast_telemetry.stream_points
            var __dd_iast_stream_points uint32 = 14

            // The linkname directive needs the import of unsafe.
            var _ unsafe.Pointer

  # The type decodeState is only in the v1 files of encoding/json (decode.go:
  # "//go:build !goexperiment.jsonv2"). Thus this number is in the build only
  # when the 4 encoding/json hooks apply (Go 1.26 by default, Go 1.27 with
  # GOEXPERIMENT=nojsonv2). With GOEXPERIMENT=jsonv2, the hooks of
  # iast/propagation/jsonv2 apply, and encoding/json/jsontext pushes their
  # number.
  - id: encoding/json-telemetry-decls
    join-point:
      struct-definition: encoding/json.decodeState
    advice:
      - inject-declarations:
          imports:
            unsafe: unsafe
          template: |-
            // __dd_iast_stream_json_points is instrumentedJSONPropagationPoints
            // of iast/propagation/stream: the hooks in encoding/json
            // (TestAspectCount checks the value). Exported to package
            // internal/taint/request (push linkname).
            //
            //go:linkname __dd_iast_stream_json_points __dd_iast_telemetry.stream_json_points
            var __dd_iast_stream_json_points uint32 = 4

            // The linkname directive needs the import of unsafe.
            var _ unsafe.Pointer
