---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/iast/propagation/stream
  description: >-
    Taint propagation hooks in the standard library packages fmt, io, bufio and
    encoding/json (plan heapbits-sqli-cmdi, section 6). The hooks copy the heap
    taint bits of internal/taint/heapbits where these packages move bytes with
    operations that the runtime hooks cannot see (copy, append(x, y...),
    make + copy).

# How the hooks work (plan section 6.1):
#
#  - The prepended code of each hooked function reads the sticky gate
#    __dd_iast_live() (heapbits.Live: 2 loads, inlined). When it is false, no byte of the heap
#    is tainted: the original body runs. This is the only added work when no
#    taint was ever set.
#  - Else the code calls the twin __dd_iast_<pkg>_<fn>. The twin is declared
#    in the same package. It checks the taint bits of the inputs (or of the
#    destination), does the work of the body again with the bit operations,
#    and returns true (or it always does the work, when the gate is
#    heapbits.Live() only). When it returns false, the original body runs.
#  - When the twin must run the original body and then look at its output
#    (fmt printArg, fmtString, fmtBytes, doPrintf; json valueQuoted), it sets
#    the bypass field __dd_iast_bypass of the receiver and calls the hooked
#    method once. The prepended code of the method clears the field and runs
#    the original body. The gate is sticky, so the inner call also sees it on.
#
# Rules (do not change them without the tests of this package):
#
#  - The hook code imports no package of dd-iast-go (see the bit functions
#    of the &bits block): only packages of the standard library that the
#    hooked package already imports, or that it can import without a cycle.
#    It reaches the bits with the pull linknames of package heapbits, and
#    propbridge.Derived with the push linkname __dd_iast_propbridge.derived
#    of package propbridge. No "links": the hooks do not keep a package of
#    dd-iast-go in the program.
#  - No defer. No new panic: the twins keep the panics of the original body.
#  - The twins pass uintptr values to propbridge only for memory that they
#    keep alive (runtime.KeepAlive) until the call returns. KeepAlive gets an
#    unsafe.Pointer, never a string, a slice or an interface value: that
#    conversion makes the value leak to the heap, and changes the escape
#    tags of the hooked function.
#  - fmt: the scratch array (*fmt).intbuf never gets taint bits.
#  - A twin that copies a body of the standard library must be checked when
#    the drift golden file (testdata/stdlib-<go>.golden) changes.

aspects:
  # ---------------------------------------------------------------------------
  # fmt
  # ---------------------------------------------------------------------------

  - id: fmt-decls
    join-point:
      struct-definition: fmt.pp
    advice:
      - add-struct-field:
          name: __dd_iast_bypass
          type: bool
      - &bits
        inject-declarations:
          imports:
            atomic: sync/atomic
            runtime: runtime
            unsafe: unsafe
          template: |-
            // ---- bit functions (plan section 6.1 rule 1) ----
            //
            // The hooks do not import packages heapbits and propbridge: go test
            // of a package with in-package tests rebuilds the standard library
            // packages that import it, and Orchestrion cannot rebuild them (a
            // fingerprint cycle through reflect). Thus the hooks pull the bit
            // functions of the woven runtime with the linknames of package
            // heapbits (nil without weaving: then nothing is tainted), the
            // string-to-slice switch of propbridge, and propbridge.Derived
            // through the push linkname of package propbridge (nil when
            // propbridge is not linked: then no request can be active).
            var (
              //go:linkname __dd_iast_rt_set __dd_iast_heapbits.set
              __dd_iast_rt_set func(p, n uintptr) bool

              //go:linkname __dd_iast_rt_clear __dd_iast_heapbits.clear
              __dd_iast_rt_clear func(p, n uintptr)

              //go:linkname __dd_iast_rt_any __dd_iast_heapbits.any
              __dd_iast_rt_any func(p, n uintptr) bool

              //go:linkname __dd_iast_rt_copy __dd_iast_heapbits.copy
              __dd_iast_rt_copy func(dst, src, n uintptr) bool

              //go:linkname __dd_iast_rt_seen __dd_iast_heapbits.seen
              __dd_iast_rt_seen *uint32

              //go:linkname __dd_iast_rt_s2soff __dd_iast_propbridge.s2soff
              __dd_iast_rt_s2soff uint32

              //go:linkname __dd_iast_rt_derived __dd_iast_propbridge.derived
              __dd_iast_rt_derived func(out, outLen, in, inLen uintptr, mode uint8)
            )

            // __dd_iast_coarse is the Coarse mode of propbridge.Derived
            // (TestBridgeModes checks the value).
            const __dd_iast_coarse uint8 = 1

            // __dd_iast_live is heapbits.Live: 2 loads, no call (inlinable).
            func __dd_iast_live() bool {
              p := __dd_iast_rt_seen
              return p != nil && atomic.LoadUint32(p) != 0
            }

            // __dd_iast_s2s is propbridge.StringToSlice.
            func __dd_iast_s2s() bool {
              return atomic.LoadUint32(&__dd_iast_rt_s2soff) == 0
            }

            // __dd_iast_derived is propbridge.Derived. The caller keeps the
            // memory alive until it returns.
            func __dd_iast_derived(out, outLen, in, inLen uintptr, mode uint8) {
              if f := __dd_iast_rt_derived; f != nil {
                f(out, outLen, in, inLen, mode)
              }
            }

            // The bit functions below are heapbits.Any, Set, Clear and Copy.
            // They are not inlined (as in package heapbits): their stack check
            // is a preemption point.

            //go:noinline
            func __dd_iast_any(p unsafe.Pointer, n uintptr) bool {
              f := __dd_iast_rt_any
              if f == nil || n == 0 {
                return false
              }
              ok := f(uintptr(p), n)
              runtime.KeepAlive(p)
              return ok
            }

            //go:noinline
            func __dd_iast_set(p unsafe.Pointer, n uintptr) bool {
              f := __dd_iast_rt_set
              if f == nil || n == 0 {
                return false
              }
              ok := f(uintptr(p), n)
              runtime.KeepAlive(p)
              return ok
            }

            //go:noinline
            func __dd_iast_clear(p unsafe.Pointer, n uintptr) {
              f := __dd_iast_rt_clear
              if f == nil || n == 0 {
                return
              }
              f(uintptr(p), n)
              runtime.KeepAlive(p)
            }

            //go:noinline
            func __dd_iast_copy(dst, src unsafe.Pointer, n uintptr) bool {
              f := __dd_iast_rt_copy
              if f == nil || n == 0 {
                return false
              }
              ok := f(uintptr(dst), uintptr(src), n)
              runtime.KeepAlive(dst)
              runtime.KeepAlive(src)
              return ok
            }

            func __dd_iast_anyString(s string) bool {
              return __dd_iast_any(unsafe.Pointer(unsafe.StringData(s)), uintptr(len(s)))
            }

            func __dd_iast_anyBytes(b []byte) bool {
              return __dd_iast_any(unsafe.Pointer(unsafe.SliceData(b)), uintptr(len(b)))
            }

            func __dd_iast_clearBytes(b []byte) {
              __dd_iast_clear(unsafe.Pointer(unsafe.SliceData(b)), uintptr(len(b)))
            }
      - inject-declarations:
          imports:
            reflect: reflect
            runtime: runtime
            unsafe: unsafe
            utf8: unicode/utf8
          template: |-
            // Compile-time checks of the fields that the twins use (plan
            // section 6.1 rule 6).
            var (
              _ buffer  = pp{}.buf
              _ *buffer = fmt{}.buf
              _ bool    = fmt{}.sharpV
              _ bool    = fmt{}.zero
              _ bool    = fmt{}.minus
              _ bool    = fmt{}.widPresent
              _ int     = fmt{}.wid
              _ bool    = pp{}.erroring
            )

            // The exact copies of fmt (plan section 6.2) are hooked in the
            // callers of (*buffer).write and writeString that write a value:
            // (*fmt).pad, (*fmt).padString, (*pp).Write and (*pp).WriteString.
            // With one more call, (*buffer).write and writeString stop being
            // inlined (cost 87, budget 80), and the plan requires that they
            // stay inlinable (section 6.1 rule 3). The other callers write
            // fixed text, type names, numbers and the format text (a tainted
            // format makes the whole output coarse, see doPrintf). The memory
            // after len(pp.buf) has no bits (the free hook clears the buffer
            // before it goes back to the pool, and a growth gives new memory),
            // so a clean write needs no clear.

            // __dd_iast_fmt_write appends p to *b and copies the bits of p to
            // the appended bytes.
            func __dd_iast_fmt_write(b *buffer, p []byte) {
              old := len(*b)
              *b = append(*b, p...)
              if len(p) != 0 {
                __dd_iast_copy(unsafe.Pointer(&(*b)[old]), unsafe.Pointer(unsafe.SliceData(p)), uintptr(len(p)))
              }
            }

            // __dd_iast_fmt_writeString appends s to *b and copies the bits of
            // s to the appended bytes.
            func __dd_iast_fmt_writeString(b *buffer, s string) {
              old := len(*b)
              *b = append(*b, s...)
              if len(s) != 0 {
                __dd_iast_copy(unsafe.Pointer(&(*b)[old]), unsafe.Pointer(unsafe.StringData(s)), uintptr(len(s)))
              }
            }

            // __dd_iast_fmt_pad is the twin of (*fmt).pad (body copy) for a
            // tainted b.
            func __dd_iast_fmt_pad(f *fmt, b []byte) bool {
              if !__dd_iast_anyBytes(b) {
                return false
              }
              if !f.widPresent || f.wid == 0 {
                __dd_iast_fmt_write(f.buf, b)
                return true
              }
              width := f.wid - utf8.RuneCount(b)
              if !f.minus {
                // left padding
                f.writePadding(width)
                __dd_iast_fmt_write(f.buf, b)
              } else {
                // right padding
                __dd_iast_fmt_write(f.buf, b)
                f.writePadding(width)
              }
              return true
            }

            // __dd_iast_fmt_padString is the twin of (*fmt).padString (body
            // copy) for a tainted s.
            func __dd_iast_fmt_padString(f *fmt, s string) bool {
              if !__dd_iast_anyString(s) {
                return false
              }
              if !f.widPresent || f.wid == 0 {
                __dd_iast_fmt_writeString(f.buf, s)
                return true
              }
              width := f.wid - utf8.RuneCountInString(s)
              if !f.minus {
                // left padding
                f.writePadding(width)
                __dd_iast_fmt_writeString(f.buf, s)
              } else {
                // right padding
                __dd_iast_fmt_writeString(f.buf, s)
                f.writePadding(width)
              }
              return true
            }

            // __dd_iast_fmt_ppWrite is the twin of (*pp).Write (the writes of
            // a Formatter) for a tainted b.
            func __dd_iast_fmt_ppWrite(p *pp, b []byte) bool {
              if !__dd_iast_anyBytes(b) {
                return false
              }
              __dd_iast_fmt_write(&p.buf, b)
              return true
            }

            // __dd_iast_fmt_ppWriteString is the twin of (*pp).WriteString for
            // a tainted s.
            func __dd_iast_fmt_ppWriteString(p *pp, s string) bool {
              if !__dd_iast_anyString(s) {
                return false
              }
              __dd_iast_fmt_writeString(&p.buf, s)
              return true
            }

            // __dd_iast_fmt_writePadding is the twin of (*fmt).writePadding
            // (body copy, plan section 6.2): the growth copy keeps the bits of
            // the old output; the padding is clean.
            func __dd_iast_fmt_writePadding(f *fmt, n int) bool {
              if n <= 0 {
                return false
              }
              buf := *f.buf
              oldLen := len(buf)
              newLen := oldLen + n
              grow := newLen > cap(buf)
              if !__dd_iast_anyBytes(buf) && (grow || !__dd_iast_anyBytes(buf[oldLen:newLen])) {
                return false
              }
              if grow {
                buf = make(buffer, cap(buf)*2+n)
                copy(buf, *f.buf)
                if oldLen > 0 {
                  __dd_iast_copy(unsafe.Pointer(&buf[0]), unsafe.Pointer(&(*f.buf)[0]), uintptr(oldLen))
                }
              }
              padByte := byte(' ')
              if f.zero && !f.minus {
                padByte = byte('0')
              }
              padding := buf[oldLen:newLen]
              for i := range padding {
                padding[i] = padByte
              }
              __dd_iast_clearBytes(padding)
              *f.buf = buf[:newLen]
              return true
            }

            // __dd_iast_fmt_free clears the bits of the printer buffer before
            // it goes back to the pool (plan section 6.4). A buffer larger than
            // 64 KiB is not reused (free drops it).
            func __dd_iast_fmt_free(p *pp) {
              p.__dd_iast_bypass = false
              if b := p.buf; len(b) != 0 && cap(b) <= 64*1024 {
                ptr, n := unsafe.Pointer(unsafe.SliceData(b)), uintptr(len(b))
                if __dd_iast_any(ptr, n) {
                  __dd_iast_clear(ptr, n)
                }
              }
            }

            // __dd_iast_fmt_coarse taints the output p.buf[before:] as a whole
            // and records it as derived from the inLen bytes at in (plan
            // section 6.3). The caller keeps the memory at in alive.
            func __dd_iast_fmt_coarse(p *pp, before int, in unsafe.Pointer, inLen int) {
              after := len(p.buf)
              if before < 0 || after <= before {
                return
              }
              out := unsafe.Pointer(&p.buf[before])
              n := uintptr(after - before)
              if __dd_iast_set(out, n) {
                __dd_iast_derived(uintptr(out), n, uintptr(in), uintptr(inLen), __dd_iast_coarse)
              }
              runtime.KeepAlive(out)
            }

            // __dd_iast_fmt_argdata returns the data of arg when it is a
            // string or a []byte (also of a named type).
            func __dd_iast_fmt_argdata(arg any) (unsafe.Pointer, int) {
              switch v := arg.(type) {
              case string:
                return unsafe.Pointer(unsafe.StringData(v)), len(v)
              case []byte:
                return unsafe.Pointer(unsafe.SliceData(v)), len(v)
              }
              v := reflect.ValueOf(arg)
              switch v.Kind() {
              case reflect.String:
                s := v.String()
                return unsafe.Pointer(unsafe.StringData(s)), len(s)
              case reflect.Slice:
                if v.Type().Elem().Kind() == reflect.Uint8 {
                  b := v.Bytes()
                  return unsafe.Pointer(unsafe.SliceData(b)), len(b)
                }
              }
              return nil, 0
            }

            // __dd_iast_fmt_printArg is the twin of (*pp).printArg. It handles
            // a tainted string or []byte argument (also of a named type) when
            // the output is not made by fmtString or fmtBytes: the verbs %T and
            // %p, and the methods (Format, String, Error, GoString). This
            // output is generated: it is tainted as a whole (coarse), also when
            // it has bits of a different request. fmtString and fmtBytes handle
            // the other verbs (exact or coarse).
            func __dd_iast_fmt_printArg(p *pp, arg any, verb rune) bool {
              switch arg.(type) {
              case nil, bool, int, int8, int16, int32, int64, uint, uint8, uint16, uint32, uint64, uintptr, float32, float64, complex64, complex128:
                return false
              case string, []byte:
                if verb != 'T' && verb != 'p' {
                  return false
                }
              case Formatter, Stringer, error, GoStringer:
              default:
                if verb != 'T' && verb != 'p' {
                  return false
                }
              }
              ptr, n := __dd_iast_fmt_argdata(arg)
              if n == 0 || !__dd_iast_any(ptr, uintptr(n)) {
                return false
              }
              before := len(p.buf)
              p.__dd_iast_bypass = true
              p.printArg(arg, verb)
              __dd_iast_fmt_coarse(p, before, ptr, n)
              runtime.KeepAlive(ptr)
              return true
            }

            // __dd_iast_fmt_exactString tells if fmtString copies v as it is
            // (%s, and %v without the # flag).
            func __dd_iast_fmt_exactString(p *pp, verb rune) bool {
              return verb == 's' || (verb == 'v' && !p.fmt.sharpV)
            }

            // __dd_iast_fmt_fmtBytes is the twin of (*pp).fmtBytes: the output
            // of all verbs except %s is generated (coarse).
            func __dd_iast_fmt_fmtBytes(p *pp, v []byte, verb rune, typeString string) bool {
              ptr, n := unsafe.Pointer(unsafe.SliceData(v)), len(v)
              if verb == 's' || !__dd_iast_any(ptr, uintptr(n)) {
                return false
              }
              before := len(p.buf)
              p.__dd_iast_bypass = true
              p.fmtBytes(v, verb, typeString)
              __dd_iast_fmt_coarse(p, before, ptr, n)
              runtime.KeepAlive(ptr)
              return true
            }

            // __dd_iast_fmt_doPrintf is the twin of (*pp).doPrintf: a tainted
            // format string makes the whole output coarse.
            func __dd_iast_fmt_doPrintf(p *pp, format string, a []any) bool {
              ptr, n := unsafe.Pointer(unsafe.StringData(format)), len(format)
              if !__dd_iast_any(ptr, uintptr(n)) {
                return false
              }
              before := len(p.buf)
              p.__dd_iast_bypass = true
              p.doPrintf(format, a)
              __dd_iast_fmt_coarse(p, before, ptr, n)
              runtime.KeepAlive(ptr)
              return true
            }

  - id: fmt.fmt.pad
    join-point:
      all-of:
        - import-path: fmt
        - function-body:
            function:
              - receiver: "*fmt.fmt"
              - name: pad
    advice:
      - prepend-statements:
          template: |-
            if __dd_iast_live() {
              if __dd_iast_fmt_pad({{ .Function.Receiver }}, {{ .Function.Argument 0 }}) {
                return
              }
            }

  - id: fmt.fmt.padString
    join-point:
      all-of:
        - import-path: fmt
        - function-body:
            function:
              - receiver: "*fmt.fmt"
              - name: padString
    advice:
      - prepend-statements:
          template: |-
            if __dd_iast_live() {
              if __dd_iast_fmt_padString({{ .Function.Receiver }}, {{ .Function.Argument 0 }}) {
                return
              }
            }

  - id: fmt.pp.Write
    join-point:
      all-of:
        - import-path: fmt
        - function-body:
            function:
              - receiver: "*fmt.pp"
              - name: Write
    advice:
      - prepend-statements:
          template: |-
            {{- $b := .Function.Argument 0 -}}
            if __dd_iast_live() {
              if __dd_iast_fmt_ppWrite({{ .Function.Receiver }}, {{ $b }}) {
                return len({{ $b }}), nil
              }
            }

  - id: fmt.pp.WriteString
    join-point:
      all-of:
        - import-path: fmt
        - function-body:
            function:
              - receiver: "*fmt.pp"
              - name: WriteString
    advice:
      - prepend-statements:
          template: |-
            {{- $s := .Function.Argument 0 -}}
            if __dd_iast_live() {
              if __dd_iast_fmt_ppWriteString({{ .Function.Receiver }}, {{ $s }}) {
                return len({{ $s }}), nil
              }
            }

  - id: fmt.fmt.writePadding
    join-point:
      all-of:
        - import-path: fmt
        - function-body:
            function:
              - receiver: "*fmt.fmt"
              - name: writePadding
    advice:
      - prepend-statements:
          template: |-
            if __dd_iast_live() {
              if __dd_iast_fmt_writePadding({{ .Function.Receiver }}, {{ .Function.Argument 0 }}) {
                return
              }
            }

  - id: fmt.pp.free
    join-point:
      all-of:
        - import-path: fmt
        - function-body:
            function:
              - receiver: "*fmt.pp"
              - name: free
    advice:
      - prepend-statements:
          template: |-
            if __dd_iast_live() {
              __dd_iast_fmt_free({{ .Function.Receiver }})
            }

  - id: fmt.pp.printArg
    join-point:
      all-of:
        - import-path: fmt
        - function-body:
            function:
              - receiver: "*fmt.pp"
              - name: printArg
    advice:
      - prepend-statements:
          template: |-
            {{- $p := .Function.Receiver -}}
            if __dd_iast_live() {
              if {{ $p }}.__dd_iast_bypass {
                {{ $p }}.__dd_iast_bypass = false
              } else if __dd_iast_fmt_printArg({{ $p }}, {{ .Function.Argument 0 }}, {{ .Function.Argument 1 }}) {
                return
              }
            }

  # (*pp).fmtString has 2 signatures: (v string, verb rune) in Go 1.26 and
  # (arg any, value reflect.Value, v string, verb rune) in Go 1.27. One aspect
  # for each; the twin of each is declared with it.
  - id: fmt.pp.fmtString
    join-point:
      all-of:
        - import-path: fmt
        - function-body:
            function:
              - receiver: "*fmt.pp"
              - name: fmtString
              - signature:
                  args: [string, rune]
    advice:
      - inject-declarations:
          imports:
            runtime: runtime
            unsafe: unsafe
          template: |-
            // __dd_iast_fmt_fmtString is the twin of (*pp).fmtString: the
            // output of the verbs that do not copy v (%q, %x, %X, %#v, bad
            // verbs) is generated (coarse).
            func __dd_iast_fmt_fmtString(p *pp, v string, verb rune) bool {
              ptr, n := unsafe.Pointer(unsafe.StringData(v)), len(v)
              if __dd_iast_fmt_exactString(p, verb) || !__dd_iast_any(ptr, uintptr(n)) {
                return false
              }
              before := len(p.buf)
              p.__dd_iast_bypass = true
              p.fmtString(v, verb)
              __dd_iast_fmt_coarse(p, before, ptr, n)
              runtime.KeepAlive(ptr)
              return true
            }
      - prepend-statements:
          template: |-
            {{- $p := .Function.Receiver -}}
            if __dd_iast_live() {
              if {{ $p }}.__dd_iast_bypass {
                {{ $p }}.__dd_iast_bypass = false
              } else if __dd_iast_fmt_fmtString({{ $p }}, {{ .Function.Argument 0 }}, {{ .Function.Argument 1 }}) {
                return
              }
            }

  - id: fmt.pp.fmtString [go1.27]
    join-point:
      all-of:
        - import-path: fmt
        - function-body:
            function:
              - receiver: "*fmt.pp"
              - name: fmtString
              - signature:
                  args: [any, reflect.Value, string, rune]
    advice:
      - inject-declarations:
          imports:
            reflect: reflect
            runtime: runtime
            unsafe: unsafe
          template: |-
            // __dd_iast_fmt_fmtString is the twin of (*pp).fmtString (see the
            // Go 1.26 variant).
            func __dd_iast_fmt_fmtString(p *pp, arg any, value reflect.Value, v string, verb rune) bool {
              ptr, n := unsafe.Pointer(unsafe.StringData(v)), len(v)
              if __dd_iast_fmt_exactString(p, verb) || !__dd_iast_any(ptr, uintptr(n)) {
                return false
              }
              before := len(p.buf)
              p.__dd_iast_bypass = true
              p.fmtString(arg, value, v, verb)
              __dd_iast_fmt_coarse(p, before, ptr, n)
              runtime.KeepAlive(ptr)
              return true
            }
      - prepend-statements:
          template: |-
            {{- $p := .Function.Receiver -}}
            if __dd_iast_live() {
              if {{ $p }}.__dd_iast_bypass {
                {{ $p }}.__dd_iast_bypass = false
              } else if __dd_iast_fmt_fmtString({{ $p }}, {{ .Function.Argument 0 }}, {{ .Function.Argument 1 }}, {{ .Function.Argument 2 }}, {{ .Function.Argument 3 }}) {
                return
              }
            }

  - id: fmt.pp.fmtBytes
    join-point:
      all-of:
        - import-path: fmt
        - function-body:
            function:
              - receiver: "*fmt.pp"
              - name: fmtBytes
    advice:
      - prepend-statements:
          template: |-
            {{- $p := .Function.Receiver -}}
            if __dd_iast_live() {
              if {{ $p }}.__dd_iast_bypass {
                {{ $p }}.__dd_iast_bypass = false
              } else if __dd_iast_fmt_fmtBytes({{ $p }}, {{ .Function.Argument 0 }}, {{ .Function.Argument 1 }}, {{ .Function.Argument 2 }}) {
                return
              }
            }

  - id: fmt.pp.doPrintf
    join-point:
      all-of:
        - import-path: fmt
        - function-body:
            function:
              - receiver: "*fmt.pp"
              - name: doPrintf
    advice:
      - prepend-statements:
          template: |-
            {{- $p := .Function.Receiver -}}
            if __dd_iast_live() {
              if {{ $p }}.__dd_iast_bypass {
                {{ $p }}.__dd_iast_bypass = false
