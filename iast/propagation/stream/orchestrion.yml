            // unquoteBytes (TestUnquoteBytesCopy checks it).
            func __dd_iast_json_unquoteBytesBody(s []byte) (t []byte, ok bool) {
              if len(s) < 2 || s[0] != '"' || s[len(s)-1] != '"' {
                return
              }
              s = s[1 : len(s)-1]

              // Check for unusual characters. If there are none,
              // then no unquoting is needed, so return a slice of the
              // original bytes.
              r := 0
              for r < len(s) {
                c := s[r]
                if c == '\\' || c == '"' || c < ' ' {
                  break
                }
                rr, size := utf8.DecodeRune(s[r:])
                if rr == utf8.RuneError && size == 1 {
                  break
                }
                r += size
              }
              if r == len(s) {
                return s, true
              }

              b := make([]byte, len(s)+2*utf8.UTFMax)
              w := copy(b, s[0:r])
              for r < len(s) {
                // Out of room? Can only happen if s is full of
                // malformed UTF-8 and we're replacing each
                // byte with RuneError.
                if w >= len(b)-2*utf8.UTFMax {
                  nb := make([]byte, (len(b)+utf8.UTFMax)*2)
                  copy(nb, b[0:w])
                  b = nb
                }
                switch c := s[r]; {
                case c == '\\':
                  r++
                  if r >= len(s) {
                    return
                  }
                  switch s[r] {
                  default:
                    return
                  case '"', '\\', '/', '\'':
                    b[w] = s[r]
                    r++
                    w++
                  case 'b':
                    b[w] = '\b'
                    r++
                    w++
                  case 'f':
                    b[w] = '\f'
                    r++
                    w++
                  case 'n':
                    b[w] = '\n'
                    r++
                    w++
                  case 'r':
                    b[w] = '\r'
                    r++
                    w++
                  case 't':
                    b[w] = '\t'
                    r++
                    w++
                  case 'u':
                    r--
                    rr := getu4(s[r:])
                    if rr < 0 {
                      return
                    }
                    r += 6
                    if utf16.IsSurrogate(rr) {
                      rr1 := getu4(s[r:])
                      if dec := utf16.DecodeRune(rr, rr1); dec != unicode.ReplacementChar {
                        // A valid pair; consume.
                        r += 6
