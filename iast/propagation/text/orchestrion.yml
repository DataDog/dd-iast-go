  - id: bytes.Join
    join-point:
      all-of:
        - import-path: bytes
        - function-body:
            function:
              - name: Join
    advice:
      - inject-declarations:
          imports:
            bytealg: internal/bytealg
          template: |-
            // __dd_iast_join repeats the body with the bit copies.
            func __dd_iast_join(s [][]byte, sep []byte) ([]byte, bool) {
              if len(s) == 0 {
                return nil, false
              }
              hit := len(s) > 1 && __dd_iast_anyb(sep)
              for i := 0; !hit && i < len(s); i++ {
                hit = __dd_iast_anyb(s[i])
              }
              if !hit {
                return nil, false
              }
              if len(s) == 1 {
                r := append([]byte(nil), s[0]...)
                __dd_iast_copy(r, s[0])
                return r, true
              }
              var n int
              if len(sep) > 0 {
                if len(sep) >= maxInt/(len(s)-1) {
                  panic("bytes: Join output length overflow")
                }
                n += len(sep) * (len(s) - 1)
              }
              for _, v := range s {
                if len(v) > maxInt-n {
                  panic("bytes: Join output length overflow")
                }
                n += len(v)
              }
              b := bytealg.MakeNoZero(n)[:n:n]
              bp := copy(b, s[0])
              __dd_iast_copy(b[:bp], s[0])
              for _, v := range s[1:] {
                k := copy(b[bp:], sep)
                __dd_iast_copy(b[bp:bp+k], sep)
                bp += k
                k = copy(b[bp:], v)
                __dd_iast_copy(b[bp:bp+k], v)
                bp += k
              }
              return b, true
            }
