---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/iast/propagation/text
  description: >-
    Taint propagation hooks in the standard library packages strings, bytes,
    strconv and net/url. The hooks copy (or set) the heap taint bits of
    internal/taint/heapbits where the standard library copies bytes with copy
    or with the appended part of append, which the runtime hooks of
    iast/runtime cannot see.

# How the hooks work (plan heapbits-sqli-cmdi, section 6.1):
#
#  1. Each hooked function starts with "if __dd_iast_live() { ... }". Live is
#     2 loads and no call (it is inlined). When it is false, no byte of the
#     heap is tainted, and the original body runs.
#  2. Else the prepended code calls the twin __dd_iast_<fn>, an injected
#     function of the same package. The twin checks the taint of the inputs
#     (Any of the heap bits). When no input is tainted, it returns false and the
#     original body runs. Else it does the work of the body again with the bit
#     operations, and returns true with the results. A few twins always do
#     the work (the bytes.Buffer writes: their gate is "the source or the
#     destination is tainted", and the destination is known only after the
#     growth of the buffer; and the bytes.Reader and strings.Reader reads,
#     with the same gate).
#  3. Exact copies (Builder and Buffer writes, bytes.Reader and
#     strings.Reader reads, Clone, Join, Repeat, Replace, bytes.ToValidUTF8)
#     copy the bits with heapbits.Copy. The positional
#     transforms (ASCII ToUpper and ToLower) copy the bits and record a
#     positional derived entry (propbridge.Derived). The coarse transforms
#     (Map, strings.ToValidUTF8, Replacer.Replace, quote, unquote, URL escape
#     and unescape) set the bits of the whole output and record a coarse
#     derived entry (plan section 6.3).
#  4. Some coarse twins ("clean copy" twins: strings.Map,
#     strings.ToValidUTF8, strconv.unquote, url.escape, url.unescape) do not
#     repeat the body: they call the hooked function again on a copy of the
#     input without taint bits (make and copy do not copy the bits, and the
#     twin also clears them). The inner call sees no taint, so its twin
#     returns false and the original body runs (one time, so application
#     callbacks also run one time). Then the twin changes each result that is
#     a part of the copy into the same part of the original input (the
#     original body returns parts of its input; they keep their exact bits),
#     and applies the coarse rule to a new output.
#  5. Some hooks ("plain twin" hooks: strings.Join, strings.Replace,
#     strings.Repeat, strings.ToLower) start with "if !__dd_iast_live() ||
#     <no input is tainted> { return __dd_iast_<fn>_plain(...) }". The
#     check does one Any for each input before the body (strings.Join
#     checks its elements in batches of 256 with one call of the runtime).
#     The plain twin is a copy of the original body that uses __dd_iast_pb,
#     a local builder without hooks (its write methods are inlinable), in
#     place of strings.Builder: the hooks of strings.Builder stop the
#     inlining of its methods, and do one Any for each write. The output of
#     a plain twin has no taint bits, as the output of the original body for
#     inputs without taint. When an input is tainted, the original body runs
#     (with the hooks of strings.Builder), or the twin of rule 2 for its
#     special cases. TestPlainTwins compares the plain twins with the
#     original bodies (results, panics, allocations).
#     Accepted limit: the check occurs one time, before the copy. When a
#     different goroutine taints (in place) an input after the check and
#     before the copy, the output does not get this taint. The original body
#     has the same window between its check (in the hooked
#     Builder.WriteString) and its copy, only shorter.
#
# Rules:
#
#  - The hook code imports only internal/taint/heapbits and
#    internal/taint/propbridge (and packages that the hooked package already
#    imports, or that the runtime imports). Never hook a package that the
#    runtime imports (internal/stringslite, internal/bytealg).
#  - No defer, no recover, no lock in a twin. A twin panics only where the
#    original body panics, with the same value.
#  - A twin passes uintptr values to propbridge only for memory that it keeps
#    alive with runtime.KeepAlive until the call returns.
#  - strconv.appendQuotedWith is not hooked: fmt passes its scratch array to
#    it (plan section 6.3).
#  - The bodies that the twins repeat or depend on are in the drift golden
#    files (testdata/stdlib-*.golden, TestStdlibDrift).
#  - The number of aspects is instrumentedPropagationPoints in doc.go
#    (TestAspectCount).

aspects:
  # ---------------------------------------------------------------- strings

  - id: strings.Clone
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - name: Clone
    advice:
      - inject-declarations:
          imports:
            atomic: sync/atomic
            runtime: runtime
            unsafe: unsafe
            stringslite: internal/stringslite
            bytealg: internal/bytealg
          template: |-
            // ---- bit functions (plan section 6.1 rule 1) ----
            //
            // The hooks do not import packages heapbits and propbridge: go test
            // of a package with in-package tests rebuilds the standard library
            // packages that import it, and Orchestrion cannot rebuild them (a
            // fingerprint cycle through reflect). Thus the hooks pull the bit
            // functions of the woven runtime with the linknames of package
            // heapbits (nil without weaving: then nothing is tainted), and
            // propbridge.Derived with the pull linkname of a variable that
            // propbridge pushes (nil when propbridge is not linked: then no
            // derived entry is needed, no analysis can read it).
            var (
              //go:linkname __dd_iast_rt_set __dd_iast_heapbits.set
              __dd_iast_rt_set func(p, n uintptr) bool

              //go:linkname __dd_iast_rt_clear __dd_iast_heapbits.clear
              __dd_iast_rt_clear func(p, n uintptr)

              //go:linkname __dd_iast_rt_any __dd_iast_heapbits.any
              __dd_iast_rt_any func(p, n uintptr) bool

              //go:linkname __dd_iast_rt_copy __dd_iast_heapbits.copy
              __dd_iast_rt_copy func(dst, src, n uintptr) bool

              //go:linkname __dd_iast_rt_seen __dd_iast_heapbits.seen
              __dd_iast_rt_seen *uint32
            )

            // Modes of propbridge.Derived (TestBridgeModes checks the values).
            const (
              __dd_iast_mode_coarse     uint8 = 1
              __dd_iast_mode_positional uint8 = 2
            )

            // __dd_iast_rt_derived is propbridge.Derived (pushed by package
            // propbridge; nil when it is not linked).
            //
            //go:linkname __dd_iast_rt_derived __dd_iast_propbridge.derived
            var __dd_iast_rt_derived func(out, outLen, in, inLen uintptr, mode uint8)

            func __dd_iast_derived(out, outLen, in, inLen uintptr, mode uint8) {
              if f := __dd_iast_rt_derived; f != nil {
                f(out, outLen, in, inLen, mode)
              }
            }

            // __dd_iast_live is heapbits.Live: 2 loads, no call (inlinable).
            func __dd_iast_live() bool {
              p := __dd_iast_rt_seen
              return p != nil && atomic.LoadUint32(p) != 0
            }

            // The bit functions below are heapbits.Any, Set, Clear and Copy.
            // They are not inlined (as in package heapbits): their stack check
            // is a preemption point.

            //go:noinline
            func __dd_iast_any(p unsafe.Pointer, n int) bool {
              f := __dd_iast_rt_any
              if f == nil || n <= 0 {
                return false
              }
              ok := f(uintptr(p), uintptr(n))
              runtime.KeepAlive(p)
              return ok
            }

            //go:noinline
            func __dd_iast_set(p unsafe.Pointer, n int) bool {
              f := __dd_iast_rt_set
              if f == nil || n <= 0 {
                return false
              }
              ok := f(uintptr(p), uintptr(n))
              runtime.KeepAlive(p)
              return ok
            }

            //go:noinline
            func __dd_iast_clear(p unsafe.Pointer, n int) {
              f := __dd_iast_rt_clear
              if f == nil || n <= 0 {
                return
              }
              f(uintptr(p), uintptr(n))
              runtime.KeepAlive(p)
            }

            //go:noinline
            func __dd_iast_copyp(dst, src unsafe.Pointer, n int) bool {
              f := __dd_iast_rt_copy
              if f == nil || n <= 0 {
                return false
              }
              ok := f(uintptr(dst), uintptr(src), uintptr(n))
              runtime.KeepAlive(dst)
              runtime.KeepAlive(src)
              return ok
            }

            func __dd_iast_anys(s string) bool {
              return __dd_iast_any(unsafe.Pointer(unsafe.StringData(s)), len(s))
            }

            func __dd_iast_anyb(b []byte) bool {
              return __dd_iast_any(unsafe.Pointer(unsafe.SliceData(b)), len(b))
            }

            func __dd_iast_clearb(b []byte) {
              __dd_iast_clear(unsafe.Pointer(unsafe.SliceData(b)), len(b))
            }

            // ---- plain builder (rule 5 of the header) ----

            // __dd_iast_pb is strings.Builder without the hooks and without
            // the copy check. Only the plain twins use it, and only as a
            // local variable (it is never copied). Its methods do the same
            // work as the methods of strings.Builder (the same allocation
            // sizes and the same panics). The methods are inlinable, except
            // grow (as in strings.Builder; TestPlainBuilderInlining).
            type __dd_iast_pb struct {
              buf []byte
            }

            // grow is strings.Builder.grow.
            func (b *__dd_iast_pb) grow(n int) {
              buf := bytealg.MakeNoZero(2*cap(b.buf) + n)[:len(b.buf)]
              copy(buf, b.buf)
              b.buf = buf
            }

            // Grow is strings.Builder.Grow (with the same panic value).
            func (b *__dd_iast_pb) Grow(n int) {
              if n < 0 {
                panic("strings.Builder.Grow: negative count")
              }
              if cap(b.buf)-len(b.buf) < n {
                b.grow(n)
              }
            }

            func (b *__dd_iast_pb) WriteString(s string) {
              b.buf = append(b.buf, s...)
            }

            func (b *__dd_iast_pb) WriteByte(c byte) {
              b.buf = append(b.buf, c)
            }

            func (b *__dd_iast_pb) Len() int {
              return len(b.buf)
            }

            func (b *__dd_iast_pb) String() string {
              return unsafe.String(unsafe.SliceData(b.buf), len(b.buf))
            }

            // ---- string helpers ----

            // __dd_iast_ptr returns the address of the data of s.
            func __dd_iast_ptr(s string) unsafe.Pointer {
              return unsafe.Pointer(unsafe.StringData(s))
            }

            // __dd_iast_within reports whether the memory of part is inside
            // the memory of whole.
            func __dd_iast_within(part, whole string) bool {
              p, w := uintptr(__dd_iast_ptr(part)), uintptr(__dd_iast_ptr(whole))
              return len(whole) > 0 && p >= w && p+uintptr(len(part)) <= w+uintptr(len(whole))
            }

            // __dd_iast_clean returns a copy of s in new memory without taint
            // bits (make and copy do not copy the bits; the clear is a guard:
            // the inner call of a clean copy twin must see no taint, else it
            // calls its twin again).
            func __dd_iast_clean(s string) string {
              b := make([]byte, len(s))
              copy(b, s)
              __dd_iast_clearb(b)
              return unsafe.String(unsafe.SliceData(b), len(b))
            }

            // __dd_iast_remap changes a result r of a call on c (the clean
            // copy of s) that is a part of c into the same part of s.
            func __dd_iast_remap(r, c, s string) string {
              if __dd_iast_within(r, c) {
                off := int(uintptr(__dd_iast_ptr(r)) - uintptr(__dd_iast_ptr(c)))
                return s[off : off+len(r)]
              }
              return r
            }

            // __dd_iast_coarse applies the coarse rule: when out is new
            // memory (not a part of in), it taints all of out and records a
            // coarse derived entry with the source of in.
            func __dd_iast_coarse(out, in string) {
              if len(out) == 0 || __dd_iast_within(out, in) || !__dd_iast_set(__dd_iast_ptr(out), len(out)) {
                return
              }
              __dd_iast_derived(uintptr(__dd_iast_ptr(out)), uintptr(len(out)), uintptr(__dd_iast_ptr(in)), uintptr(len(in)), __dd_iast_mode_coarse)
              runtime.KeepAlive(__dd_iast_ptr(out))
              runtime.KeepAlive(__dd_iast_ptr(in))
            }

            // __dd_iast_positional copies the bits of in to out (new memory,
            // same length) and records a positional derived entry.
            func __dd_iast_positional(out, in string) {
              if len(out) == 0 || len(out) != len(in) || !__dd_iast_copyp(__dd_iast_ptr(out), __dd_iast_ptr(in), len(in)) {
                return
              }
              __dd_iast_derived(uintptr(__dd_iast_ptr(out)), uintptr(len(out)), uintptr(__dd_iast_ptr(in)), uintptr(len(in)), __dd_iast_mode_positional)
              runtime.KeepAlive(__dd_iast_ptr(out))
              runtime.KeepAlive(__dd_iast_ptr(in))
            }

            func __dd_iast_clone(s string) (string, bool) {
              if !__dd_iast_anys(s) {
                return "", false
              }
              r := stringslite.Clone(s)
              __dd_iast_copyp(__dd_iast_ptr(r), __dd_iast_ptr(s), len(s))
              return r, true
            }
      - prepend-statements:
          template: |-
            {{- $s := .Function.Argument 0 -}}
            if __dd_iast_live() {
              if __dd_iast_r, __dd_iast_ok := __dd_iast_clone({{ $s }}); __dd_iast_ok {
                return __dd_iast_r
              }
            }

  - id: strings.Join
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - name: Join
              - receiver: false
    advice:
      - inject-declarations:
          imports:
            runtime: runtime
            unsafe: unsafe
          template: |-
            // __dd_iast_rt_anystrs is the Any of the data of the n strings at
            // p (the data of a []string), in one call. The aspects of
            // iast/runtime push it (nil when they are not woven: then
            // __dd_iast_join_tainted does one Any for each string). The
            // arguments are uintptr values: a []string given to a func value
            // escapes, and elems must not escape. The function is nosplit:
            // the stack does not move during the call, thus p stays correct
            // when elems is in stack memory. runtime.KeepAlive keeps elems
            // alive until the end of the call. The function cannot be
            // preempted, thus it scans at most __dd_iast_join_batch strings in
            // one call (it returns true for more strings).
            //
            //go:linkname __dd_iast_rt_anystrs __dd_iast_runtime.anystrsptr
            var __dd_iast_rt_anystrs func(p, n uintptr) bool

            // __dd_iast_join_batch is the number of elements for one call of
            // __dd_iast_rt_anystrs. It is __dd_iast_anystrsBatch of the
            // aspects of iast/runtime.
            const __dd_iast_join_batch = 256

            // __dd_iast_join_tainted reports whether an input of Join that the
            // body copies is tainted. For 0 or 1 element, the body copies
            // nothing (it returns "" or elems[0]). It gives the elements to
            // __dd_iast_rt_anystrs in batches: between two calls, the
            // goroutine can be preempted (this function is not nosplit).
            //
            // The check occurs one time, before the plain twin copies the
            // inputs. When a different goroutine taints (in place) an input
            // after the check and before the copy, the result does not get
            // this taint. This is an accepted limit: the original body, with
            // the hooked Builder.WriteString, has the same window between
            // its check and its copy, only shorter.
            func __dd_iast_join_tainted(elems []string, sep string) bool {
              if len(elems) < 2 {
                return false
              }
              if __dd_iast_anys(sep) {
                return true
              }
              if f := __dd_iast_rt_anystrs; f != nil {
                for len(elems) > 0 {
                  n := min(len(elems), __dd_iast_join_batch)
                  p := unsafe.SliceData(elems)
                  ok := f(uintptr(unsafe.Pointer(p)), uintptr(n))
                  runtime.KeepAlive(p)
                  if ok {
                    return true
                  }
                  elems = elems[n:]
                }
                return false
              }
              for _, e := range elems {
                if __dd_iast_anys(e) {
                  return true
                }
              }
              return false
            }

            // __dd_iast_join_plain is the body of Join with __dd_iast_pb
            // (rule 5 of the header). Keep it the same as the body.
            func __dd_iast_join_plain(elems []string, sep string) string {
              switch len(elems) {
              case 0:
                return ""
              case 1:
                return elems[0]
              }
              var n int
              if len(sep) > 0 {
                if len(sep) >= maxInt/(len(elems)-1) {
                  panic("strings: Join output length overflow")
                }
                n += len(sep) * (len(elems) - 1)
              }
              for _, elem := range elems {
                if len(elem) > maxInt-n {
                  panic("strings: Join output length overflow")
                }
                n += len(elem)
              }
              var b __dd_iast_pb
              b.Grow(n)
              b.WriteString(elems[0])
              for _, s := range elems[1:] {
                b.WriteString(sep)
                b.WriteString(s)
              }
              return b.String()
            }
      - prepend-statements:
          template: |-
            {{- $elems := .Function.Argument 0 -}}
            {{- $sep := .Function.Argument 1 -}}
            if !__dd_iast_live() || !__dd_iast_join_tainted({{ $elems }}, {{ $sep }}) {
              return __dd_iast_join_plain({{ $elems }}, {{ $sep }})
            }

  - id: strings.Replace
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - name: Replace
              - receiver: false # not the Replace methods of the replacers
    advice:
      - inject-declarations:
          imports:
            utf8: unicode/utf8
          template: |-
            // __dd_iast_replace_plain is the body of Replace with
            // __dd_iast_pb (rule 5 of the header). Keep it the same as the
            // body. The output has only parts of s and copies of new: the
            // hook checks only these 2 inputs.
            // The hook checks the inputs one time, before the copy. A taint
            // that a different goroutine adds (in place) to an input after the
            // check is not in the output: an accepted limit (rule 5 of the
            // header).
            func __dd_iast_replace_plain(s, old, new string, n int) string {
              if old == new || n == 0 {
                return s
              }
              if m := Count(s, old); m == 0 {
                return s
              } else if n < 0 || m < n {
                n = m
              }
              var b __dd_iast_pb
              b.Grow(len(s) + n*(len(new)-len(old)))
              start := 0
              if len(old) > 0 {
                for range n {
                  j := start + Index(s[start:], old)
                  b.WriteString(s[start:j])
                  b.WriteString(new)
                  start = j + len(old)
                }
              } else {
                b.WriteString(new)
                for range n - 1 {
                  _, wid := utf8.DecodeRuneInString(s[start:])
                  j := start + wid
                  b.WriteString(s[start:j])
                  b.WriteString(new)
                  start = j
                }
              }
              b.WriteString(s[start:])
              return b.String()
            }
      - prepend-statements:
          template: |-
            {{- $s := .Function.Argument 0 -}}
            {{- $old := .Function.Argument 1 -}}
            {{- $new := .Function.Argument 2 -}}
            {{- $n := .Function.Argument 3 -}}
            if !__dd_iast_live() || !(__dd_iast_anys({{ $s }}) || __dd_iast_anys({{ $new }})) {
              return __dd_iast_replace_plain({{ $s }}, {{ $old }}, {{ $new }}, {{ $n }})
            }

  - id: strings.Builder.Write
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - receiver: "*strings.Builder"
              - name: Write
    advice:
      - inject-declarations:
          imports:
            unsafe: unsafe
          template: |-
            // The Builder never writes into memory that it gave out (Reset sets
            // the buffer to nil): the destination has no old bits.
            func __dd_iast_builder_write(b *Builder, p []byte) bool {
              if !__dd_iast_anyb(p) {
                return false
              }
              b.copyCheck()
              n := len(b.buf)
              b.buf = append(b.buf, p...)
              __dd_iast_copyp(unsafe.Pointer(&b.buf[n]), unsafe.Pointer(unsafe.SliceData(p)), len(p))
              return true
            }
      - prepend-statements:
          template: |-
            {{- $b := .Function.Receiver -}}
            {{- $p := .Function.Argument 0 -}}
            if __dd_iast_live() {
              if __dd_iast_builder_write({{ $b }}, {{ $p }}) {
                return len({{ $p }}), nil
              }
            }

  - id: strings.Builder.WriteString
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - receiver: "*strings.Builder"
              - name: WriteString
    advice:
      - inject-declarations:
          imports:
            unsafe: unsafe
          template: |-
            func __dd_iast_builder_writestring(b *Builder, s string) bool {
              if !__dd_iast_anys(s) {
                return false
              }
              b.copyCheck()
              n := len(b.buf)
              b.buf = append(b.buf, s...)
              __dd_iast_copyp(unsafe.Pointer(&b.buf[n]), unsafe.Pointer(unsafe.StringData(s)), len(s))
              return true
            }
      - prepend-statements:
          template: |-
            {{- $b := .Function.Receiver -}}
            {{- $s := .Function.Argument 0 -}}
            if __dd_iast_live() {
              if __dd_iast_builder_writestring({{ $b }}, {{ $s }}) {
                return len({{ $s }}), nil
              }
            }

  - id: strings.Builder.grow
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - receiver: "*strings.Builder"
              - name: grow
    advice:
      - inject-declarations:
          imports:
            bytealg: internal/bytealg
            unsafe: unsafe
          template: |-
            func __dd_iast_builder_grow(b *Builder, n int) bool {
              if !__dd_iast_anyb(b.buf) {
                return false
              }
              buf := bytealg.MakeNoZero(2*cap(b.buf) + n)[:len(b.buf)]
              copy(buf, b.buf)
              __dd_iast_copyp(unsafe.Pointer(unsafe.SliceData(buf)), unsafe.Pointer(unsafe.SliceData(b.buf)), len(b.buf))
              b.buf = buf
              return true
            }
      - prepend-statements:
          template: |-
            {{- $b := .Function.Receiver -}}
            {{- $n := .Function.Argument 0 -}}
            if __dd_iast_live() {
              if __dd_iast_builder_grow({{ $b }}, {{ $n }}) {
                return
              }
            }

  - id: strings.Repeat
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - name: Repeat
    advice:
      - inject-declarations:
          imports:
            bits: math/bits
          template: |-
            // __dd_iast_repeat_plain is the body of Repeat with __dd_iast_pb
            // (rule 5 of the header). Keep it the same as the body.
            // The hook checks the inputs one time, before the copy. A taint
            // that a different goroutine adds (in place) to an input after the
            // check is not in the output: an accepted limit (rule 5 of the
            // header).
            func __dd_iast_repeat_plain(s string, count int) string {
              switch count {
              case 0:
                return ""
              case 1:
                return s
              }
              if count < 0 {
                panic("strings: negative Repeat count")
              }
              hi, lo := bits.Mul(uint(len(s)), uint(count))
              if hi > 0 || lo > uint(maxInt) {
                panic("strings: Repeat output length overflow")
              }
              n := int(lo)
              if len(s) == 0 {
                return ""
              }
              switch s[0] {
              case ' ', '-', '0', '=', '\t':
                switch {
                case n <= len(repeatedSpaces) && HasPrefix(repeatedSpaces, s):
                  return repeatedSpaces[:n]
                case n <= len(repeatedDashes) && HasPrefix(repeatedDashes, s):
                  return repeatedDashes[:n]
                case n <= len(repeatedZeroes) && HasPrefix(repeatedZeroes, s):
                  return repeatedZeroes[:n]
                case n <= len(repeatedEquals) && HasPrefix(repeatedEquals, s):
                  return repeatedEquals[:n]
                case n <= len(repeatedTabs) && HasPrefix(repeatedTabs, s):
                  return repeatedTabs[:n]
                }
              }
              const chunkLimit = 8 * 1024
              chunkMax := n
              if n > chunkLimit {
                chunkMax = chunkLimit / len(s) * len(s)
                if chunkMax == 0 {
                  chunkMax = len(s)
                }
              }
