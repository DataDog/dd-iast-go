---
# $schema: https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-iast-go/iast/propagation/text
  description: >-
    Taint propagation hooks in the standard library packages strings, bytes,
    strconv and net/url. The hooks copy (or set) the heap taint bits of
    internal/taint/heapbits where the standard library copies bytes with copy
    or with the appended part of append, which the runtime hooks of
    iast/runtime cannot see.

# How the hooks work (plan heapbits-sqli-cmdi, section 6.1):
#
#  1. Each hooked function starts with "if __dd_iast_live() { ... }". Live is
#     2 loads and no call (it is inlined). When it is false, no byte of the
#     heap is tainted, and the original body runs.
#  2. Else the prepended code calls the twin __dd_iast_<fn>, an injected
#     function of the same package. The twin checks the taint of the inputs
#     (Any of the heap bits). When no input is tainted, it returns false and the
#     original body runs. Else it does the work of the body again with the bit
#     operations, and returns true with the results. A few twins always do
#     the work (the bytes.Buffer writes: their gate is "the source or the
#     destination is tainted", and the destination is known only after the
#     growth of the buffer).
#  3. Exact copies (Builder and Buffer writes, Clone, Join, Repeat, Replace,
#     bytes.ToValidUTF8) copy the bits with heapbits.Copy. The positional
#     transforms (ASCII ToUpper and ToLower) copy the bits and record a
#     positional derived entry (propbridge.Derived). The coarse transforms
#     (Map, strings.ToValidUTF8, Replacer.Replace, quote, unquote, URL escape
#     and unescape) set the bits of the whole output and record a coarse
#     derived entry (plan section 6.3).
#  4. Some coarse twins ("clean copy" twins: strings.Map,
#     strings.ToValidUTF8, strconv.unquote, url.escape, url.unescape) do not
#     repeat the body: they call the hooked function again on a copy of the
#     input without taint bits (make and copy do not copy the bits, and the
#     twin also clears them). The inner call sees no taint, so its twin
#     returns false and the original body runs (one time, so application
#     callbacks also run one time). Then the twin changes each result that is
#     a part of the copy into the same part of the original input (the
#     original body returns parts of its input; they keep their exact bits),
#     and applies the coarse rule to a new output.
#
# Rules:
#
#  - The hook code imports only internal/taint/heapbits and
#    internal/taint/propbridge (and packages that the hooked package already
#    imports, or that the runtime imports). Never hook a package that the
#    runtime imports (internal/stringslite, internal/bytealg).
#  - No defer, no recover, no lock in a twin. A twin panics only where the
#    original body panics, with the same value.
#  - A twin passes uintptr values to propbridge only for memory that it keeps
#    alive with runtime.KeepAlive until the call returns.
#  - strconv.appendQuotedWith is not hooked: fmt passes its scratch array to
#    it (plan section 6.3).
#  - The bodies that the twins repeat or depend on are in the drift golden
#    files (testdata/stdlib-*.golden, TestStdlibDrift).
#  - The number of aspects is instrumentedPropagationPoints in doc.go
#    (TestAspectCount).

aspects:
  # ---------------------------------------------------------------- strings

  - id: strings.Clone
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - name: Clone
    advice:
      - inject-declarations:
          imports:
            atomic: sync/atomic
            runtime: runtime
            unsafe: unsafe
            stringslite: internal/stringslite
          template: |-
            // ---- bit functions (plan section 6.1 rule 1) ----
            //
            // The hooks do not import packages heapbits and propbridge: go test
            // of a package with in-package tests rebuilds the standard library
            // packages that import it, and Orchestrion cannot rebuild them (a
            // fingerprint cycle through reflect). Thus the hooks pull the bit
            // functions of the woven runtime with the linknames of package
            // heapbits (nil without weaving: then nothing is tainted), and
            // propbridge.Derived with the pull linkname of a variable that
            // propbridge pushes (nil when propbridge is not linked: then no
            // derived entry is needed, no analysis can read it).
            var (
              //go:linkname __dd_iast_rt_set __dd_iast_heapbits.set
              __dd_iast_rt_set func(p, n uintptr) bool

              //go:linkname __dd_iast_rt_clear __dd_iast_heapbits.clear
              __dd_iast_rt_clear func(p, n uintptr)

              //go:linkname __dd_iast_rt_any __dd_iast_heapbits.any
              __dd_iast_rt_any func(p, n uintptr) bool

              //go:linkname __dd_iast_rt_copy __dd_iast_heapbits.copy
              __dd_iast_rt_copy func(dst, src, n uintptr) bool

              //go:linkname __dd_iast_rt_seen __dd_iast_heapbits.seen
              __dd_iast_rt_seen *uint32
            )

            // Modes of propbridge.Derived (TestBridgeModes checks the values).
            const (
              __dd_iast_mode_coarse     uint8 = 1
              __dd_iast_mode_positional uint8 = 2
            )

            // __dd_iast_rt_derived is propbridge.Derived (pushed by package
            // propbridge; nil when it is not linked).
            //
            //go:linkname __dd_iast_rt_derived __dd_iast_propbridge.derived
            var __dd_iast_rt_derived func(out, outLen, in, inLen uintptr, mode uint8)

            func __dd_iast_derived(out, outLen, in, inLen uintptr, mode uint8) {
              if f := __dd_iast_rt_derived; f != nil {
                f(out, outLen, in, inLen, mode)
              }
            }

            // __dd_iast_live is heapbits.Live: 2 loads, no call (inlinable).
            func __dd_iast_live() bool {
              p := __dd_iast_rt_seen
              return p != nil && atomic.LoadUint32(p) != 0
            }

            // The bit functions below are heapbits.Any, Set, Clear and Copy.
            // They are not inlined (as in package heapbits): their stack check
            // is a preemption point.

            //go:noinline
            func __dd_iast_any(p unsafe.Pointer, n int) bool {
              f := __dd_iast_rt_any
              if f == nil || n <= 0 {
                return false
              }
              ok := f(uintptr(p), uintptr(n))
              runtime.KeepAlive(p)
              return ok
            }

            //go:noinline
            func __dd_iast_set(p unsafe.Pointer, n int) bool {
              f := __dd_iast_rt_set
              if f == nil || n <= 0 {
                return false
              }
              ok := f(uintptr(p), uintptr(n))
              runtime.KeepAlive(p)
              return ok
            }

            //go:noinline
            func __dd_iast_clear(p unsafe.Pointer, n int) {
              f := __dd_iast_rt_clear
              if f == nil || n <= 0 {
                return
              }
              f(uintptr(p), uintptr(n))
              runtime.KeepAlive(p)
            }

            //go:noinline
            func __dd_iast_copyp(dst, src unsafe.Pointer, n int) bool {
              f := __dd_iast_rt_copy
              if f == nil || n <= 0 {
                return false
              }
              ok := f(uintptr(dst), uintptr(src), uintptr(n))
              runtime.KeepAlive(dst)
              runtime.KeepAlive(src)
              return ok
            }

            func __dd_iast_anys(s string) bool {
              return __dd_iast_any(unsafe.Pointer(unsafe.StringData(s)), len(s))
            }

            func __dd_iast_anyb(b []byte) bool {
              return __dd_iast_any(unsafe.Pointer(unsafe.SliceData(b)), len(b))
            }

            func __dd_iast_clearb(b []byte) {
              __dd_iast_clear(unsafe.Pointer(unsafe.SliceData(b)), len(b))
            }

            // ---- string helpers ----

            // __dd_iast_ptr returns the address of the data of s.
            func __dd_iast_ptr(s string) unsafe.Pointer {
              return unsafe.Pointer(unsafe.StringData(s))
            }

            // __dd_iast_within reports whether the memory of part is inside
            // the memory of whole.
            func __dd_iast_within(part, whole string) bool {
              p, w := uintptr(__dd_iast_ptr(part)), uintptr(__dd_iast_ptr(whole))
              return len(whole) > 0 && p >= w && p+uintptr(len(part)) <= w+uintptr(len(whole))
            }

            // __dd_iast_clean returns a copy of s in new memory without taint
            // bits (make and copy do not copy the bits; the clear is a guard:
            // the inner call of a clean copy twin must see no taint, else it
            // calls its twin again).
            func __dd_iast_clean(s string) string {
              b := make([]byte, len(s))
              copy(b, s)
              __dd_iast_clearb(b)
              return unsafe.String(unsafe.SliceData(b), len(b))
            }

            // __dd_iast_remap changes a result r of a call on c (the clean
            // copy of s) that is a part of c into the same part of s.
            func __dd_iast_remap(r, c, s string) string {
              if __dd_iast_within(r, c) {
                off := int(uintptr(__dd_iast_ptr(r)) - uintptr(__dd_iast_ptr(c)))
                return s[off : off+len(r)]
              }
              return r
            }

            // __dd_iast_coarse applies the coarse rule: when out is new
            // memory (not a part of in), it taints all of out and records a
            // coarse derived entry with the source of in.
            func __dd_iast_coarse(out, in string) {
              if len(out) == 0 || __dd_iast_within(out, in) || !__dd_iast_set(__dd_iast_ptr(out), len(out)) {
                return
              }
              __dd_iast_derived(uintptr(__dd_iast_ptr(out)), uintptr(len(out)), uintptr(__dd_iast_ptr(in)), uintptr(len(in)), __dd_iast_mode_coarse)
              runtime.KeepAlive(__dd_iast_ptr(out))
              runtime.KeepAlive(__dd_iast_ptr(in))
            }

            // __dd_iast_positional copies the bits of in to out (new memory,
            // same length) and records a positional derived entry.
            func __dd_iast_positional(out, in string) {
              if len(out) == 0 || len(out) != len(in) || !__dd_iast_copyp(__dd_iast_ptr(out), __dd_iast_ptr(in), len(in)) {
                return
              }
              __dd_iast_derived(uintptr(__dd_iast_ptr(out)), uintptr(len(out)), uintptr(__dd_iast_ptr(in)), uintptr(len(in)), __dd_iast_mode_positional)
              runtime.KeepAlive(__dd_iast_ptr(out))
              runtime.KeepAlive(__dd_iast_ptr(in))
            }

            func __dd_iast_clone(s string) (string, bool) {
              if !__dd_iast_anys(s) {
                return "", false
              }
              r := stringslite.Clone(s)
              __dd_iast_copyp(__dd_iast_ptr(r), __dd_iast_ptr(s), len(s))
              return r, true
            }
      - prepend-statements:
          template: |-
            {{- $s := .Function.Argument 0 -}}
            if __dd_iast_live() {
              if __dd_iast_r, __dd_iast_ok := __dd_iast_clone({{ $s }}); __dd_iast_ok {
                return __dd_iast_r
              }
            }

  - id: strings.Builder.Write
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - receiver: "*strings.Builder"
              - name: Write
    advice:
      - inject-declarations:
          imports:
            unsafe: unsafe
          template: |-
            // The Builder never writes into memory that it gave out (Reset sets
            // the buffer to nil): the destination has no old bits.
            func __dd_iast_builder_write(b *Builder, p []byte) bool {
              if !__dd_iast_anyb(p) {
                return false
              }
              b.copyCheck()
              n := len(b.buf)
              b.buf = append(b.buf, p...)
              __dd_iast_copyp(unsafe.Pointer(&b.buf[n]), unsafe.Pointer(unsafe.SliceData(p)), len(p))
              return true
            }
      - prepend-statements:
          template: |-
            {{- $b := .Function.Receiver -}}
            {{- $p := .Function.Argument 0 -}}
            if __dd_iast_live() {
              if __dd_iast_builder_write({{ $b }}, {{ $p }}) {
                return len({{ $p }}), nil
              }
            }

  - id: strings.Builder.WriteString
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - receiver: "*strings.Builder"
              - name: WriteString
    advice:
      - inject-declarations:
          imports:
            unsafe: unsafe
          template: |-
            func __dd_iast_builder_writestring(b *Builder, s string) bool {
              if !__dd_iast_anys(s) {
                return false
              }
              b.copyCheck()
              n := len(b.buf)
              b.buf = append(b.buf, s...)
              __dd_iast_copyp(unsafe.Pointer(&b.buf[n]), unsafe.Pointer(unsafe.StringData(s)), len(s))
              return true
            }
      - prepend-statements:
          template: |-
            {{- $b := .Function.Receiver -}}
            {{- $s := .Function.Argument 0 -}}
            if __dd_iast_live() {
              if __dd_iast_builder_writestring({{ $b }}, {{ $s }}) {
                return len({{ $s }}), nil
              }
            }

  - id: strings.Builder.grow
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - receiver: "*strings.Builder"
              - name: grow
    advice:
      - inject-declarations:
          imports:
            bytealg: internal/bytealg
            unsafe: unsafe
          template: |-
            func __dd_iast_builder_grow(b *Builder, n int) bool {
              if !__dd_iast_anyb(b.buf) {
                return false
              }
              buf := bytealg.MakeNoZero(2*cap(b.buf) + n)[:len(b.buf)]
              copy(buf, b.buf)
              __dd_iast_copyp(unsafe.Pointer(unsafe.SliceData(buf)), unsafe.Pointer(unsafe.SliceData(b.buf)), len(b.buf))
              b.buf = buf
              return true
            }
      - prepend-statements:
          template: |-
            {{- $b := .Function.Receiver -}}
            {{- $n := .Function.Argument 0 -}}
            if __dd_iast_live() {
              if __dd_iast_builder_grow({{ $b }}, {{ $n }}) {
                return
              }
            }

  - id: strings.Repeat
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - name: Repeat
    advice:
      - inject-declarations:
          imports:
            bits: math/bits
          template: |-
            // __dd_iast_repeat does only the case of the read-only fast path
            // (a result of at most 128 bytes from a constant): for a tainted
            // s, it builds the result with the Builder, whose hooks copy the
            // bits. In all other cases, the original body runs (its Builder
            // also copies the bits).
            func __dd_iast_repeat(s string, count int) (string, bool) {
              if count < 2 || len(s) == 0 || !__dd_iast_anys(s) {
                return "", false
              }
              switch s[0] {
              case ' ', '-', '0', '=', '\t':
              default:
                return "", false
              }
              hi, lo := bits.Mul(uint(len(s)), uint(count))
              if hi > 0 || lo > 128 {
                return "", false
              }
              n := int(lo)
              var b Builder
              b.Grow(n)
              b.WriteString(s)
              for b.Len() < n {
                chunk := min(n-b.Len(), b.Len())
                b.WriteString(b.String()[:chunk])
              }
              return b.String(), true
            }
      - prepend-statements:
          template: |-
            {{- $s := .Function.Argument 0 -}}
            {{- $count := .Function.Argument 1 -}}
            if __dd_iast_live() {
              if __dd_iast_r, __dd_iast_ok := __dd_iast_repeat({{ $s }}, {{ $count }}); __dd_iast_ok {
                return __dd_iast_r
              }
            }

  - id: strings.ToUpper
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - name: ToUpper
    advice:
      - inject-declarations:
          imports:
            unsafe: unsafe
            utf8: unicode/utf8
          template: |-
            // __dd_iast_toupper does the ASCII path that changes bytes
            // (positional). The other paths run the original body: no change
            // returns s; non-ASCII calls Map (hooked: coarse).
            func __dd_iast_toupper(s string) (string, bool) {
              if !__dd_iast_anys(s) {
                return "", false
              }
              hasLower := false
              for i := 0; i < len(s); i++ {
                c := s[i]
                if c >= utf8.RuneSelf {
                  return "", false
                }
                hasLower = hasLower || ('a' <= c && c <= 'z')
              }
              if !hasLower {
                return "", false
              }
              b := make([]byte, len(s))
              for i := 0; i < len(s); i++ {
                c := s[i]
                if 'a' <= c && c <= 'z' {
                  c -= 'a' - 'A'
                }
                b[i] = c
              }
              out := unsafe.String(unsafe.SliceData(b), len(b))
              __dd_iast_positional(out, s)
              return out, true
            }
      - prepend-statements:
          template: |-
            {{- $s := .Function.Argument 0 -}}
            if __dd_iast_live() {
              if __dd_iast_r, __dd_iast_ok := __dd_iast_toupper({{ $s }}); __dd_iast_ok {
                return __dd_iast_r
              }
            }

  - id: strings.ToLower
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - name: ToLower
    advice:
      - inject-declarations:
          imports:
            unsafe: unsafe
            utf8: unicode/utf8
          template: |-
            // __dd_iast_tolower: see __dd_iast_toupper.
            func __dd_iast_tolower(s string) (string, bool) {
              if !__dd_iast_anys(s) {
                return "", false
              }
              hasUpper := false
              for i := 0; i < len(s); i++ {
                c := s[i]
                if c >= utf8.RuneSelf {
                  return "", false
                }
                hasUpper = hasUpper || ('A' <= c && c <= 'Z')
              }
              if !hasUpper {
                return "", false
              }
              b := make([]byte, len(s))
              for i := 0; i < len(s); i++ {
                c := s[i]
                if 'A' <= c && c <= 'Z' {
                  c += 'a' - 'A'
                }
                b[i] = c
              }
              out := unsafe.String(unsafe.SliceData(b), len(b))
              __dd_iast_positional(out, s)
              return out, true
            }
      - prepend-statements:
          template: |-
            {{- $s := .Function.Argument 0 -}}
            if __dd_iast_live() {
              if __dd_iast_r, __dd_iast_ok := __dd_iast_tolower({{ $s }}); __dd_iast_ok {
                return __dd_iast_r
              }
            }

  - id: strings.Map
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - name: Map
    advice:
      - inject-declarations:
          template: |-
            // __dd_iast_map is a clean copy twin (coarse).
            // The inner call goes through a body-less //go:noescape alias of
            // the hooked function: a direct call makes a recursive cycle, and
            // the escape analysis of a cycle leaks the parameters to the
            // heap (the escape tags of the hooked function would change). The
            // declaration is correct for the parameters of the application
            // (the original does not keep them); a result can be a part of
            // the clean copy, which is heap memory.
            //
            //go:linkname __dd_iast_orig_map strings.Map
            //go:noescape
            func __dd_iast_orig_map(mapping func(rune) rune, s string) string

            func __dd_iast_map(mapping func(rune) rune, s string) (string, bool) {
              if !__dd_iast_anys(s) {
                return "", false
              }
              c := __dd_iast_clean(s)
              out := __dd_iast_remap(__dd_iast_orig_map(mapping, c), c, s)
              __dd_iast_coarse(out, s)
              return out, true
            }
      - prepend-statements:
          template: |-
            {{- $mapping := .Function.Argument 0 -}}
            {{- $s := .Function.Argument 1 -}}
            if __dd_iast_live() {
              if __dd_iast_r, __dd_iast_ok := __dd_iast_map({{ $mapping }}, {{ $s }}); __dd_iast_ok {
                return __dd_iast_r
              }
            }

  - id: strings.ToValidUTF8
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - name: ToValidUTF8
    advice:
      - inject-declarations:
          template: |-
            // __dd_iast_tovalidutf8 is a clean copy twin (coarse, plan section
            // 6.3). A tainted replacement alone keeps its exact bits (Builder
            // hooks).
            //
            // See __dd_iast_orig_map.
            //
            //go:linkname __dd_iast_orig_tovalidutf8 strings.ToValidUTF8
            //go:noescape
            func __dd_iast_orig_tovalidutf8(s, replacement string) string

            func __dd_iast_tovalidutf8(s, replacement string) (string, bool) {
              if !__dd_iast_anys(s) {
                return "", false
              }
              c := __dd_iast_clean(s)
              out := __dd_iast_remap(__dd_iast_orig_tovalidutf8(c, replacement), c, s)
              __dd_iast_coarse(out, s)
              return out, true
            }
      - prepend-statements:
          template: |-
            {{- $s := .Function.Argument 0 -}}
            {{- $replacement := .Function.Argument 1 -}}
            if __dd_iast_live() {
              if __dd_iast_r, __dd_iast_ok := __dd_iast_tovalidutf8({{ $s }}, {{ $replacement }}); __dd_iast_ok {
                return __dd_iast_r
              }
            }

  - id: strings.Replacer.Replace
    join-point:
      all-of:
        - import-path: strings
        - function-body:
            function:
              - receiver: "*strings.Replacer"
              - name: Replace
    advice:
      - inject-declarations:
          template: |-
            // __dd_iast_replacer_replace repeats the body (the inner replacers
            // are not hooked) and applies the coarse rule.
            func __dd_iast_replacer_replace(r *Replacer, s string) (string, bool) {
              if !__dd_iast_anys(s) {
                return "", false
              }
              r.once.Do(r.buildOnce)
              out := r.r.Replace(s)
              __dd_iast_coarse(out, s)
              return out, true
            }
      - prepend-statements:
          template: |-
            {{- $r := .Function.Receiver -}}
            {{- $s := .Function.Argument 0 -}}
            if __dd_iast_live() {
              if __dd_iast_out, __dd_iast_ok := __dd_iast_replacer_replace({{ $r }}, {{ $s }}); __dd_iast_ok {
                return __dd_iast_out
              }
            }

  # ------------------------------------------------------------------ bytes

  - id: bytes.Clone
    join-point:
      all-of:
        - import-path: bytes
        - function-body:
            function:
              - name: Clone
    advice:
      - inject-declarations:
          imports:
            atomic: sync/atomic
            runtime: runtime
            unsafe: unsafe
          template: |-
            // ---- bit functions (plan section 6.1 rule 1) ----
            //
            // The hooks do not import packages heapbits and propbridge: go test
            // of a package with in-package tests rebuilds the standard library
            // packages that import it, and Orchestrion cannot rebuild them (a
            // fingerprint cycle through reflect). Thus the hooks pull the bit
            // functions of the woven runtime with the linknames of package
            // heapbits (nil without weaving: then nothing is tainted), and
            // propbridge.Derived with the pull linkname of a variable that
            // propbridge pushes (nil when propbridge is not linked: then no
            // derived entry is needed, no analysis can read it).
            var (
              //go:linkname __dd_iast_rt_set __dd_iast_heapbits.set
              __dd_iast_rt_set func(p, n uintptr) bool

              //go:linkname __dd_iast_rt_clear __dd_iast_heapbits.clear
              __dd_iast_rt_clear func(p, n uintptr)

              //go:linkname __dd_iast_rt_any __dd_iast_heapbits.any
              __dd_iast_rt_any func(p, n uintptr) bool

              //go:linkname __dd_iast_rt_copy __dd_iast_heapbits.copy
              __dd_iast_rt_copy func(dst, src, n uintptr) bool

              //go:linkname __dd_iast_rt_seen __dd_iast_heapbits.seen
              __dd_iast_rt_seen *uint32
            )

            // Modes of propbridge.Derived (TestBridgeModes checks the values).
            const (
              __dd_iast_mode_coarse     uint8 = 1
              __dd_iast_mode_positional uint8 = 2
            )

            // __dd_iast_rt_derived is propbridge.Derived (pushed by package
            // propbridge; nil when it is not linked).
            //
            //go:linkname __dd_iast_rt_derived __dd_iast_propbridge.derived
            var __dd_iast_rt_derived func(out, outLen, in, inLen uintptr, mode uint8)

            func __dd_iast_derived(out, outLen, in, inLen uintptr, mode uint8) {
              if f := __dd_iast_rt_derived; f != nil {
                f(out, outLen, in, inLen, mode)
              }
            }

            // __dd_iast_live is heapbits.Live: 2 loads, no call (inlinable).
            func __dd_iast_live() bool {
              p := __dd_iast_rt_seen
              return p != nil && atomic.LoadUint32(p) != 0
            }

            // The bit functions below are heapbits.Any, Set, Clear and Copy.
            // They are not inlined (as in package heapbits): their stack check
            // is a preemption point.

            //go:noinline
            func __dd_iast_any(p unsafe.Pointer, n int) bool {
              f := __dd_iast_rt_any
              if f == nil || n <= 0 {
                return false
              }
              ok := f(uintptr(p), uintptr(n))
              runtime.KeepAlive(p)
              return ok
            }

            //go:noinline
            func __dd_iast_set(p unsafe.Pointer, n int) bool {
              f := __dd_iast_rt_set
              if f == nil || n <= 0 {
                return false
              }
              ok := f(uintptr(p), uintptr(n))
              runtime.KeepAlive(p)
              return ok
            }

            //go:noinline
            func __dd_iast_clear(p unsafe.Pointer, n int) {
              f := __dd_iast_rt_clear
              if f == nil || n <= 0 {
                return
              }
              f(uintptr(p), uintptr(n))
              runtime.KeepAlive(p)
            }

            //go:noinline
            func __dd_iast_copyp(dst, src unsafe.Pointer, n int) bool {
              f := __dd_iast_rt_copy
              if f == nil || n <= 0 {
                return false
              }
              ok := f(uintptr(dst), uintptr(src), uintptr(n))
              runtime.KeepAlive(dst)
              runtime.KeepAlive(src)
              return ok
            }

            func __dd_iast_anys(s string) bool {
              return __dd_iast_any(unsafe.Pointer(unsafe.StringData(s)), len(s))
            }

            func __dd_iast_anyb(b []byte) bool {
              return __dd_iast_any(unsafe.Pointer(unsafe.SliceData(b)), len(b))
            }

            func __dd_iast_clearb(b []byte) {
              __dd_iast_clear(unsafe.Pointer(unsafe.SliceData(b)), len(b))
            }

            // ---- byte slice helpers ----

            // __dd_iast_ptr returns the address of the data of b.
            func __dd_iast_ptr(b []byte) unsafe.Pointer {
              return unsafe.Pointer(unsafe.SliceData(b))
            }

            // __dd_iast_copy copies the bits of src to dst (same length) when
            // src is tainted. dst is new memory (no old bits).
            func __dd_iast_copy(dst, src []byte) {
              if __dd_iast_anyb(src) {
                __dd_iast_copyp(__dd_iast_ptr(dst), __dd_iast_ptr(src), len(src))
              }
            }

            // __dd_iast_overwrite makes the bits of dst equal to the bits of
            // src (same length) when one of them is tainted: dst is reused
            // memory that can have old bits.
            func __dd_iast_overwrite(dst, src []byte) {
              if len(src) != 0 && (__dd_iast_anyb(src) || __dd_iast_anyb(dst)) {
                __dd_iast_copyp(__dd_iast_ptr(dst), __dd_iast_ptr(src), len(src))
              }
            }

            // __dd_iast_coarse taints all of out (new memory) and records a
            // coarse derived entry with the source of in.
            func __dd_iast_coarse(out, in []byte) {
              if len(out) == 0 || !__dd_iast_set(__dd_iast_ptr(out), len(out)) {
                return
              }
              __dd_iast_derived(uintptr(__dd_iast_ptr(out)), uintptr(len(out)), uintptr(__dd_iast_ptr(in)), uintptr(len(in)), __dd_iast_mode_coarse)
              runtime.KeepAlive(__dd_iast_ptr(out))
              runtime.KeepAlive(__dd_iast_ptr(in))
            }

            // __dd_iast_positional copies the bits of in to out (new memory,
            // same length) and records a positional derived entry.
            func __dd_iast_positional(out, in []byte) {
              if len(out) == 0 || len(out) != len(in) || !__dd_iast_copyp(__dd_iast_ptr(out), __dd_iast_ptr(in), len(in)) {
                return
              }
              __dd_iast_derived(uintptr(__dd_iast_ptr(out)), uintptr(len(out)), uintptr(__dd_iast_ptr(in)), uintptr(len(in)), __dd_iast_mode_positional)
              runtime.KeepAlive(__dd_iast_ptr(out))
              runtime.KeepAlive(__dd_iast_ptr(in))
            }

            func __dd_iast_clone(b []byte) ([]byte, bool) {
              if !__dd_iast_anyb(b) {
                return nil, false
              }
              r := append([]byte{}, b...)
              __dd_iast_copy(r, b)
              return r, true
            }
