              - name: Replace
    advice:
      - inject-declarations:
          imports:
            utf8: unicode/utf8
          template: |-
            // __dd_iast_replace repeats the body with the bit copies (also
            // for ReplaceAll, which calls Replace).
            func __dd_iast_replace(s, old, new []byte, n int) ([]byte, bool) {
              if !__dd_iast_anyb(s) && !__dd_iast_anyb(new) {
                return nil, false
              }
              m := 0
              if n != 0 {
                m = Count(s, old)
              }
              if m == 0 {
                r := append([]byte(nil), s...)
                __dd_iast_copy(r, s)
                return r, true
              }
              if n < 0 || m < n {
                n = m
              }
              t := make([]byte, len(s)+n*(len(new)-len(old)))
              w := 0
              start := 0
              put := func(src []byte) {
                k := copy(t[w:], src)
                __dd_iast_copy(t[w:w+k], src)
                w += k
              }
              if len(old) > 0 {
                for range n {
                  j := start + Index(s[start:], old)
                  put(s[start:j])
                  put(new)
                  start = j + len(old)
                }
              } else {
                put(new)
                for range n - 1 {
                  _, wid := utf8.DecodeRune(s[start:])
                  j := start + wid
                  put(s[start:j])
                  put(new)
                  start = j
                }
              }
              put(s[start:])
              return t[0:w], true
            }
