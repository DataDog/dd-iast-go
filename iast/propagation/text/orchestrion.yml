  - id: bytes.Buffer.ReadFrom
    join-point:
      all-of:
        - import-path: bytes
        - function-body:
            function:
              - receiver: "*bytes.Buffer"
              - name: ReadFrom
    advice:
      - inject-declarations:
          imports:
            io: io
            runtime: runtime
            unsafe: unsafe
          template: |-
            // __dd_iast_rr_next is heapbits.Next (want true) and
            // heapbits.NextClean (want false), pulled from the woven runtime
            // (nil without weaving).
            //
            //go:linkname __dd_iast_rr_next __dd_iast_heapbits.next
            var __dd_iast_rr_next func(p, n, from uintptr, want bool) uintptr

            // __dd_iast_rr_find returns the first offset in [from, n) of the n
            // bytes at p with a bit equal to want, or n. A result out of
            // [from, n] gives n (no panic on a wrong value).
            //
            //go:noinline
            func __dd_iast_rr_find(p unsafe.Pointer, n, from int, want bool) int {
              f := __dd_iast_rr_next
              if f == nil || from >= n {
                return n
              }
              r := int(f(uintptr(p), uintptr(n), uintptr(from), want))
              runtime.KeepAlive(p)
              if r < from || r > n {
                return n
              }
              return r
            }

            // __dd_iast_rr_runs is the maximum number of tainted runs in the
            // snapshot of the read rule.
            const __dd_iast_rr_runs = 16

            // __dd_iast_read is the read rule of plan section 6.2: a delegated
            // Read into reused memory dst. When dst has bits (and is 64 KiB or
            // less), these steps run, with no allocation:
            //   1. Save at most 16 tainted runs of dst (offset and end) in a
            //      fixed array on the stack. limit is the start of the 17th
            //      run, or len(dst) when dst has 16 runs or less.
            //   2. Clear dst[:limit] only.
            //   3. Call Read, which returns n.
            //   4. Set again the bits of the saved runs in dst[n:limit]. If n
            //      is more than limit, clear dst[limit:n].
            //
            // Thus a byte that Read writes never keeps its old bits (no stale
            // taint): a written byte before limit is cleared before Read, and a
            // written byte from limit is cleared after Read (it also loses its
            // new bits: taint loss only). The tail that Read did not write (all
            // bytes from max(n, limit), and the saved runs in dst[n:limit])
            // keeps its bits, and the values that alias it keep them too.
            //
            // The CPU cost of each read is O(limit/64 + n/64) words of bits for
            // the scan, the clear and the set (at most 1,024 words for each
            // step with 64 KiB), with no allocation. A negative Read result n,
            // or an n that is more than len(dst), counts as a write of all of
            // dst. When the bits cannot be set again (no storage), the tail
            // loses them (taint loss only). When Read panics, the panic goes
            // on, and the saved bits in dst[:limit] are lost (taint loss only).
            func __dd_iast_read(r io.Reader, dst []byte) (int, error) {
              l := len(dst)
              p := unsafe.Pointer(unsafe.SliceData(dst))
              if l == 0 || l > 64<<10 || !__dd_iast_anyb(dst) {
                return r.Read(dst)
              }
              // The snapshot: at most 16 tainted runs [start, end), on the
              // stack. limit is the start of the first run that is not in the
              // snapshot, or l.
              var starts, ends [__dd_iast_rr_runs]int
              k, limit := 0, l
              for off := __dd_iast_rr_find(p, l, 0, true); off < l; {
                end := __dd_iast_rr_find(p, l, off, false)
                if k == len(starts) || end <= off {
                  // Too many runs, or a concurrent change of the bits: the bits
                  // from off are not in the snapshot, and they are not cleared
                  // before Read.
                  limit = off
                  break
                }
                starts[k], ends[k] = off, end
                k++
                off = __dd_iast_rr_find(p, l, end, true)
              }
              if k == 0 && limit == l {
                return r.Read(dst)
              }
              // Clear dst[:limit]: Read can write any byte, and a written byte
              // must have only the bits of the new data.
              __dd_iast_clear(p, limit)
              n, err := r.Read(dst)
              w := n
              if w < 0 || w > l {
                // A wrong result: all of dst can be written.
                w = l
              }
              for i := 0; i < k; i++ {
                start, end := max(starts[i], w), min(ends[i], limit)
                if start < end {
                  __dd_iast_set(unsafe.Add(p, start), end-start)
                }
              }
              if w > limit {
                // The written bytes from limit can have old bits: clear them.
                __dd_iast_clear(unsafe.Add(p, limit), w-limit)
              }
              runtime.KeepAlive(p)
              return n, err
            }

            // __dd_iast_buffer_readfrom is the body with the read rule.
            func __dd_iast_buffer_readfrom(b *Buffer, r io.Reader) (n int64, err error) {
              b.lastRead = opInvalid
              for {
                i := b.grow(MinRead)
                b.buf = b.buf[:i]
                m, e := __dd_iast_read(r, b.buf[i:cap(b.buf)])
                if m < 0 {
                  panic(errNegativeRead)
                }
                b.buf = b.buf[:i+m]
                n += int64(m)
                if e == io.EOF {
                  return n, nil
                }
                if e != nil {
                  return n, e
                }
              }
            }
      - prepend-statements:
          template: |-
            {{- $b := .Function.Receiver -}}
            {{- $r := .Function.Argument 0 -}}
            if __dd_iast_live() {
              return __dd_iast_buffer_readfrom({{ $b }}, {{ $r }})
            }

