  - id: bytes.Repeat
    join-point:
      all-of:
        - import-path: bytes
        - function-body:
            function:
              - name: Repeat
    advice:
      - inject-declarations:
          imports:
            bits: math/bits
            bytealg: internal/bytealg
            unsafe: unsafe
          template: |-
            // __dd_iast_repeat repeats the body with the bit copies. The
            // original body runs for count <= 0 and on overflow (it returns
            // an empty slice or panics).
            func __dd_iast_repeat(b []byte, count int) ([]byte, bool) {
              if count <= 0 || !__dd_iast_anyb(b) {
                return nil, false
              }
              hi, lo := bits.Mul(uint(len(b)), uint(count))
              if hi > 0 || lo > uint(maxInt) {
                return nil, false
              }
              n := int(lo)
              const chunkLimit = 8 * 1024
              chunkMax := n
              if chunkMax > chunkLimit {
                chunkMax = chunkLimit / len(b) * len(b)
                if chunkMax == 0 {
                  chunkMax = len(b)
                }
              }
              nb := bytealg.MakeNoZero(n)[:n:n]
              bp := copy(nb, b)
              __dd_iast_copy(nb[:bp], b)
              for bp < n {
                chunk := min(bp, chunkMax)
                k := copy(nb[bp:], nb[:chunk])
                __dd_iast_copyp(unsafe.Pointer(&nb[bp]), unsafe.Pointer(&nb[0]), k)
                bp += k
              }
              return nb, true
            }
