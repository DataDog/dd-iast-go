              - name: ToValidUTF8
    advice:
      - inject-declarations:
          imports:
            utf8: unicode/utf8
          template: |-
            // __dd_iast_tovalidutf8 repeats the body with the bit copies
            // (exact, plan section 6.2). A run of valid bytes is copied with
            // one bit copy.
            func __dd_iast_tovalidutf8(s, replacement []byte) ([]byte, bool) {
              if !__dd_iast_anyb(s) && !__dd_iast_anyb(replacement) {
                return nil, false
              }
              b := make([]byte, 0, len(s)+len(replacement))
              invalid := false
              run := 0 // start of the valid run of s that ends at i
              flush := func(end int) {
                if end > run {
                  w := len(b)
                  b = append(b, s[run:end]...)
                  __dd_iast_copy(b[w:], s[run:end])
                }
              }
              for i := 0; i < len(s); {
                c := s[i]
                if c < utf8.RuneSelf {
                  i++
                  invalid = false
                  continue
                }
                _, wid := utf8.DecodeRune(s[i:])
                if wid == 1 {
                  flush(i)
                  i++
                  run = i
                  if !invalid {
                    invalid = true
                    w := len(b)
                    b = append(b, replacement...)
                    __dd_iast_copy(b[w:], replacement)
                  }
                  continue
                }
                invalid = false
                i += wid
              }
              flush(len(s))
              return b, true
            }
