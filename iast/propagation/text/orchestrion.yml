                return r, true
              }
              var n int
              if len(sep) > 0 {
                if len(sep) >= maxInt/(len(s)-1) {
                  panic("bytes: Join output length overflow")
                }
                n += len(sep) * (len(s) - 1)
              }
              for _, v := range s {
                if len(v) > maxInt-n {
                  panic("bytes: Join output length overflow")
                }
                n += len(v)
              }
              b := bytealg.MakeNoZero(n)[:n:n]
              bp := copy(b, s[0])
              __dd_iast_copy(b[:bp], s[0])
              for _, v := range s[1:] {
                k := copy(b[bp:], sep)
                __dd_iast_copy(b[bp:bp+k], sep)
                bp += k
                k = copy(b[bp:], v)
                __dd_iast_copy(b[bp:bp+k], v)
                bp += k
              }
              return b, true
            }
